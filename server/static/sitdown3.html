<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Build Studio · The Sit-Down</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
<style>

  /* Type system: DM Sans only (mono only for real table names).
     Four sizes: question 27/600 · voice 18/400 · body 15 · labels 12/500. 8px grid.
     One accent (green) that means "just changed". */
  :root{
    --navy:#1B3139; --navy2:#2E5A6B; --navy3:#5A8A9A;
    --oat:#F5F3EF; --oat2:#EEEDE9; --line:#e6e3dd; --line2:#d8d3ca; --paper:#fffefb;
    --green:#00A870; --green-soft:#e8f7f1; --green-ink:#046a48; --amber:#b7791f;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"DM Sans",system-ui,sans-serif;color:var(--navy);background:var(--oat);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer}
  .num{font-variant-numeric:tabular-nums}
  .mono{font-family:"DM Mono",ui-monospace,monospace;font-size:12px}

  .top{height:52px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line)}
  .top .brand{font-size:15px;font-weight:600}
  .top .lbl{font-size:12px;font-weight:500;color:var(--navy3)}
  .top .sp{flex:1}
  .top .dev{font-size:12px;color:var(--navy3)}
  .hbtn{background:none;border:1px solid var(--line2);border-radius:8px;padding:4px 12px;font-size:12px;font-weight:500;color:var(--navy2);line-height:20px}
  .hbtn:hover{border-color:var(--navy3);color:var(--navy)}

  .stage{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,1fr);height:calc(100% - 52px)}

  /* ───── LEFT: fixed anatomy, no page scroll ───── */
  .left{position:relative;overflow:hidden;padding:0 56px}
  .col{position:relative;height:100%;max-width:720px;display:grid;
    grid-template-rows:64px minmax(0,1fr) 88px}
  /* one chat that pages: each turn block is at least one pane tall */
  #thread{position:relative;overflow-y:auto;min-height:0;padding-right:8px;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16px);mask-image:linear-gradient(to bottom,transparent 0,#000 16px)}
  .blk{display:flex;flex-direction:column;padding:16px 0 24px;box-sizing:border-box}
  .blk.past{opacity:.72}
  .blk.past button,.blk.past textarea,.blk.past input,.blk.past [contenteditable]{pointer-events:none}
  .you{align-self:flex-end;max-width:78%;margin-bottom:24px;background:var(--paper);border:1px solid var(--line);border-radius:12px 12px 4px 12px;
    padding:8px 12px;font-size:15px;line-height:1.5;color:var(--navy2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .you .yl{font-size:12px;font-weight:500;color:var(--navy3);margin-right:8px}
  .yrow{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:24px}
  .yrow .you{margin-bottom:0}
  .yedit{flex:none;background:none;border:none;padding:0;font-size:12px;font-weight:500;color:var(--navy3);text-decoration:underline;
    opacity:0;transition:opacity .2s;pointer-events:auto!important}
  .blk:hover .yedit,.yedit:focus{opacity:1}
  body.busy .yedit{display:none}
  .note{margin:8px 0 0 56px;font-size:15px;color:var(--navy2);min-height:0}
  .note .arr{color:var(--green-ink);margin-left:4px}
  .note .sub{display:block;font-size:12px;color:var(--navy3);margin-top:4px}
  .note.done{color:var(--navy3)} .note .ck{color:var(--green-ink);margin-right:8px}
  .blk #ask,.blk [data-oid="ask"]{margin-top:24px}
  .stk{display:flex;gap:16px;align-items:center;max-width:640px;margin-bottom:16px;padding:12px 16px 12px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
  .stk .face{flex:none;width:44px;height:44px} .stk .face svg{width:44px;height:44px}
  .stk .who2{font-size:12px;font-weight:500;color:var(--gC-i)}
  .stk{border-left:3px solid var(--gC);background:#fffbf3}
  .stk .line{font-size:18px;line-height:28px;color:var(--navy)}
  #hdr{display:flex;align-items:center;gap:16px;min-width:0}
  .segs{display:flex;gap:4px;flex:none}
  .segs i{width:24px;height:4px;border-radius:4px;background:var(--line2)}
  .segs i.done{background:var(--navy2)} .segs i.now{background:var(--navy)}
  #step{font-size:12px;font-weight:500;color:var(--navy3);flex:none}
  #think{flex:1;min-width:0;font-size:12px;color:var(--navy3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;transition:opacity .2s}
  #think.on{opacity:1}
  #hbtns{display:flex;gap:8px;flex:none}

  #ctx{display:flex;align-items:center;gap:8px;min-width:0;border-top:1px solid var(--line)}
  #ctxL{font-size:12px;font-weight:500;color:var(--navy3);flex:none}
  #ctxT{font-size:15px;color:var(--navy2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

  .vrow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;padding-top:16px;min-height:0}
  .av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;
    font-size:12px;font-weight:600;overflow:hidden}
  .av svg{width:36px;height:36px}
  .av.breathe{animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.06);opacity:.7}}
  #who,[data-oid="who"]{font-size:12px;font-weight:500;color:var(--navy3);height:24px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #voiceBox,[data-oid="voiceBox"]{position:relative;min-height:112px}
  #voiceT,[data-oid="voiceT"]{font-size:18px;line-height:28px;color:var(--navy);font-weight:400}
  #voiceBox.over::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;pointer-events:none;
    background:linear-gradient(rgba(245,243,239,0),var(--oat) 85%)}
  #more{position:absolute;right:0;bottom:0;z-index:2;display:none;background:var(--oat);border:none;
    font-size:12px;font-weight:500;color:var(--navy2);text-decoration:underline;text-underline-offset:2px;padding:0 0 2px 8px}
  #voiceBox.over #more{display:block}

  #ask{padding:0 4px 0 0}
  #act{display:flex;align-items:center;gap:16px;border-top:1px solid var(--line);min-width:0}
  #primary{flex:none;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;min-width:152px;justify-content:center;transition:background .2s,opacity .2s}
  #primary:hover:not(:disabled){background:var(--navy2)}
  #primary:disabled{background:var(--line2);cursor:not-allowed}
  #primary kbd{font-family:inherit;font-size:12px;opacity:.6}
  #acts2{display:flex;gap:16px;align-items:center;min-width:0}
  .link{background:none;border:none;padding:0;font-size:15px;color:var(--navy2);text-decoration:underline;text-underline-offset:3px}
  .link:hover{color:var(--navy)}
  #cue{margin-left:auto;font-size:12px;font-weight:500;color:var(--green-ink);opacity:0;transition:opacity .3s;white-space:nowrap}
  #cue.on{opacity:1;animation:nudge 1.6s var(--ease) 1}
  @keyframes nudge{30%{transform:translateX(4px)}}
  body.busy #primary,body.busy .link,body.busy .opt,body.busy .cc,body.busy .srow{pointer-events:none}

  /* ask slot content */
  .q{font-size:27px;font-weight:600;line-height:1.25;letter-spacing:-.01em;margin:0 0 8px}
  .hint{font-size:12px;font-weight:500;color:var(--navy3);margin:0 0 16px}
  .body{font-size:15px;line-height:1.55;color:var(--navy2);margin:0 0 16px;max-width:600px}
  .opts{display:grid;gap:8px;max-width:640px}
  .opt{display:flex;gap:16px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;padding:12px 16px;transition:border-color .2s,background .2s,opacity .25s}
  .opt:hover{border-color:var(--navy3)}
  .opt .k{flex:none;width:20px;height:20px;margin-top:2px;border:1.5px solid var(--line2);border-radius:6px;display:grid;place-items:center;
    font-size:12px;color:transparent;transition:all .15s}
  .opt.on{border-color:var(--navy);background:#fff}
  .opt.on .k{background:var(--navy);border-color:var(--navy);color:#fff}
  .opt .t{font-size:15px;font-weight:600;line-height:1.4}
  .opt .s{font-size:15px;color:var(--navy3);line-height:1.4}
  .opt.freec{cursor:text;border-style:dashed}
  .opt.freec:focus-within{border-style:solid;border-color:var(--navy2);background:#fff}
  .opt.freec .k{border-style:dashed}
  .fw{flex:1;min-width:0}
  textarea.tx{display:block;width:100%;border:none;background:none;resize:none;font:inherit;font-size:15px;color:var(--navy);outline:none;padding:0;min-height:24px;overflow:hidden}
  textarea.tx::placeholder{color:#9fb0b5}
  .opt.carried{opacity:.2}
  .editbox{max-width:640px;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:12px 16px}
  .editbox:focus-within{border-color:var(--navy2)}
  .editbox .lb{font-size:12px;font-weight:500;color:var(--navy3);margin-bottom:8px}
  .errnote{max-width:600px;border:1px solid #efd9ae;background:#fffaf0;color:#7a5412;border-radius:12px;padding:12px 16px;font-size:15px}
  .idea{display:block;width:100%;max-width:640px;min-height:144px;border:1px solid var(--line2);border-radius:12px;background:var(--paper);
    padding:16px;font:inherit;font-size:18px;line-height:28px;color:var(--navy);outline:none;resize:none}
  .idea:focus{border-color:var(--navy3);background:#fff}

  /* shapes */
  .cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:680px}
  .cc{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;
    transition:border-color .2s,box-shadow .2s,opacity .25s}
  .cc:hover{border-color:var(--navy3)}
  .cc.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
  .cc svg{width:100%;height:72px;background:var(--oat);border-radius:8px}
  .cc .t{font-size:15px;font-weight:600;line-height:1.3}
  .cc .d,.cc .fs,.cc .tr{font-size:12px;line-height:1.45;color:var(--navy2)}
  .cc .fs b,.cc .tr b{font-weight:500;color:var(--navy3)}
  .cc .rec{align-self:flex-start;font-size:12px;font-weight:500;color:var(--navy2);border:1px solid var(--line2);border-radius:6px;padding:0 8px}
  .cc .why{font-size:12px;color:var(--navy2);border-top:1px solid var(--line);padding-top:8px}
  .cc.carried{opacity:.2}
  .onecard{max-width:420px}
  .onecard svg{height:112px}
  #shapebox{margin-top:16px}

  /* scope */
  .meter{max-width:640px;margin-bottom:16px}
  .meter .row{display:flex;justify-content:space-between;align-items:baseline}
  .meter .row span{font-size:12px;font-weight:500;color:var(--navy3)}
  .meter .row b{font-size:15px;font-weight:600}
  .bar{position:relative;height:8px;border-radius:8px;background:var(--oat2);margin-top:8px}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--navy2);transition:width .45s var(--ease),background .3s}
  .bar .fill.over{background:var(--gD)} .bar .fill.ok{background:var(--gA)} .bar .fill.tight{background:var(--gC)}
  .bar .cap{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy)}
  .bmsg{font-size:12px;color:var(--navy3);margin-top:8px;min-height:18px}
  .bmsg.over{color:var(--amber)}
  .srows{display:grid;gap:8px;max-width:640px}
  .srow{display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 16px;cursor:pointer;transition:opacity .25s}
  .srow.off{background:transparent;opacity:.55}
  .srow .nm{flex:1;min-width:0}
  .srow .nm div{font-size:15px;font-weight:500}
  .srow .nm small{display:block;font-size:12px;color:var(--navy3)}
  .srow .pts{font-size:12px;color:var(--navy3);width:48px;text-align:right}
  .sw{width:36px;height:20px;border-radius:20px;background:var(--line2);position:relative;flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
  .sw.on{background:var(--navy2)} .sw.on::after{transform:translateX(16px)}
  .yours{font-size:12px;font-weight:500;color:var(--navy3);border:1px dashed var(--line2);border-radius:6px;padding:0 6px;margin-left:8px}
  .addf{display:flex;gap:8px;align-items:center;max-width:640px;margin-top:16px;border-bottom:1px solid var(--line2);padding:8px 0}
  .addf input{flex:1;border:none;background:none;font:inherit;font-size:15px;color:var(--navy);outline:none}
  .addf input::placeholder{color:#9fb0b5}
  .smallbtn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:4px 12px;font-size:12px;font-weight:500}

  /* scope: packages + lanes */
  .pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:680px}
  .pkg{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;transition:border-color .2s,box-shadow .2s}
  .pkg:hover{border-color:var(--navy3)} .pkg.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
  .pkg .ph{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .pkg .t{font-size:15px;font-weight:600}
  .pkg .rec{font-size:12px;font-weight:500;color:var(--navy2);border:1px solid var(--line2);border-radius:6px;padding:0 8px}
  .pkg .d{font-size:12px;color:var(--navy2);line-height:1.45}
  .pkg .pl{font-size:12px;line-height:1.5;color:var(--navy)} .pkg .pl b{display:block;font-weight:500;color:var(--navy3)}
  .pkg .pl.m,.pkg .m{color:var(--navy3)}
  .pkg .pf{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
  .fit{font-size:12px;font-weight:500;color:var(--navy2);background:var(--oat2);border-radius:20px;padding:0 8px;line-height:20px;white-space:nowrap}
  .fit.ok{color:var(--gA-i);background:var(--gA-s)} .fit.tight{color:var(--gC-i);background:var(--gC-s)} .fit.no{color:var(--gD-i);background:var(--gD-s)}
  .daybar{max-width:680px;margin:16px 0 8px}
  .daybar .row{display:flex;justify-content:space-between;align-items:center} .daybar .row span{font-size:12px;font-weight:500;color:var(--navy3)}
  .lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:680px}
  .lane{background:var(--oat2);border:1px dashed transparent;border-radius:12px;padding:8px;min-height:96px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s}
  .lane.over{border-color:var(--navy3);background:#e9e7e1}
  .lane .lh{font-size:12px;font-weight:500;color:var(--navy3);padding:0 4px}
  .lane .empty{font-size:12px;color:#9fb0b5;padding:8px 4px}
  .fchip{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:grab}
  .fchip.dragging{opacity:.4} .fchip.locked{cursor:default;border-style:dashed}
  .fchip .fn{font-size:12px;font-weight:600;line-height:1.4}
  .fchip .fm{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
  .fchip .why{font-size:12px;color:var(--navy3);margin-top:4px;line-height:1.4}
  .eff{display:inline-flex;align-items:center;gap:2px;font-size:12px;color:var(--navy3)} .eff span{margin-left:4px}
  .eff.lock{color:#7a5412}
  .mv{background:none;border:none;padding:0;font-size:12px;color:var(--navy2);text-decoration:underline}
  .mvmenu{position:absolute;right:8px;top:100%;z-index:5;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px -16px rgba(27,49,57,.45);display:grid;padding:4px}
  .mvmenu button{background:none;border:none;text-align:left;font-size:12px;padding:4px 8px;border-radius:6px} .mvmenu button:hover{background:var(--oat)}

  /* read-back */
  .rb{max-width:640px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
  .rbl{display:grid;grid-template-columns:88px 1fr;gap:16px;padding:12px 16px;align-items:baseline}
  .resume{display:flex;align-items:center;gap:16px;max-width:640px;margin-bottom:16px;padding:8px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:15px}
  .resume span{flex:1;color:var(--navy2)}
  .rbl + .rbl{border-top:1px solid var(--line)}
  .rbl span{font-size:12px;font-weight:500;color:var(--navy3)}
  .rbl div{font-size:15px;line-height:1.5;outline:none;border-radius:6px;cursor:text}
  .rbl div:focus{box-shadow:0 0 0 2px var(--line2)}
  .rbx{max-width:640px;display:grid;gap:16px;margin-top:16px}
  .rbx h5{margin:0 0 8px;font-size:12px;font-weight:500;color:var(--navy3)}
  .rbx ul{margin:0;padding-left:18px} .rbx li{margin:4px 0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line2);background:var(--paper);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--navy2)}
  .chip.gen{border-style:dashed}

  /* carried-over ghost */
  .ghost{position:fixed;z-index:40;pointer-events:none;background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:15px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform-origin:left top}
  .ghost.voice{background:none;border:none;padding:0;font-size:18px;font-weight:400;line-height:28px;white-space:normal;max-height:112px}

  /* ───── RIGHT: the brief waits its turn ───── */
  .brief{background:var(--oat2);border-left:1px solid var(--line);overflow-y:auto;padding:24px 32px 48px;transition:opacity .45s var(--ease)}
  .bhd{display:flex;gap:16px;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .ring{position:relative;width:64px;height:64px;flex:none}
  .ring svg{width:64px;height:64px;transform:rotate(-90deg)}
  .ring .trk{fill:none;stroke:var(--line2);stroke-width:5}
  .ring .val{fill:none;stroke:var(--navy2);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease),stroke .6s var(--ease)}
  .ring .L{transition:color .6s var(--ease)}
  .ring .L{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:600}
  .ring .L.pop{animation:pop .6s var(--ease)}
  @keyframes pop{0%{transform:scale(.8);opacity:.3}100%{transform:none;opacity:1}}
  .ideaw{min-width:0;flex:1}
  .ideaw .lb{font-size:12px;font-weight:500;color:var(--navy3);display:flex;gap:8px;align-items:center}
  .ideaw .lb button{background:none;border:none;padding:0;font-size:12px;color:var(--navy3);text-decoration:underline}
  #ideaT{font-size:15px;line-height:1.5;margin-top:4px}
  #ideaO{font-size:12px;color:var(--navy3);margin-top:4px;text-decoration:line-through}
  #sharp{font-size:12px;font-weight:500;color:var(--navy3);margin-top:8px;min-height:18px}
  #sharp.flash{animation:sharp 3s var(--ease) both}
  @keyframes sharp{0%,60%{color:var(--green-ink)}100%{color:var(--navy3)}}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:8px}
  .card .lb{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:500;color:var(--navy3)}
  .card .tx{font-size:15px;line-height:1.5;margin-top:8px;border-radius:6px;outline:none}
  .card:not(.draft) .tx{cursor:text}
  .card .tx[contenteditable=true]{box-shadow:0 0 0 2px var(--line2);padding:2px 4px;margin-left:-4px;margin-right:-4px}

  @keyframes solid{0%{background:var(--green-soft);border-color:var(--green)}100%{background:var(--paper);border-color:var(--line)}}
  /* grade scale: A green · B teal · C amber · D/F lava. Chips, ring and the old→new moment share it. */

  .openl{margin-top:16px}

  /* sheets: I'm lost + handoff */
  .veil{position:fixed;inset:0;background:rgba(245,243,239,.78);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;
    padding:64px 24px;z-index:25;overflow-y:auto}

  .hand .hh h3{margin:0;font-size:27px;font-weight:600} .hand .hh p{margin:0;color:#b9cdd3;font-size:15px}
  .hand .hh .sp{flex:1}

  .hand.inl pre{max-height:none}
  .hand pre{margin:0;padding:24px;white-space:pre-wrap;font-family:"DM Mono",ui-monospace,monospace;font-size:12px;line-height:1.6;max-height:60vh;overflow:auto;border-right:1px solid var(--line)}
  .hand .side{padding:24px;background:var(--oat)}
  .hand .side .gl div{display:flex;justify-content:space-between;align-items:center;font-size:15px;line-height:32px}
  .hand .ship{width:100%;margin-top:16px;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:8px 16px;font-size:15px;z-index:60}

  /* first-run tour */
  body.tour-hideAsk #ask,body.tour-hideAsk #act,body.tour-hideAsk #note{visibility:hidden}
  body.tour-hideR .brief{opacity:0;pointer-events:none}
  .tour-focus{border-radius:12px;box-shadow:0 0 0 3px var(--green),0 0 0 8px rgba(0,168,112,.14)}
  .tourmark{position:fixed;z-index:50;width:320px;background:var(--navy);color:#fff;border-radius:12px;padding:16px;box-shadow:0 20px 44px -18px rgba(27,49,57,.6)}
  .tourmark p{margin:0;font-size:15px;line-height:1.5}

  .tourmark .tn{background:#fff;color:var(--navy);border:none;border-radius:8px;padding:4px 16px;font-size:15px;font-weight:600}

  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:1100px){.left{padding:0 32px}.cgrid{grid-template-columns:1fr}}

  /* ───── conversational agent additions ───── */
  .col{grid-template-rows:64px minmax(0,1fr) auto}
  #thread{overflow-anchor:none}

    font:inherit;font-size:15px;line-height:24px;color:var(--navy);outline:none;max-height:120px;overflow-y:auto}

  .driftc .lb{font-size:12px;font-weight:500;color:var(--navy3)} .driftc .tx{font-size:15px;margin:4px 0 16px}
  .driftc .bs{display:flex;gap:8px;flex-wrap:wrap}
  .ghostbtn{background:none;border:1px solid var(--line2);border-radius:10px;padding:10px 18px;font-size:15px;font-weight:500;color:var(--navy)}
  .ghostbtn:hover{border-color:var(--navy3)}
  .mdprev{margin-top:16px;max-width:680px}
  .mdprev pre{margin:8px 0 0;white-space:pre-wrap;font-family:"DM Mono",ui-monospace,monospace;font-size:12px;line-height:1.6;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;max-height:320px;overflow:auto}
  /* smooth stream: append-only word chunks that fade in, calm caret */
  #voiceT .w,[data-oid="voiceT"] .w{animation:wIn .14s linear both}
  @keyframes wIn{from{opacity:0}to{opacity:1}}

    opacity:.45;animation:caret 1.4s ease-in-out infinite;transition:opacity .3s}

  .char .arms-x,.char .arms-d{transition:opacity .45s ease,transform .55s cubic-bezier(.2,.7,.2,1.2)}

  .charwrap{position:relative;flex:none;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.2,.7,.2,1.2)}

    padding:12px 16px;margin-bottom:18px;box-shadow:0 14px 30px -24px rgba(27,49,57,.5);transform-origin:0 100%;animation:bubIn .45s cubic-bezier(.2,.7,.2,1.25) both}

  .dots.muted i{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
  .dots i.fill{animation:dotFill .7s var(--ease) both}
  @keyframes dotFill{0%{transform:scale(.4);box-shadow:0 0 0 0 rgba(0,168,112,.55)}50%{transform:scale(1.35);box-shadow:0 0 0 5px rgba(0,168,112,0)}100%{transform:none}}
  .ringcov{font-size:12px;font-weight:500;color:var(--navy3);white-space:nowrap}

<body>
<div class="top">
  <span class="brand">Build Studio</span><span class="lbl">The Sit-Down</span>
  <span class="sp"></span><span class="dev" id="dev"></span>
  <button class="hbtn" onclick="resetAll()">Start over</button>
</div>

<div class="stage">

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const noDash=s=>String(s==null?'':s).replace(/\s*\u2014\s*/g,', ');
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const SEED="";
const IDEA_PH="Like: our planners scramble when things change at the last minute. I want something that spots problems early and suggests what to do.";
let CFG={grades:["F","D-","D","D+","C-","C","C+","B-","B","B+","A-","A","A+"],
  dims:[{key:"problem",label:"Problem"},{key:"user_moment",label:"User & moment"},{key:"objective",label:"Objective"},
        {key:"decision",label:"Decision it drives"},{key:"data",label:"Data reality"},{key:"scope",label:"Scope for a day"},{key:"risk",label:"Biggest risk"}],
  stages:["problem","user_moment","objective","decision","data","risk","shapes","scope","readback"],day_capacity:6};
const SHARP=["problem","user_moment","objective","decision","data","risk"];
const STAGE_LABEL={problem:"Problem",user_moment:"User & moment",objective:"Objective",decision:"Decision",data:"Data",risk:"Risk",shapes:"Ways to build it",scope:"Fit it in a day",readback:"Your plan"};
const label=k=>(CFG.dims.find(d=>d.key===k)||{}).label||k;
const SKEY='sitdown3_session';
/* defensive: the model can send the wrong shape; lists are lists or nothing */
const arr=x=>Array.isArray(x)?x:[];
const obj=x=>(x&&typeof x==='object'&&!Array.isArray(x))?x:{};
const optList=x=>arr(x).map(o=>typeof o==='string'?{label:o}:o).filter(o=>o&&typeof o==='object'&&o.label);
const strList=x=>arr(x).filter(v=>typeof v==='string'||typeof v==='number').map(String);

/* SESSION is the server's session (state + message window), replaced on every done.
   DISP is what the right pane shows; it only moves after the SA finishes speaking. */
const freshDisp=()=>({grades:{},brief:{},settled:[],north:'',sharper:''});
let SESSION=null,DISP=freshDisp(),TURNS=[],ELS=[],LANDEL=null,BUSY=false,TOUR=null,STREAMING=false,SCROLLING=false,DRAFTS=[],ERRBLK=null,KEYS={};
let TOURED=false;try{TOURED=localStorage.getItem('sitdown3_toured')==='1'}catch(e){}
window.__turns=[];

/* ───────── thread: one chat that pages ───────── */
const thr=()=>$('thread');
function blockHTML(you){
  return (you?`<div class="yrow"><button class="yedit" title="Edit this and continue from here">Edit</button><div class="you"><span class="yl">You</span>${esc(noDash(you))}</div></div>`:'')+
    `<div class="vrow" id="voiceRow"><div class="av" id="av">SA</div><div><div id="who">Your SA</div><div id="voiceBox"><div id="voiceT"></div></div></div></div>
     <div class="note" id="note"></div><div id="ask"></div>`;

function deactivate(b){if(!b)return;b.classList.add('past');b.style.minHeight='';b.querySelectorAll('[id]').forEach(e=>{e.dataset.oid=e.id;e.removeAttribute('id')})}
function reactivate(b){b.classList.remove('past');b.querySelectorAll('[data-oid]').forEach(e=>{e.id=e.dataset.oid;e.removeAttribute('data-oid')});b.style.minHeight=thr().clientHeight+'px'}
function easeIO(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function flushVoice(){}
/* Smooth stream: network chunks go into a buffer; a rAF loop reveals whole words at an
   adaptive rate (steady ~48 chars/s, faster when the backlog grows so it never trails the
   network by more than ~300ms, brisk drain at the end). Append-only DOM, no rewrites. */
function makeStream(el,{onFirst,onEnd}={}){
  el.textContent='';const caret=document.createElement('span');caret.className='caret';el.appendChild(caret);
  let full='',shown=0,fin=false,raf=0,last=0,budget=0,started=false,stopped=false,lastPush=performance.now();
  const WORD=/\S+\s+/y;
  const frame=now=>{
    if(stopped)return;
    const dt=last?Math.min(64,now-last):16;last=now;
    if(SCROLLING){raf=requestAnimationFrame(frame);return}          // words only on a still page
    const backlog=full.length-shown;
    let rate=Math.max(48,backlog/0.3);if(fin)rate=Math.max(rate,backlog/0.12,200);   // brisk drain once the prose is complete
    budget=Math.min(budget+rate*dt/1000,40);
    let target=shown,words=0;
    while(words<(fin?3:2)){WORD.lastIndex=target;const m=WORD.exec(full);let nx=m?WORD.lastIndex:-1;
      const idle=!fin&&performance.now()-lastPush>500;             // stalled network: don't hold a finished-looking word
      if(nx<0&&(fin||idle)&&target<full.length)nx=full.length;      // last word, no trailing space
      if(nx<0)break;
      if(nx-shown>budget&&budget<40)break;                         // reveal a whole word once the budget covers it
      target=nx;words++}
    if(target>shown){const w=document.createElement('span');w.className='w';w.textContent=full.slice(shown,target).replace(/\s*\u2014\s*/g,', ');
      el.insertBefore(w,caret);budget=Math.max(0,budget-(target-shown));shown=target;
      if(!started){started=true;onFirst&&onFirst()}
      el.dispatchEvent(new CustomEvent('reveal',{detail:{shown}}))}
    if(fin&&shown>=full.length){caret.classList.add('gone');setTimeout(()=>caret.remove(),320);stopped=true;onEnd&&onEnd();return}
    raf=requestAnimationFrame(frame);
  };
  return{push(t){full+=t;lastPush=performance.now();if(!raf)raf=requestAnimationFrame(frame)},
    finish(){fin=true;if(!raf)raf=requestAnimationFrame(frame)},
    abort(){stopped=true;cancelAnimationFrame(raf);caret.remove()}};
}
function scrollThreadTo(top,ms){
  const th=thr(),from=th.scrollTop,d=top-from;
  if(RM||!ms||Math.abs(d)<2){th.scrollTop=top;SCROLLING=false;flushVoice();return}
  SCROLLING=true;const t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/ms);th.scrollTop=from+d*easeIO(k);if(k<1)requestAnimationFrame(step);else{SCROLLING=false;flushVoice()}};
  requestAnimationFrame(step);
}
/* the participant's words open a new page; one smooth scroll lifts them to the top */
function turnPage(you,anim=true){
  const th=thr(),cur=th.lastElementChild;deactivate(cur);
  const b=document.createElement('div');b.className='blk';b.innerHTML=blockHTML(you);b.style.minHeight=th.clientHeight+'px';
  th.appendChild(b);scrollThreadTo(b.offsetTop,anim&&cur?600:0);return b;
}
function setNote(html,cls){const n=$('note');if(n){n.className='note'+(cls?' '+cls:'');n.innerHTML=html||''}}
function setThinking(t){const el=$('think');el.textContent=t||'';el.classList.toggle('on',!!t)}
function setBusy(b){BUSY=b;document.body.classList.toggle('busy',b);syncChatbar()}
function syncChatbar(){const on=!!SESSION&&!BUSY&&!TOUR;$('cin').disabled=!on;$('csend').disabled=!on||!$('cin').value.trim();
  $('cin').placeholder=!SESSION?'Start with your idea above':OPENQ||"Say it your way, or tell me what I'm missing…"}

/* ───────── header ───────── */
function paintHeader(){
  const st=SESSION&&SESSION.stage,dims=CFG.dims.map(d=>d.key),cov=dims.filter(k=>DISP.brief[k]);
  $('segs').innerHTML=SESSION?dims.map(k=>`<i class="${DISP.brief[k]?'done':''}" title="${esc(label(k))}"></i>`).join(''):'';
  $('step').textContent=!st?'Before we start':SHARP.includes(st)?`Sharpening your idea · ${cov.length} of ${dims.length} covered`:(STAGE_LABEL[st]||'');
  $('hbtns').innerHTML=(TURNS.length&&!BUSY?'<button class="hbtn" onclick="goBack()">Back</button>':'')+(SESSION?'<button class="hbtn" onclick="openLost()">I\'m lost</button>':'');
  const w=$('wrapup');if(w){const n=SHARP.filter(k=>DISP.brief[k]).length;w.hidden=!(SESSION&&SHARP.includes(st)&&n>=3&&!BUSY&&!TOUR)}

/* ───────── the one call: /api/sitdown/chat ───────── */
async function send(text,meta,you){
  text=String(text||'').trim();if(BUSY||!text)return;
  if(ERRBLK)dropErr();
  const first=!SESSION,tour=first&&!TOURED;
  OPENQ=null;$('chatbar').classList.remove('askme');
  if(document.activeElement&&document.activeElement!==$('cin'))document.activeElement.blur();   // a stale landing button must not re-fire on Enter
  const turn={you:you||text,text:'',ui:[],events:[],req:{text,meta:meta||{}},sessBefore:clone(SESSION),dispBefore:clone(DISP)};
  TURNS.push(turn);ELS.push(turnPage(turn.you));
  if(tour)document.body.classList.add('touring','tour-hideAsk','tour-hideR');
  setBusy(true);paintHeader();setThinking(first?'Reading your idea…':'Reading your answer…');$('av').classList.add('breathe');
  const t0=performance.now();let firstAt=null,done=null;
  const reveal=new Promise(res=>{turn._stream=makeStream($('voiceT'),{
    onFirst:()=>{setThinking('');$('av').classList.remove('breathe');if(tour)startTour()},
    onEnd:()=>{turn.words_done_ms=Math.round(performance.now()-t0);
      if(!done){const a=$('ask');if(a&&!a.innerHTML)a.innerHTML='<div class="pend" aria-label="Preparing the next step"><i></i><i></i><i></i></div>'}
      res()}})});
  try{
    const resp=await fetch('/api/sitdown/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session:SESSION,text,meta:meta||{}})});
    if(!resp.ok||!resp.body)throw new Error('The server answered '+resp.status);
    const rd=resp.body.getReader(),dec=new TextDecoder();let buf='',err=null;
    const take=line=>{line=line.trim();if(!line)return;let ev;try{ev=JSON.parse(line)}catch(e){return}
      if(ev.type==='text_delta'&&typeof ev.text==='string'){if(firstAt==null)firstAt=performance.now()-t0;turn.text+=ev.text;turn._stream.push(ev.text)}
      else if(ev.type==='text_end'){if(!turn._ended){turn._ended=true;turn.text_end_ms=Math.round(performance.now()-t0);turn._stream.finish()}}
      else if(ev.type==='done')done=ev;else if(ev.type==='error')err=ev.message};
    for(;;){const {value,done:fin}=await rd.read();if(value)buf+=dec.decode(value,{stream:true});
      let nl;while((nl=buf.indexOf('\n'))>=0){take(buf.slice(0,nl));buf=buf.slice(nl+1)}if(fin)break}
    take(buf);
    if(!done)throw new Error(err||"The SA's reply did not come through.");
    if(!turn.text&&done.text){turn.text=String(done.text);turn._stream.push(turn.text)}
    turn._stream.finish();
  }catch(e){
    if(turn._stream)turn._stream.abort();delete turn._stream;
    setThinking('');$('av').classList.remove('breathe');setBusy(false);
    if(TOUR)endTour();
    TURNS.pop();ELS.pop();ERRBLK={text,meta,you};
    $('ask').innerHTML=`<div class="errnote">${esc(e.message||String(e))}</div><div class="crow"><button class="cbtn" id="retry">Retry</button></div>`;
    $('retry').onclick=()=>{const r=ERRBLK;dropErr();send(r.text,r.meta,r.you)};
    paintHeader();return;
  }
  await reveal;delete turn._stream;
  SESSION=obj(done.session);turn.ui=arr(done.ui);turn.events=arr(done.events);
  turn.stats={first_ms:done.first_ms,ms:done.ms,model:done.model,client_first_ms:Math.round(firstAt||0),text_end_ms:turn.text_end_ms||null,words_done_ms:turn.words_done_ms||null,done_ms:Math.round(performance.now()-t0)};
  delete turn._ended;window.__turns.push(turn.stats);
  $('dev').textContent=`${String(done.model||'').replace('databricks-','')} · first ${done.first_ms}ms · ${done.ms}ms`;
  setThinking('');$('av').classList.remove('breathe');
  if(turn.ui.some(u=>u&&u.type==='readback')){const a=$('ask');if(a&&!a.innerHTML)a.innerHTML='<div class="pend" aria-label="Pulling your plan together"><i></i><i></i><i></i></div>';
    await playEvents(turn.events,false);renderUI(turn,true)}
  else{renderUI(turn,true);playEvents(turn.events,false)}
  setBusy(false);applyOpenQ();paintHeader();save();
  if(TOUR)TOUR.ready=true,showMark(TOUR.i,true);
}
