<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Direction A · Living Doc · Build Studio pressure test</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#1B3139; --navy2:#2E5A6B; --navy3:#5A8A9A;
  --oat:#F5F3EF; --oat2:#EEEDE9; --line:#e6e3dd; --line2:#d8d3ca;
  --green:#00A870; --gsoft:#e8f7f1; --gink:#046a48;
  --lava:#FF3621; --amber:#F59E0B;
  --ink:#1B3139; --muted:#5A8A9A; --paper:#fffefc;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--oat);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono,.num{font-family:"DM Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;height:52px;display:flex;align-items:center;gap:14px;padding:0 22px;
  background:rgba(245,243,239,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top a.back{color:var(--navy2);text-decoration:none;font-weight:600;font-size:13px}
.top a.back:hover{color:var(--navy)}
.tag{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy3);
  border:1px solid var(--line2);border-radius:99px;padding:3px 10px}
.top .sp{flex:1}
.mini{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--navy3);opacity:0;transform:translateY(-4px);transition:.3s var(--ease)}
.mini.on{opacity:1;transform:none}
.mini b{font-family:"Instrument Serif",serif;font-weight:400;font-size:22px;color:var(--navy);line-height:1}
.btn-ghost{background:none;border:1px solid var(--line2);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--navy2)}
.btn-ghost:hover{border-color:var(--navy3);color:var(--navy)}

/* ---------- layout ---------- */
.stage{max-width:1220px;margin:0 auto;padding:28px 24px 120px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
@media (max-width:1000px){.stage{grid-template-columns:1fr}.margin{min-height:0!important}}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:44px 60px 64px 100px;
  box-shadow:0 1px 0 rgba(27,49,57,.03),0 18px 40px -28px rgba(27,49,57,.22);position:relative}

/* ---------- doc header ---------- */
.dh{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:start;padding-bottom:26px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy3)}
h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:46px;line-height:1.02;margin:8px 0 10px;letter-spacing:-.01em}
h1 em{color:var(--navy2)}
.meta{font-size:13px;color:var(--navy3)}
.status{margin-top:14px;font-size:13px;color:var(--navy2);min-height:20px;display:flex;align-items:center;gap:8px}
.status .ver{font-family:"DM Mono",monospace;font-size:12px;background:var(--oat);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--navy)}
.status .up{color:var(--gink);font-weight:600}
.dots span{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--navy3);margin:0 1.5px;animation:dots 1.1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,80%,100%{opacity:.25}40%{opacity:1}}

.medal{text-align:right;min-width:190px}
.medal .g{font-family:"Instrument Serif",serif;font-size:92px;line-height:.85;display:inline-block;transition:color .4s}
.medal .sc{font-size:12px;color:var(--navy3);margin-top:6px}
.medal .acts{display:flex;flex-direction:column;gap:8px;margin-top:14px;align-items:flex-end}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy2)}
.btn-navy:disabled{opacity:.5;cursor:default}
.btn-green{background:var(--green);color:#fff;display:none}
.btn-green.on{display:inline-block;animation:rise .5s var(--ease)}
.btn-green:hover{background:var(--gink)}
.link{background:none;border:none;color:var(--navy3);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:0}
.link:hover{color:var(--navy)}
.pop{animation:pop .6s var(--ease)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18) rotate(-3deg)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* rubric strip */
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:22px}
.cell{border-radius:8px;padding:7px 8px 6px;border:1px solid var(--line);background:var(--oat);cursor:pointer;transition:.35s var(--ease);text-align:left}
.cell:hover{border-color:var(--line2)}
.cell .l{font-size:10.5px;color:var(--navy3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cell .v{font-family:"DM Mono",monospace;font-size:13px;font-weight:500}
.t-a{--c:var(--gink);--bg:var(--gsoft);--bd:#bfe6d6}
.t-b{--c:var(--navy2);--bg:#e9f0f2;--bd:#cfdde2}
.t-c{--c:#9a6206;--bg:#fdf4e2;--bd:#f3dcb0}
.t-d{--c:#c22a18;--bg:#fff0ed;--bd:#fbcfc7}
.cell.t-a,.cell.t-b,.cell.t-c,.cell.t-d{background:var(--bg);border-color:var(--bd)}
.cell .v{color:var(--c)}

/* v1 quote */
.origin{margin:30px 0 8px;padding:14px 18px;border-left:3px solid var(--line2);color:var(--navy2);font-family:"Instrument Serif",serif;font-style:italic;font-size:20px;line-height:1.4}
.origin small{display:block;font-family:"DM Mono",monospace;font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy3);margin-bottom:4px}

/* ---------- sections ---------- */
.sec{position:relative;padding:22px 0 20px;border-bottom:1px dashed var(--line);transition:background .3s}
.sec:last-of-type{border-bottom:none}
.sec::before{content:"";position:absolute;left:-18px;top:22px;bottom:20px;width:2px;border-radius:2px;background:transparent;transition:background .3s}
.sec.hl::before{background:var(--navy3)}
.sec.reading::before{background:var(--green);animation:scan .9s var(--ease)}
@keyframes scan{from{transform:scaleY(0);transform-origin:top}to{transform:scaleY(1);transform-origin:top}}
.gchip{position:absolute;left:-78px;top:20px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-family:"Instrument Serif",serif;font-size:24px;line-height:1;background:var(--bg);color:var(--c);border:1px solid var(--bd);transition:background .4s,color .4s,border-color .4s}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h2{margin:0;font-size:13px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--navy)}
.budget{font-size:11.5px;color:var(--navy3);display:flex;gap:8px;align-items:center;opacity:.55;transition:opacity .2s}
.sec:hover .budget,.sec:focus-within .budget,.budget.over{opacity:1}
.budget.over{color:#b36b00}
.budget.over .wc{font-weight:600}
.tighten{display:none;background:#fff6e5;border:1px solid #f3d49a;color:#8a5300;border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:600}
.budget.over .tighten{display:inline-block}
.q{margin:3px 0 8px;color:var(--navy3);font-size:13.5px}
.body{font-size:17px;line-height:1.6;color:var(--ink);outline:none;white-space:pre-wrap;min-height:28px;border-radius:6px;padding:2px 0;transition:background .2s}
.body:focus{background:linear-gradient(transparent 0,transparent)}
.body:empty::before{content:attr(data-ph);color:#a9bcc2;font-style:italic}
mark.ins{background:var(--gsoft);color:var(--gink);border-radius:4px;padding:0 2px;animation:ink 2.4s var(--ease) forwards}
@keyframes ink{0%{background:#b8ecd8}70%{background:var(--gsoft)}100%{background:transparent;color:inherit}}

.parked{margin-top:34px;padding:16px 18px;border:1px dashed var(--line2);border-radius:12px;display:none}
.parked.on{display:block;animation:rise .4s var(--ease)}
.parked h3{margin:0 0 8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--navy3)}
.pchip{display:inline-block;background:var(--oat);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:13px;margin:0 6px 6px 0;color:var(--navy2)}

/* ---------- comments margin ---------- */
.margin{position:relative}
.mhead{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--navy3);display:flex;justify-content:space-between;margin:2px 2px 0}
.cmt{position:absolute;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px;
  box-shadow:0 10px 24px -20px rgba(27,49,57,.4);transition:top .45s var(--ease),opacity .3s,transform .3s,border-color .2s;}
.cmt.new{animation:slidein .45s var(--ease) both}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.cmt.hl{border-color:var(--navy3)}
.cmt.gone{opacity:0;transform:translateX(18px) scale(.98);pointer-events:none}
.cmt-top{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:6px}
.av{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.03em}
.who{font-weight:600}
.kind{font-family:"DM Mono",monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border-radius:5px;padding:1px 6px;background:var(--oat);color:var(--navy2)}
.anchor{margin-left:auto;color:var(--navy3);font-size:11.5px}
.k-pushback{border-left:3px solid var(--lava)} .k-pushback .kind{background:#fff0ed;color:#c22a18}
.k-good{border-left:3px solid var(--green)} .k-good .kind{background:var(--gsoft);color:var(--gink)}
.k-guard{border-left:3px solid var(--amber)} .k-guard .kind{background:#fff6e5;color:#8a5300}
.k-ready{border-left:3px solid var(--green);background:linear-gradient(#fff,#fbfefd)} .k-ready .kind{background:var(--green);color:#fff}
.k-concept .kind{background:var(--navy);color:#fff}
.k-park .kind{background:var(--oat2);color:var(--navy2)}
.cmt-b{margin:0 0 9px;font-size:14px;line-height:1.5}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{text-align:left;background:var(--oat);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;line-height:1.4;color:var(--navy);display:flex;gap:8px;transition:.15s}
.chip:hover{background:var(--gsoft);border-color:#bfe6d6;color:var(--gink)}
.chip .plus{font-family:"DM Mono",monospace;color:var(--green);font-weight:500}
.chip.park .plus{color:var(--navy3)}
.chip .w{margin-left:auto;font-family:"DM Mono",monospace;font-size:10.5px;color:var(--navy3);white-space:nowrap;padding-left:6px}
.cmt-actions{display:flex;gap:12px;margin-top:8px}
.cmt-actions button{background:none;border:none;padding:0;font-size:12px;color:var(--navy3);font-weight:600}
.cmt-actions button:hover{color:var(--navy)}
.cmt.shim .chips{opacity:.35}
.concepts{display:flex;flex-direction:column;gap:7px}
.concept{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;transition:.15s}
.concept:hover{border-color:var(--navy3);background:var(--oat)}
.concept b{display:block;font-size:13.5px}
.concept span{font-size:12.5px;color:var(--navy2)}
.concept i{font-style:normal;font-family:"DM Mono",monospace;font-size:10.5px;color:var(--navy3);display:block;margin-top:3px}
.skel{position:absolute;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.skel .bar{height:10px;border-radius:5px;margin:7px 0;background:linear-gradient(90deg,var(--oat2),#f8f7f4,var(--oat2));background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- handoff drawer ---------- */
.veil{position:fixed;inset:0;background:rgba(27,49,57,.28);opacity:0;pointer-events:none;transition:.3s;z-index:40}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,96vw);background:var(--paper);z-index:41;transform:translateX(102%);transition:transform .5s var(--ease);
  display:flex;flex-direction:column;box-shadow:-30px 0 60px -40px rgba(27,49,57,.5)}
.drawer.on{transform:none}
.dr-h{padding:26px 32px 18px;border-bottom:1px solid var(--line)}
.dr-h h2{font-size:12px;color:var(--navy3)}
.dr-h .big{font-family:"Instrument Serif",serif;font-size:38px;line-height:1.05;margin:6px 0 4px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.tile{background:var(--oat);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .n{font-family:"Instrument Serif",serif;font-size:30px;line-height:1}
.tile .k{font-size:11.5px;color:var(--navy3)}
.warn{margin-top:14px;background:#fff6e5;border:1px solid #f3d49a;color:#7a4a00;border-radius:10px;padding:10px 12px;font-size:13px;display:none}
.warn.on{display:block}
.dr-b{flex:1;overflow:auto;padding:20px 32px}
pre.md{margin:0;background:#16282e;color:#e7eef0;border-radius:12px;padding:20px 22px;font-family:"DM Mono",monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap}
pre.md .h{color:#7fdcb8} pre.md .h1{color:#fff;font-weight:500} pre.md .c{color:#8fb0ba}
.dr-f{padding:16px 32px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--navy);color:#fff;border-radius:10px;padding:9px 16px;font-size:13.5px;opacity:0;transition:.3s var(--ease);z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="top">
  <a class="back" href="index.html">← All directions</a>
  <span class="tag">Direction A · Living Doc</span>
  <span class="sp"></span>
  <span class="mini" id="mini">Overall <b id="miniG">D+</b> <span class="mono" id="miniV">v1</span></span>
  <button class="btn-ghost" id="reset">Reset</button>
</div>

<div class="stage">
  <main class="paper" id="paper">
    <div class="dh">
      <div>
        <div class="eyebrow">Build brief · Retail ops</div>
        <h1>Fresh food waste, <em>before</em> it hits the bin</h1>
        <div class="meta">Drafted with your SA · Data: <span class="mono">workshop.retail_commercial</span></div>
        <div class="status" id="status"></div>
      </div>
      <div class="medal">
        <div class="g" id="bigG">D+</div>
        <div class="sc num" id="bigS">52 / 100</div>
        <div class="acts">
          <button class="btn btn-green" id="ready">Ready to build →</button>
          <button class="btn btn-navy" id="again">Ask SA to review again</button>
          <button class="link" id="anyway">Build anyway</button>
        </div>
      </div>
    </div>
    <div class="strip" id="strip"></div>

    <div class="origin"><small>v1 · your words</small><span id="originTxt"></span></div>

    <div id="doc"></div>

    <div class="parked" id="parked"><h3>Parked for v2</h3><div id="parkedList"></div></div>
  </main>

  <aside class="margin" id="margin">
    <div class="mhead"><span>Comments</span><span id="ccount"></span></div>
  </aside>
</div>

<div class="veil" id="veil"></div>
<div class="drawer" id="drawer">
  <div class="dr-h">
    <h2>Ready to build · handoff</h2>
    <div class="big" id="drTitle">What flows into PROJECT.md</div>
    <div class="meta" id="drMeta"></div>
    <div class="tiles" id="tiles"></div>
    <div class="warn" id="warn"></div>
  </div>
  <div class="dr-b"><pre class="md" id="md"></pre></div>
  <div class="dr-f">
    <button class="btn-ghost" id="drBack">Back to the brief</button>
    <button class="btn-ghost" id="drCopy">Copy</button>
    <button class="btn btn-navy" id="drSend">Send to build plan →</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const V1 = "Our store managers throw away a lot of food at the end of the day. I want something that helps them order better and see where the waste is.";

const SECTIONS = [
  {k:"problem",  t:"Problem",            q:"What is going wrong today, and what does it cost?", text:"Our store managers throw away a lot of food at the end of the day.", score:72, budget:35},
  {k:"user",     t:"User & moment",      q:"Who opens this, and at what moment in their day?", text:"Store managers.", score:64, budget:25},
  {k:"objective",t:"Objective",          q:"What number moves if this works?", text:"", score:40, budget:25},
  {k:"decision", t:"Decision it drives", q:"What does the person do differently after using it?", text:"Help them order better.", score:62, budget:30},
  {k:"data",     t:"Data reality",       q:"Which data does it lean on, and does it exist?", text:"See where the waste is.", score:60, budget:30},
  {k:"scope",    t:"Scope for a day",    q:"What is the smallest version worth building today?", text:"", score:40, budget:30},
  {k:"success",  t:"Success test",       q:"Three questions the finished app must answer correctly.", text:"", score:40, budget:60},
  {k:"risk",     t:"Biggest risk",       q:"What is most likely to make this fail, and what is the plan?", text:"", score:40, budget:40},
];

const TIGHT = {
  problem: "Stores over-order fresh food, and about 8% of fresh sales is binned at close. The order is the lever, not the bin.",
};

// scripted review rounds
const ROUNDS = {
  1: [
    {k:"problem", kind:"pushback", label:"Pushback",
     body:"Is waste the problem, or over-ordering? The bin is where you see it. The order is where the money goes.",
     chips:[{alts:["The real issue is over-ordering fresh food, so it gets binned at close.","Stores order more fresh food than they sell, and the rest is binned."], to:82}]},
    {k:"user", kind:"nudge", label:"Nudge",
     body:"Who opens this, and when? A manager placing the 6am order needs something different from one closing up at 7pm.",
     chips:[{alts:["Store managers, at 6am, while placing tomorrow's fresh order.","Store managers, first thing, before the fresh order cutoff."], to:91},
            {alts:["Area managers, on Mondays, spotting which stores bin the most."], to:80}]},
    {k:"objective", kind:"nudge", label:"Nudge",
     body:"Empty, and it is the one that steers the build. Pick one number that moves.",
     chips:[{alts:["Cut fresh-food waste from 8% to 5% of fresh sales in 8 weeks."], to:93},
            {alts:["Save £40 per store per week in written-off stock.","Halve end-of-day write-offs on the top 20 fresh lines."], to:88}]},
    {k:"data", kind:"good", label:"Good news",
     body:"workshop.retail_commercial has stores, products, transactions and a sales forecast. No waste data, so we generate a small waste log in your schema.",
     chips:[{alts:["Seeded stores, products and transactions, plus a generated waste log in my schema.","Seeded sales and forecast by store and product. Waste log generated to match."], to:90}]},
  ],
  2: [
    {k:"problem", kind:"nudge", label:"Nudge",
     body:"What does it cost today? One number makes the problem land with a finance reader.",
     chips:[{alts:["Waste logs put fresh write-off at about 8% of fresh sales."], to:92}]},
    {k:"decision", kind:"pushback", label:"Pushback",
     body:"\"Order better\" is a feeling, not an action. What does the manager actually change?",
     chips:[{alts:["Accepts or edits a suggested quantity per fresh product for tomorrow.","Confirms tomorrow's fresh order from a suggested quantity per line."], to:91},
            {alts:["Drops a product from the range at their store."], to:78}]},
    {k:"scope", kind:"concept", label:"Three ways",
     body:"Three ways to build this today. Each is a different app. Pick one, park the rest.",
     concepts:[
       {name:"Order coach", line:"Suggested quantity per fresh product for tomorrow, with the why.", cost:"Genie + App · moderate",
        text:"Order coach for one region: a suggested quantity per fresh line for tomorrow, with the reason.", to:92},
       {name:"Waste league", line:"Ranks stores and products by write-off, so area managers know where to look.", cost:"Genie + dashboard · light",
        text:"Waste league: stores and fresh lines ranked by write-off, for area managers.", to:84},
       {name:"Close-down agent", line:"An agent reviews today's waste and drafts tomorrow's order for approval.", cost:"Agent + Lakebase · ambitious",
        text:"Close-down agent: reviews today's waste and drafts tomorrow's order for the manager to approve.", to:86},
     ]},
  ],
  3: [
    {k:"success", kind:"nudge", label:"Write the exam",
     body:"Write the exam. If the app gets these right on the day, it works.",
     chips:[{alts:["1. Which 5 fresh lines did the Leeds Briggate store bin most last week?\n2. What should that store order of chicken wraps tomorrow, and why?\n3. How much did fresh waste cost the North region in August?"], to:94, label:"Add all three questions"}]},
    {k:"risk", kind:"pushback", label:"Pushback",
     body:"Managers will not follow a number they cannot see the reason for. What earns their trust?",
     chips:[{alts:["Risk: managers ignore suggestions they do not trust.\nMitigation: show the last 4 weeks of sales and waste behind each number."], to:92},
            {alts:["Risk: suggestions miss promos and local events.\nMitigation: let managers override and record why."], to:86}]},
    {k:"scope", kind:"park", label:"Park it",
     body:"Weather and local events move fresh sales a lot. Good idea, wrong day. Bank it for v2.",
     chips:[{alts:["Weather and local events as demand signals"], mode:"park", to:0}]},
  ],
};

const FALLBACK = {
  problem:{alts:["Waste logs put fresh write-off at about 8% of fresh sales."],to:88},
  user:{alts:["Store managers, at 6am, while placing tomorrow's fresh order."],to:88},
  objective:{alts:["Cut fresh-food waste from 8% to 5% of fresh sales in 8 weeks."],to:90},
  decision:{alts:["Accepts or edits a suggested quantity per fresh product for tomorrow."],to:88},
  data:{alts:["Seeded stores, products and transactions, plus a generated waste log in my schema."],to:88},
  scope:{alts:["Order coach for one region: a suggested quantity per fresh line for tomorrow."],to:88},
  success:{alts:["1. Which 5 fresh lines did Leeds Briggate bin most last week?\n2. What should it order of chicken wraps tomorrow?\n3. What did fresh waste cost the North region in August?"],to:90},
  risk:{alts:["Risk: managers ignore suggestions they do not trust.\nMitigation: show the sales and waste behind each number."],to:88},
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const words = s => (s||"").trim().split(/\s+/).filter(Boolean).length;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const SCALE = [[92,"A"],[87,"A-"],[83,"B+"],[79,"B"],[75,"B-"],[71,"C+"],[67,"C"],[62,"C-"],[52,"D+"],[46,"D"],[41,"D-"],[0,"F"]];
const letter = s => SCALE.find(([m])=>s>=m)[1];
const tier = l => ({A:"t-a",B:"t-b",C:"t-c"})[l[0]] || "t-d";
let S, uid = 0;

function sec(k){ return S.sections.find(s=>s.k===k); }
function overall(){ return Math.round(S.sections.reduce((a,s)=>a+s.score,0)/S.sections.length); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2200); }

/* ---------- render doc ---------- */
function renderDoc(){
  $("#originTxt").textContent = V1;
  $("#doc").innerHTML = S.sections.map(s=>`
    <section class="sec" id="sec-${s.k}" data-k="${s.k}">
      <div class="gchip ${tier(letter(s.score))}" id="g-${s.k}">${letter(s.score)}</div>
      <div class="sec-h"><h2>${s.t}</h2>
        <span class="budget" id="b-${s.k}"><span class="num"><span class="wc">0</span> / ${s.budget} words</span><button class="tighten" data-k="${s.k}">Tighten</button></span></div>
      <p class="q">${s.q}</p>
      <div class="body" contenteditable="true" spellcheck="false" data-k="${s.k}" data-ph="Type here, or insert a snippet from the margin.">${esc(s.text)}</div>
    </section>`).join("");
  $("#strip").innerHTML = S.sections.map(s=>`<button class="cell" data-k="${s.k}" id="c-${s.k}"><span class="l">${s.t}</span><span class="v">${letter(s.score)}</span></button>`).join("");
  S.sections.forEach(s=>updateBudget(s.k));
}

function updateGrades(animate=true){
  S.sections.forEach(s=>{
    const l = letter(s.score), chip = $("#g-"+s.k), cell = $("#c-"+s.k);
    if(chip.textContent!==l){
      chip.textContent=l; chip.className="gchip "+tier(l);
      if(animate){ chip.classList.remove("pop"); void chip.offsetWidth; chip.classList.add("pop"); }
    }
    cell.className="cell "+tier(l); cell.querySelector(".v").textContent=l;
  });
  const o = overall(), l = letter(o), g = $("#bigG");
  if(g.textContent!==l && animate){ g.classList.remove("pop"); void g.offsetWidth; g.classList.add("pop"); }
  g.textContent=l; g.style.color = getComputedStyle(document.documentElement).getPropertyValue(
    {"t-a":"--gink","t-b":"--navy2","t-c":"--amber","t-d":"--lava"}[tier(l)]);
  countTo($("#bigS"), o);
  $("#miniG").textContent=l;
  $("#ready").classList.toggle("on", o>=87);
  $("#anyway").style.display = o>=87 ? "none" : "";
}
function countTo(el, to){
  const from = parseInt(el.textContent)||0; if(from===to){ el.textContent=`${to} / 100`; return; }
  const t0=performance.now(), d=600;
  (function f(t){ const p=Math.min(1,(t-t0)/d), v=Math.round(from+(to-from)*(1-Math.pow(1-p,3))); el.textContent=`${v} / 100`; if(p<1) requestAnimationFrame(f); })(t0);
}
function updateBudget(k){
  const s=sec(k), b=$("#b-"+k), n=words(s.text);
  b.querySelector(".wc").textContent=n; b.classList.toggle("over", n>s.budget);
}
function renderParked(){
  $("#parked").classList.toggle("on", S.parked.length>0);
  $("#parkedList").innerHTML = S.parked.map(p=>`<span class="pchip">${esc(p)}</span>`).join("");
}
function setStatus(html){ $("#status").innerHTML = html; }

/* ---------- comments ---------- */
function renderComments(){
  const m=$("#margin");
  m.querySelectorAll(".cmt").forEach(c=>c.remove());
  S.comments.forEach(c=>{
    const el=document.createElement("div");
    el.className=`cmt k-${c.kind}${c.seen?"":" new"}`; c.seen=true; el.dataset.id=c.id; el.dataset.k=c.k;
    const anchor = sec(c.k).t;
    let inner = "";
    if(c.kind==="concept"){
      inner = `<div class="concepts">${c.concepts.map((p,i)=>`<button class="concept" data-ci="${i}"><b>${p.name}</b><span>${esc(p.line)}</span><i>${p.cost}</i></button>`).join("")}</div>`;
    } else if(c.chips && c.chips.length){
      inner = `<div class="chips">${c.chips.map((ch,i)=>{
        const txt = ch.label || ch.alts[ch.i||0];
        const w = ch.mode==="park" ? "park" : ch.mode==="tighten" ? "" : `+${words(ch.alts[ch.i||0])}w`;
        return `<button class="chip ${ch.mode==="park"?"park":""}" data-i="${i}"><span class="plus">${ch.mode==="park"?"◇":ch.mode==="tighten"?"↧":"+"}</span><span>${esc(txt).replace(/\n/g,"<br>")}</span><span class="w">${w}</span></button>`;}).join("")}</div>`;
    }
    const canRephrase = c.chips && c.chips.some(ch=>ch.alts && ch.alts.length>1);
    el.innerHTML = `<div class="cmt-top"><span class="av">SA</span><span class="who">Your SA</span><span class="kind">${c.label}</span><span class="anchor">on ${anchor}</span></div>
      <p class="cmt-b">${esc(c.body)}</p>${inner}
      ${c.kind==="ready"?"":`<div class="cmt-actions">${canRephrase?'<button data-act="rephrase">Rephrase</button>':""}<button data-act="dismiss">Dismiss</button></div>`}`;
    m.appendChild(el);
  });
  $("#ccount").textContent = S.comments.length ? `${S.comments.length} open` : "";
  layout();
}
function layout(){
  const m=$("#margin"), mTop=m.getBoundingClientRect().top;
  const order = S.sections.map(s=>s.k);
  const cards=[...m.querySelectorAll(".cmt,.skel")].sort((a,b)=>order.indexOf(a.dataset.k)-order.indexOf(b.dataset.k));
  let y=28, bottom=0;
  cards.forEach(c=>{
    const a=$("#sec-"+c.dataset.k); if(!a) return;
    const want=a.getBoundingClientRect().top - mTop + 14;
    const top=Math.max(want,y);
    c.style.top=top+"px"; y=top+c.offsetHeight+12; bottom=y;
  });
  m.style.minHeight = Math.max(bottom, 0)+"px";
}
function resolve(c){
  const el=document.querySelector(`.cmt[data-id="${c.id}"]`);
  if(el) el.classList.add("gone");
  setTimeout(()=>{ S.comments=S.comments.filter(x=>x!==c); renderComments(); }, 300);
}

function insertText(k, add, to){
  const s=sec(k), body=document.querySelector(`.body[data-k="${k}"]`);
  const multi = add.includes("\n") || k==="success" || k==="risk";
  const sep = s.text ? (multi ? "\n" : " ") : "";
  const before = s.text;
  s.text = (before ? before.replace(/\s+$/,"") : "") + sep + add;
  body.innerHTML = esc(before ? before.replace(/\s+$/,"") : "") + esc(sep) + `<mark class="ins">${esc(add)}</mark>`;
  if(to) s.score = Math.max(s.score, to);
  updateBudget(k); updateGrades(); flashSec(k);
}
function replaceText(k, txt, bump){
  const s=sec(k), body=document.querySelector(`.body[data-k="${k}"]`);
  s.text = txt; body.innerHTML = `<mark class="ins">${esc(txt)}</mark>`;
  s.score = Math.min(96, s.score + bump);
  updateBudget(k); updateGrades(); flashSec(k);
}
function flashSec(k){
  const el=$("#sec-"+k); el.classList.remove("reading"); void el.offsetWidth; el.classList.add("reading");
  setTimeout(()=>{ el.classList.remove("reading"); layout(); }, 900);
}

async function tighten(k){
  const s=sec(k), n0=words(s.text);
  const el=$("#sec-"+k); el.classList.add("reading");
  await sleep(850);
  el.classList.remove("reading");
  let t = TIGHT[k];
  if(!t || words(t)>s.budget){ const w=s.text.trim().split(/\s+/).slice(0, s.budget); t=w.join(" ").replace(/[,;:]$/,""); if(!/[.!?]$/.test(t)) t+="."; }
  replaceText(k, t, 3);
  toast(`Tightened ${s.t}: ${n0} → ${words(t)} words`);
  // clear any guard comment on this section
  S.comments.filter(c=>c.kind==="guard" && c.k===k).forEach(resolve);
}

/* ---------- review rounds ---------- */
function snapGrades(){ const o={}; S.sections.forEach(s=>o[s.k]=letter(s.score)); return o; }

async function review(){
  if(S.busy) return; S.busy=true;
  const btn=$("#again"); btn.disabled=true;
  const nextV = S.round===0 ? 1 : S.version+1;
  setStatus(`<span class="ver">v${nextV}</span> Your SA is reading the brief <span class="dots"><span></span><span></span><span></span></span>`);
  // skeleton + reading sweep
  const m=$("#margin"); const sk=document.createElement("div"); sk.className="skel"; sk.dataset.k=S.sections[0].k;
  sk.innerHTML='<div class="bar" style="width:40%"></div><div class="bar"></div><div class="bar" style="width:75%"></div>';
  m.appendChild(sk); layout();
  S.sections.forEach((s,i)=>setTimeout(()=>{ const el=$("#sec-"+s.k); el.classList.add("reading"); setTimeout(()=>el.classList.remove("reading"),700); }, i*110));
  await sleep(900 + Math.random()*300);
  sk.remove();

  S.round++;
  if(S.round>1) S.version++;
  // re-grade sections the participant edited by hand
  let handEdited=[];
  S.sections.forEach(s=>{ if(s.edited){ const n=words(s.text); if(n>=4){ s.score=Math.min(90, Math.max(s.score, s.score+8)); handEdited.push(s.t);} s.edited=false; } });

  let add = [];
  if(ROUNDS[S.round]){
    add = ROUNDS[S.round].map(c=>({...c, id:++uid, chips:c.chips?c.chips.map(ch=>({...ch,i:0})):null}));
  } else {
    const weakest=[...S.sections].sort((a,b)=>a.score-b.score)[0];
    if(overall()>=87 && weakest.score>=75){
      add=[{k:"problem",kind:"ready",label:"Ready",id:++uid,
        body:"This is ready. A sharp problem, one number, a real exam. Go build it.",
        chips:[{alts:["Open the handoff"],mode:"handoff",i:0}]}];
    } else {
      add=[{k:weakest.k,kind:"nudge",label:"Nudge",id:++uid,
        body:`${weakest.t} is your weakest section at ${letter(weakest.score)}. One sharp line lifts the whole brief.`,
        chips:[{...FALLBACK[weakest.k],i:0}]}];
    }
  }
  // word-budget guard
  S.sections.forEach(s=>{
    if(words(s.text)>s.budget && !S.comments.some(c=>c.kind==="guard"&&c.k===s.k)){
      add.push({k:s.k,kind:"guard",label:"Too long",id:++uid,
        body:`${words(s.text)} words against a ${s.budget} word budget. Sharp beats complete.`,
        chips:[{alts:[`Tighten to under ${s.budget} words`],mode:"tighten",i:0}]});
    }
  });
  // don't duplicate a section's open comment of same kind
  add = add.filter(c=>!S.comments.some(x=>x.k===c.k && x.body===c.body));
  S.comments.push(...add);

  updateGrades();
  // diff line
  const now=snapGrades();
  const diffs = S.snap ? S.sections.filter(s=>S.snap[s.k]!==now[s.k]).map(s=>`${s.t} ${S.snap[s.k]} → ${now[s.k]}`) : [];
  S.snap=now;
  $("#miniV").textContent="v"+S.version; $("#mini").classList.add("on");
  if(S.round===1) setStatus(`<span class="ver">v1</span> Your starting idea, graded. ${add.length} comments in the margin.`);
  else setStatus(`<span class="ver">v${S.version}</span> ${diffs.length?`<span class="up">Sharper:</span> ${diffs.slice(0,3).join(", ")}${diffs.length>3?` +${diffs.length-3} more`:""}`:"No grade changes since the last read."}${handEdited.length?` · re-graded your edits`:""}`);
  renderComments();
  btn.disabled=false; S.busy=false;
}

/* ---------- handoff ---------- */
function openHandoff(anyway){
  const o=overall(), l=letter(o);
  const get=k=>sec(k).text.trim();
  const lines=k=>get(k).split("\n").map(x=>x.trim()).filter(Boolean);
  const exam = lines("success").map(x=>x.replace(/^\d+\.\s*/,""));
  const risks = lines("risk");
  const weak = S.sections.filter(s=>s.score<75);
  const decisions = ["problem","user","objective","decision","scope","data"].filter(k=>get(k));
  let md = "";
  md += `<span class="h1"># PROJECT.md · Fresh food waste</span>\n<span class="c">Brief graded ${l} (${o}/100) at v${S.version}, drafted with your SA.</span>\n\n`;
  md += `<span class="h">## Decisions</span>\n` + decisions.map(k=>`- <b>${sec(k).t}:</b> ${esc(get(k)).replace(/\n/g," ")}`).join("\n") + "\n\n";
  md += `<span class="h">## Success test (becomes the eval set)</span>\n` + (exam.length? exam.map((q,i)=>`${i+1}. ${esc(q)}`).join("\n") : "<span class=c>Not written yet.</span>") + "\n\n";
  md += `<span class="h">## Risks and mitigations</span>\n` + (risks.length? risks.map(r=>`- ${esc(r)}`).join("\n") : "<span class=c>None named.</span>") + "\n\n";
  if(anyway && weak.length) md += `<span class="h">## Open risks (built below the bar)</span>\n` + weak.map(s=>`- ${s.t} graded ${letter(s.score)}. Revisit before showcase.`).join("\n") + "\n\n";
  md += `<span class="h">## Parked for v2</span>\n` + (S.parked.length? S.parked.map(p=>`- ${esc(p)}`).join("\n") : "<span class=c>Nothing parked.</span>");
  $("#md").innerHTML = md;
  $("#drTitle").textContent = anyway ? "Building below the bar" : "What flows into PROJECT.md";
  $("#drMeta").innerHTML = `Grade at handoff <b>${l}</b> · v${S.version} · ${S.round} review rounds`;
  $("#tiles").innerHTML = [[decisions.length,"decisions"],[exam.length,"exam questions"],[risks.filter(r=>/^risk/i.test(r)).length||(risks.length?1:0),"risks with a plan"],[S.parked.length,"parked for v2"]]
    .map(([n,k])=>`<div class="tile"><div class="n">${n}</div><div class="k">${k}</div></div>`).join("");
  const w=$("#warn");
  w.classList.toggle("on", !!(anyway && weak.length));
  w.innerHTML = weak.length ? `These sections are still under a B, so they go in as open risks: <b>${weak.map(s=>`${s.t} (${letter(s.score)})`).join(", ")}</b>.` : "";
  $("#veil").classList.add("on"); $("#drawer").classList.add("on");
}
function closeHandoff(){ $("#veil").classList.remove("on"); $("#drawer").classList.remove("on"); }

/* ---------- events ---------- */
document.addEventListener("input", e=>{
  const b=e.target.closest(".body"); if(!b) return;
  const s=sec(b.dataset.k); s.text=b.innerText.replace(/\n$/,""); s.edited=true;
  if(!s.text.trim()) b.innerHTML="";
  updateBudget(s.k); layout();
});
document.addEventListener("click", e=>{
  const t=e.target;
  const tg=t.closest(".tighten"); if(tg){ tighten(tg.dataset.k); return; }
  const cell=t.closest(".cell"); if(cell){ $("#sec-"+cell.dataset.k).scrollIntoView({behavior:"smooth",block:"center"}); return; }
  const card=t.closest(".cmt"); if(!card) return;
  const c=S.comments.find(x=>x.id==card.dataset.id); if(!c) return;
  const chip=t.closest(".chip"), con=t.closest(".concept"), act=t.closest("[data-act]");
  if(con){
    const p=c.concepts[+con.dataset.ci];
    insertText("scope", p.text, p.to);
    const others=c.concepts.filter(x=>x!==p).map(x=>x.name);
    S.parked.push(...others.map(n=>`${n} (alternate concept)`)); renderParked();
    resolve(c); toast(`Going with ${p.name}. Parked the other two.`); return;
  }
  if(chip){
    const ch=c.chips[+chip.dataset.i];
    if(ch.mode==="park"){ S.parked.push(ch.alts[0]); renderParked(); resolve(c); toast("Parked for v2"); return; }
    if(ch.mode==="tighten"){ resolve(c); tighten(c.k); return; }
    if(ch.mode==="handoff"){ openHandoff(false); return; }
    insertText(c.k, ch.alts[ch.i||0], ch.to); resolve(c); return;
  }
  if(act && act.dataset.act==="dismiss"){ resolve(c); return; }
  if(act && act.dataset.act==="rephrase"){
    card.classList.add("shim");
    setTimeout(()=>{ c.chips.forEach(ch=>{ if(ch.alts.length>1) ch.i=((ch.i||0)+1)%ch.alts.length; }); renderComments(); }, 500);
  }
});
document.addEventListener("mouseover", e=>{
  const card=e.target.closest(".cmt"), s=e.target.closest(".sec");
  document.querySelectorAll(".sec.hl,.cmt.hl").forEach(x=>x.classList.remove("hl"));
  if(card){ const a=$("#sec-"+card.dataset.k); a && a.classList.add("hl"); }
  if(s){ document.querySelectorAll(`.cmt[data-k="${s.dataset.k}"]`).forEach(x=>x.classList.add("hl")); }
});
$("#again").onclick = review;
$("#ready").onclick = ()=>openHandoff(false);
$("#anyway").onclick = ()=>openHandoff(true);
$("#drBack").onclick = closeHandoff; $("#veil").onclick = closeHandoff;
$("#drCopy").onclick = ()=>{ navigator.clipboard && navigator.clipboard.writeText($("#md").innerText); toast("Copied PROJECT.md"); };
$("#drSend").onclick = ()=>{ closeHandoff(); toast("Sent to the build plan. (Prototype: this is where Design picks up.)"); };
$("#reset").onclick = init;
window.addEventListener("resize", layout);

function init(){
  closeHandoff();
  S = { sections: SECTIONS.map(s=>({...s, edited:false})), round:0, version:1, parked:[], comments:[], snap:null, busy:false };
  document.querySelectorAll("#margin .cmt,#margin .skel").forEach(x=>x.remove());
  renderDoc(); renderParked(); updateGrades(false);
  $("#bigS").textContent = `${overall()} / 100`;
  $("#mini").classList.remove("on");
  setStatus(`<span class="ver">v1</span> Your idea, turned into a brief.`);
  S.snap = snapGrades();
  setTimeout(review, 700);
}
document.fonts && document.fonts.ready.then(()=>layout());
init();
</script>
</body>
</html>
