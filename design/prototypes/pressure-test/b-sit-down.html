<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Direction B · The Sit-Down</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&family=Newsreader:opsz,ital,wght@6..72,0,400;6..72,0,500;6..72,1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#1B3139; --navy2:#2E5A6B; --navy3:#5A8A9A;
    --oat:#F5F3EF; --oat2:#EEEDE9; --line:#e6e3dd; --line2:#d8d3ca;
    --green:#00A870; --green-soft:#e8f7f1; --green-ink:#046a48;
    --lava:#FF3621; --amber:#F59E0B; --paper:#fffefb;
    --serif:"Newsreader",Georgia,serif; --mono:"DM Mono",ui-monospace,monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"DM Sans",system-ui,sans-serif;color:var(--navy);background:var(--oat);
    -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;overflow:hidden}
  .tnum{font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;cursor:pointer}

  /* top bar */
  .top{height:52px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--oat)}
  .top a{color:var(--navy2);text-decoration:none;font-weight:500;font-size:14px}
  .top a:hover{color:var(--navy)}
  .tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--navy3);
    border:1px solid var(--line2);border-radius:99px;padding:3px 10px}
  .top .sp{flex:1}
  .btn-ghost{background:none;border:1px solid var(--line2);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
  .btn-ghost:hover{border-color:var(--navy3)}

  .stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(420px,1fr);height:calc(100% - 52px)}

  /* ---------- LEFT: the interview ---------- */
  .interview{overflow-y:auto;padding:36px 56px 80px;position:relative}
  .round{display:flex;align-items:center;gap:14px;margin-bottom:34px}
  .round .segs{display:flex;gap:5px}
  .round .segs i{width:34px;height:4px;border-radius:4px;background:var(--line2);transition:background .5s var(--ease)}
  .round .segs i.done{background:var(--navy2)}
  .round .segs i.now{background:var(--green)}
  .round .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy3)}
  .round .lbl b{color:var(--navy);font-weight:500}

  .sa{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px;max-width:640px}
  .sa .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--oat);
    font-family:var(--mono);font-size:11px;display:grid;place-items:center;letter-spacing:.02em;margin-top:2px}
  .sa .who{font-size:12px;font-weight:600;color:var(--navy3);text-transform:uppercase;letter-spacing:.06em}
  .sa .say{font-size:16px;color:var(--navy2);line-height:1.55}
  .sa.push .say{color:var(--navy)}
  .sa.push .av{background:var(--lava)}
  .pushtag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--lava);border:1px solid #ffc9c1;background:#fff4f2;border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:1px}

  .q{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.14;letter-spacing:-.015em;
    margin:6px 0 26px;max-width:680px;color:var(--navy)}
  .q em{font-style:italic;color:var(--navy2)}

  .opts{display:grid;gap:10px;max-width:640px}
  .opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:15px 18px;transition:border-color .2s,transform .2s var(--ease),box-shadow .2s,opacity .35s}
  .opt:hover{border-color:var(--navy3);transform:translateY(-1px);box-shadow:0 6px 18px -12px rgba(27,49,57,.35)}
  .opt .k{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);font-family:var(--mono);
    font-size:11px;display:grid;place-items:center;color:var(--navy3);margin-top:1px}
  .opt .t{font-weight:600;font-size:15.5px}
  .opt .s{color:var(--navy3);font-size:13.5px;margin-top:1px}
  .opt.on{border-color:var(--green);background:var(--green-soft)}
  .opt.on .k{background:var(--green);border-color:var(--green);color:#fff}
  .opts.locked .opt{pointer-events:none}
  .opts.locked .opt:not(.on){opacity:.35;transform:none}

  .freeline{display:flex;align-items:center;gap:10px;max-width:640px;margin-top:14px;border-bottom:1px solid var(--line2);padding:6px 2px}
  .freeline span{font-family:var(--mono);font-size:11px;color:var(--navy3);text-transform:uppercase;letter-spacing:.05em;flex:none}
  .freeline input{flex:1;border:none;background:none;font:inherit;font-size:15px;color:var(--navy);outline:none;padding:4px 0}
  .freeline input::placeholder{color:#a7b5b9}

  .react{max-width:640px;margin-top:26px;animation:rise .5s var(--ease) both}
  .cont{margin-top:18px;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:600;
    display:inline-flex;align-items:center;gap:10px;transition:background .2s}
  .cont:hover{background:var(--navy2)}
  .cont:disabled{background:var(--line2);color:#fff;cursor:not-allowed}
  .cont kbd{font-family:var(--mono);font-size:10.5px;opacity:.6;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:0 5px}
  .link{background:none;border:none;color:var(--navy2);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:0;margin-left:14px}

  .thinking{display:flex;gap:12px;align-items:center;color:var(--navy3);font-size:14px;margin-top:10px}
  .shim{display:grid;gap:9px;width:420px;margin-top:22px}
  .shim i{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--oat2) 0%,#fff 45%,var(--oat2) 90%);background-size:220% 100%;animation:shim 1.1s linear infinite}
  .shim i:nth-child(2){width:78%} .shim i:nth-child(3){width:56%}
  @keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .rise{animation:rise .55s var(--ease) both}
  .rise2{animation:rise .55s .08s var(--ease) both}
  .rise3{animation:rise .55s .16s var(--ease) both}

  /* intro */
  .draft{max-width:620px;border-left:3px solid var(--line2);padding:4px 0 4px 20px;margin:4px 0 30px;
    font-family:var(--serif);font-size:22px;line-height:1.45;color:var(--navy2)}
  .draft small{display:block;font-family:"DM Sans";font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy3);margin-bottom:6px}

  /* concepts */
  .concepts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:760px}
  .cc{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;
    display:flex;flex-direction:column;gap:8px;transition:border-color .2s,transform .25s var(--ease),box-shadow .2s,opacity .35s}
  .cc:hover{border-color:var(--navy3);transform:translateY(-2px);box-shadow:0 10px 26px -16px rgba(27,49,57,.4)}
  .cc svg{width:100%;height:92px;background:var(--oat);border-radius:10px}
  .cc .n{font-family:var(--mono);font-size:10.5px;color:var(--navy3);letter-spacing:.06em;text-transform:uppercase}
  .cc .t{font-family:var(--serif);font-size:21px;line-height:1.1}
  .cc .d{font-size:13px;color:var(--navy2)}
  .cc .pc{font-size:12.5px;display:grid;gap:3px;margin-top:2px}
  .cc .pc div{display:flex;gap:6px}
  .cc .pc b{font-family:var(--mono);font-weight:500;width:12px;flex:none}
  .cc .pc .p b{color:var(--green)} .cc .pc .m b{color:var(--lava)}
  .cc.on{border-color:var(--green);background:var(--green-soft)}
  .concepts.locked .cc{pointer-events:none} .concepts.locked .cc:not(.on){opacity:.35}

  /* playback */
  .playback{max-width:640px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;
    font-family:var(--serif);font-size:21px;line-height:1.5;color:var(--navy)}
  .playback[contenteditable=true]{outline:2px solid var(--green);outline-offset:2px;background:#fff}
  .playback b{font-weight:500;background:linear-gradient(transparent 62%,#d9f2e8 62%)}

  /* data strip */
  .tables{display:flex;flex-wrap:wrap;gap:8px;max-width:640px;margin:-6px 0 24px}
  .tbl{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line2);background:var(--paper);border-radius:8px;padding:6px 10px;display:flex;gap:7px;align-items:center}
  .tbl i{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .tbl.miss{border-style:dashed;color:var(--lava);background:#fff7f5}
  .tbl.miss i{background:none;border:1.5px solid var(--lava)}

  /* exam */
  .chips{display:flex;flex-wrap:wrap;gap:8px;max-width:680px}
  .chipq{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;
    transition:all .2s}
  .chipq:hover{border-color:var(--navy3)}
  .chipq.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .examlist{max-width:640px;margin-top:22px;counter-reset:q}
  .examlist .row{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:18px;animation:rise .4s var(--ease) both}
  .examlist .row::before{counter-increment:q;content:counter(q);font-family:var(--mono);font-size:12px;color:var(--navy3);width:16px}
  .examlist .empty{color:#a7b5b9;font-family:var(--serif);font-style:italic;font-size:18px;padding:10px 0;border-bottom:1px dashed var(--line2)}
  .counter{font-family:var(--mono);font-size:12px;color:var(--navy3);margin-left:10px}

  /* scope */
  .scope{max-width:640px;display:grid;gap:8px}
  .srow{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 14px;transition:opacity .3s,background .3s}
  .srow.off{background:transparent;opacity:.62}
  .srow .nm{flex:1;font-weight:500}
  .srow .nm small{display:block;font-weight:400;color:var(--navy3);font-size:12.5px}
  .srow .hr{font-family:var(--mono);font-size:12.5px;color:var(--navy3);width:44px;text-align:right}
  .sw{width:38px;height:22px;border-radius:99px;background:var(--line2);border:none;position:relative;flex:none;transition:background .25s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .sw.on{background:var(--green)} .sw.on::after{transform:translateX(16px)}
  .budget{max-width:640px;margin:0 0 18px}
  .budget .bar{height:10px;border-radius:6px;background:var(--oat2);position:relative;overflow:visible;margin-top:8px}
  .budget .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--navy2);transition:width .45s var(--ease),background .3s}
  .budget .fill.over{background:var(--lava)}
  .budget .cap{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--navy)}
  .budget .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--navy3)}
  .budget .meta b{color:var(--navy);font-weight:600}
  .budget .meta .warn{color:var(--lava);font-weight:600}

  /* ---------- RIGHT: the brief ---------- */
  .brief{background:var(--oat2);border-left:1px solid var(--line);overflow-y:auto;padding:26px 28px 90px}
  .paper{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 0 var(--line),0 18px 40px -30px rgba(27,49,57,.35)}
  .bhead{display:flex;gap:18px;align-items:center;padding:20px 22px 18px;border-bottom:1px solid var(--line)}
  .dial{position:relative;width:74px;height:74px;flex:none}
  .dial svg{width:74px;height:74px;transform:rotate(-90deg)}
  .dial .ring{fill:none;stroke:var(--oat2);stroke-width:6}
  .dial .val{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease),stroke .6s}
  .dial .L{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:32px;letter-spacing:-.02em;font-weight:500}
  .dial .L.pop{animation:pop .6s var(--ease)}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
  .bhead .ttl{flex:1;min-width:0}
  .bhead .ttl .k{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy3)}
  .bhead .ttl h2{margin:2px 0 3px;font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.01em}
  .bhead .ttl .m{font-size:12.5px;color:var(--navy3)}
  .deltas{position:absolute;right:22px;top:22px;display:grid;gap:6px;justify-items:end;pointer-events:none;z-index:3}
  .delta{font-family:var(--mono);font-size:11.5px;background:var(--navy);color:#fff;border-radius:6px;padding:4px 8px;animation:dlt 2.6s var(--ease) forwards}
  .delta.up b{color:#7fe0bb} .delta.dn b{color:#ffb3a8}
  @keyframes dlt{0%{opacity:0;transform:translateY(-6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-4px)}}

  .secs{padding:6px 0}
  .sec{position:relative;padding:14px 22px 14px 25px;border-left:3px solid transparent;cursor:pointer;transition:background .25s,border-color .25s}
  .sec:hover{background:#fbf9f4}
  .sec.focus{border-left-color:var(--green);background:#f6fbf8}
  .sec.open{background:#fbf9f4}
  .sec + .sec{border-top:1px solid var(--line)}
  .sh{display:flex;align-items:center;gap:8px}
  .sh .lb{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--navy2)}
  .sh .from{font-family:var(--mono);font-size:10px;color:var(--navy3);border:1px dashed var(--line2);border-radius:4px;padding:0 5px}
  .sh .live{font-family:var(--mono);font-size:10px;color:var(--green-ink);display:inline-flex;align-items:center;gap:5px}
  .sh .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.25}}
  .sh .sp{flex:1}
  .gr{font-family:var(--mono);font-weight:500;font-size:13px;min-width:34px;text-align:center;border-radius:6px;padding:2px 6px;transition:background .3s,color .3s}
  .gr.flip{animation:flip .55s var(--ease)}
  @keyframes flip{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
  .gA{background:var(--green-soft);color:var(--green-ink)}
  .gB{background:#e6eff2;color:var(--navy2)}
  .gC{background:#fdf2dc;color:#8a5a00}
  .gD,.gF{background:#fff0ed;color:#c42613}
  .st{margin-top:5px;font-size:14.5px;line-height:1.55;color:var(--navy);min-height:1.2em}
  .st.note{color:#98a8ad;font-style:italic;font-family:var(--serif);font-size:16px}
  .st mark{background:#d9f2e8;color:inherit;border-radius:3px;padding:0 2px;animation:fade 2.5s ease forwards}
  @keyframes fade{0%,60%{background:#bfead8}100%{background:transparent}}
  .st .caret{display:inline-block;width:1.5px;height:1em;background:var(--green);vertical-align:-2px;margin-left:1px;animation:blink .8s infinite}
  .st ol{margin:0;padding-left:18px} .st li{margin:2px 0}
  .wc{display:none;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--navy3)}
  .sec.open .wc,.sec.over .wc{display:flex}
  .wbar{width:70px;height:3px;background:var(--oat2);border-radius:3px;overflow:hidden}
  .wbar i{display:block;height:100%;background:var(--navy3);transition:width .3s}
  .sec.over .wbar i{background:var(--lava)} .sec.over .wc{color:var(--lava)}
  .tighten{border:1px solid #ffc9c1;background:#fff4f2;color:var(--lava);border-radius:5px;font-family:var(--mono);font-size:10.5px;padding:1px 7px;display:none}
  .sec.over .tighten{display:inline-block}

  .snips{display:none;margin-top:12px;padding:12px 12px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;animation:rise .35s var(--ease)}
  .sec.open .snips{display:block}
  .snips .nt{display:flex;gap:8px;font-size:13.5px;color:var(--navy2);align-items:flex-start}
  .snips .nt .av{flex:none;width:20px;height:20px;border-radius:50%;background:var(--navy);color:var(--oat);font-family:var(--mono);font-size:8.5px;display:grid;place-items:center;margin-top:1px}
  .snips .cs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-left:28px}
  .snip{border:1px solid var(--line2);background:var(--oat);border-radius:99px;padding:4px 11px;font-size:12.5px;transition:all .18s}
  .snip:hover{border-color:var(--green);background:var(--green-soft)}
  .snip::before{content:"+ ";font-family:var(--mono);color:var(--green)}
  .snip.used{opacity:.4;pointer-events:none;text-decoration:line-through}
  .snips .hint{padding-left:28px;margin-top:8px;font-size:11.5px;color:var(--navy3)}

  .foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--navy3)}
  .foot .hist{display:flex;gap:4px;align-items:center;font-family:var(--mono)}
  .foot .hist span{padding:1px 5px;border-radius:4px;background:var(--oat)}
  .foot .hist em{font-style:normal;opacity:.5}

  /* handoff */
  .veil{position:fixed;inset:0;background:rgba(27,49,57,.42);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:44px 20px;overflow-y:auto;z-index:20}
  .veil.show{display:flex;animation:fadein .3s ease}
  @keyframes fadein{from{opacity:0}}
  .hand{width:min(940px,100%);background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(0,0,0,.5);animation:rise .5s var(--ease)}
  .hand .hh{display:flex;align-items:center;gap:18px;padding:24px 28px;background:var(--navy);color:#fff}
  .hand .hh .big{font-family:var(--serif);font-size:48px;line-height:1;letter-spacing:-.02em}
  .hand .hh .big small{font-size:22px;opacity:.55;margin:0 8px}
  .hand .hh h3{margin:0;font-family:var(--serif);font-weight:400;font-size:26px}
  .hand .hh p{margin:2px 0 0;color:#b9cdd3;font-size:14px}
  .hand .hh .sp{flex:1}
  .hand .body{display:grid;grid-template-columns:1fr 240px}
  .md{padding:24px 30px 30px;font-size:14.5px;border-right:1px solid var(--line)}
  .md .file{font-family:var(--mono);font-size:11.5px;color:var(--navy3);margin-bottom:14px;display:flex;gap:8px;align-items:center}
  .md .file i{width:8px;height:8px;border-radius:2px;background:var(--green)}
  .md h4{font-family:var(--mono);font-weight:500;font-size:13px;color:var(--navy2);margin:20px 0 8px}
  .md h4::before{content:"## ";color:var(--line2)}
  .md p{margin:0 0 6px}
  .md ul,.md ol{margin:0;padding-left:20px} .md li{margin:4px 0}
  .md .kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px}
  .md .kv span{color:var(--navy3)}
  .md .open{color:#c42613;font-family:var(--mono);font-size:12px;border:1px dashed #ffc9c1;border-radius:5px;padding:1px 6px;background:#fff7f5}
  .md .mit{color:var(--green-ink)}
  .side{padding:24px 22px;background:var(--oat)}
  .side .k{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy3);margin-bottom:10px}
  .side .gl{display:grid;gap:6px;margin-bottom:22px}
  .side .gl div{display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .side .ship{width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;margin-top:6px}
  .side .ship:hover{background:var(--green-ink)}
  .side .back{width:100%;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;z-index:30;animation:rise .35s var(--ease)}

  @media (max-width:1100px){.interview{padding:28px 30px 80px}.q{font-size:31px}.concepts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <a href="index.html">← All directions</a>
  <span class="tag">Direction B · The Sit-Down</span>
  <span class="sp"></span>
  <button class="btn-ghost" onclick="init()">Reset</button>
</div>

<div class="stage">
  <section class="interview" id="left"></section>
  <aside class="brief">
    <div class="paper" style="position:relative">
      <div class="deltas" id="deltas"></div>
      <div class="bhead">
        <div class="dial">
          <svg viewBox="0 0 74 74"><circle class="ring" cx="37" cy="37" r="31"/><circle class="val" id="dialval" cx="37" cy="37" r="31"/></svg>
          <div class="L" id="dialL">D+</div>
        </div>
        <div class="ttl">
          <div class="k" id="ver">Brief · v1</div>
          <h2>Fresh food waste, store level</h2>
          <div class="m">Click any section to tighten it with your SA.</div>
        </div>
      </div>
      <div class="secs" id="secs"></div>
      <div class="foot"><span>Grade history</span><div class="hist" id="hist"></div></div>
    </div>
  </aside>
</div>

<div class="veil" id="veil"><div class="hand" id="hand"></div></div>

<script>
const LET=['F','D-','D','D+','C-','C','C+','B-','B','B+','A-','A'];
const gcls=g=>'g'+LET[g][0];
const SECS=[['problem','Problem',1],['user','User & moment',1],['objective','Objective',2],['decision','Decision it drives',3],
  ['data','Data reality',4],['scope','Scope for a day',3],['test','Success test',4],['risk','Biggest risk',2]];
const LABEL=Object.fromEntries(SECS.map(s=>[s[0],s[1]]));
const BUDGET={test:55};
const budget=k=>BUDGET[k]||32;

const SNIPS={
  problem:{n:'Solid. Put a rough cost on it so people feel it.',c:['Roughly £40 per store per day goes in the bin.','Worst on sandwiches and pastries.']},
  user:{n:'Say what they need to do in that moment.',c:['They need an answer before the 11am order cutoff.','Works on the back office tablet.']},
  objective:{n:'Anchor the target to a baseline, or it can\'t be checked.',c:['Baseline: the first 8 weeks of the generated waste_log.','Measured weekly, per store.']},
  decision:{n:'Say what happens when they ignore it.',c:['If ignored, the usual order goes through unchanged.','Each accept or change is saved.']},
  data:{n:'Name the join. It saves an hour mid-build.',c:['Joined on site_id and business_date.','Sales and waste are both at product level.']},
  scope:{n:'Saying what is out is as useful as what is in.',c:['Out: drinks, milk and supplier systems.','One pilot store first.']},
  test:{n:'Add one question that could trip it up.',c:['Include a store with no waste history.','Ask it about a product launched last week.']},
  risk:{n:'One more worth watching.',c:['Managers won\'t trust a number without a reason.','Waste isn\'t logged every day in every store.']},
};

let S, T=[]; // timers
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const words=s=>(s||'').trim().split(/\s+/).filter(Boolean).length;
const later=(fn,ms)=>{T.push(setTimeout(fn,ms))};

function init(){
  T.forEach(clearTimeout);T=[];
  S={ver:1,lastRound:0,open:null,focus:[],picks:{},exam:[],hist:[],early:false,summary:'',concept:null,
     scope:{qty:true,why:true,save:true,weather:true,rollup:false,supplier:false},weatherParked:false,
     sec:{
       problem:{t:'Store managers throw away a lot of food at the end of the day.',g:6,v1:1},
       user:{t:'Store managers.',g:3,v1:1},
       objective:{t:'Help them order better.',g:2,v1:1},
       decision:{t:'See where the waste is.',g:1,v1:1},
       data:{t:'',g:5,note:'Implied: sales and waste. Not named yet.'},
       scope:{t:'',g:4,note:'Not stated.'},
       test:{t:'',g:0,note:'Not stated. How will you know it works?'},
       risk:{t:'',g:1,note:'Not stated.'},
     }};
  $('veil').classList.remove('show');
  $('deltas').innerHTML='';
  S.lastOverall=overallIdx();
  S.hist=[{l:'v1',g:LET[S.lastOverall]}];
  renderDoc();updateDial(true);renderHist();
  go('intro',true);
}

/* ---------------- brief (right) ---------------- */
function overallIdx(){const v=SECS.map(s=>S.sec[s[0]].g);return Math.round(v.reduce((a,b)=>a+b,0)/v.length)}
function updateDial(silent){
  const i=overallIdx(),C=2*Math.PI*31,el=$('dialval');
  el.style.strokeDasharray=C; el.style.strokeDashoffset=C*(1-(i+.6)/11.6);
  el.style.stroke=i>=9?'var(--green)':i>=7?'var(--navy2)':i>=4?'var(--amber)':'var(--lava)';
  const L=$('dialL');
  if(L.textContent!==LET[i]){L.textContent=LET[i];if(!silent){L.classList.remove('pop');void L.offsetWidth;L.classList.add('pop')}}
}
function renderHist(){$('hist').innerHTML=S.hist.map((h,i)=>(i?'<em>→</em>':'')+`<span title="${h.l}">${h.g}</span>`).join('')}
function snapshot(label){const g=LET[overallIdx()];if(S.hist[S.hist.length-1].g!==g)S.hist.push({l:label,g});renderHist()}
function bumpVer(){S.ver++;$('ver').textContent='Brief · v'+S.ver}

function secHTML(k){
  const s=S.sec[k],lab=LABEL[k],foc=S.focus.includes(k);
  let body;
  if(k==='test'&&S.exam.length&&s.t) body=`<ol>${S.exam.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>${s.extra?'<div style="margin-top:4px">'+hl(s.extra,s.last)+'</div>':''}`;
  else body=s.t?hl(s.t,s.last):'';
  const w=words(s.t)+(k==='test'?words(S.exam.join(' '))+words(s.extra||''):0),b=budget(k);
  const over=w>b;
  const sn=SNIPS[k];
  return `<div class="sec ${foc?'focus':''} ${S.open===k?'open':''} ${over?'over':''}" data-k="${k}" onclick="toggleSec('${k}',event)">
    <div class="sh"><span class="lb">${lab}</span>${s.v1?'<span class="from">from your draft</span>':''}${foc?'<span class="live">discussing</span>':''}
      <span class="sp"></span><span class="gr ${gcls(s.g)}" id="g-${k}">${LET[s.g]}</span></div>
    <div class="st ${s.t?'':'note'}" id="t-${k}">${body||esc(s.note||'Comes up in round '+SECS.find(x=>x[0]===k)[2]+'.')}</div>
    <div class="wc tnum">${w} / ${b} words <span class="wbar"><i style="width:${Math.min(100,w/b*100)}%"></i></span>
      ${over?`<span>over by ${w-b}. Short beats complete.</span>`:''}<button class="tighten" onclick="tighten('${k}',event)">Tighten</button></div>
    <div class="snips" onclick="event.stopPropagation()">
      <div class="nt"><span class="av">SA</span><span>${esc(sn.n)}</span></div>
      <div class="cs">${sn.c.map((c,i)=>`<button class="snip ${(s.used||[]).includes(i)?'used':''}" onclick="addSnip('${k}',${i})">${esc(c)}</button>`).join('')}</div>
      <div class="hint">One tap adds it. Each section has a ${b}-word budget.</div>
    </div></div>`;
}
function hl(t,last){let h=esc(t);if(last){const e=esc(last),i=h.lastIndexOf(e);if(i>-1)h=h.slice(0,i)+'<mark>'+e+'</mark>'+h.slice(i+e.length)}return h}
function renderDoc(){$('secs').innerHTML=SECS.map(s=>secHTML(s[0])).join('')}
function renderSec(k){const el=document.querySelector(`.sec[data-k="${k}"]`);if(!el)return renderDoc();el.outerHTML=secHTML(k)}
function toggleSec(k,e){S.open=S.open===k?null:k;renderDoc()}
function setFocus(keys){S.focus=keys;renderDoc();
  const el=document.querySelector(`.sec[data-k="${keys[0]}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})}

function setGrade(k,g,quiet){
  const s=S.sec[k],from=s.g;g=Math.max(0,Math.min(11,g));if(g===from)return;
  s.g=g;const el=$('g-'+k);
  if(el){el.className='gr flip '+gcls(g);el.textContent=LET[g]}
  if(!quiet)delta(`${LABEL[k]} <b>${LET[from]} → ${LET[g]}</b>`,g>from);
  const before=S.lastOverall;S.lastOverall=overallIdx();updateDial();
}
function delta(html,up){const d=document.createElement('div');d.className='delta '+(up?'up':'dn');d.innerHTML=html;$('deltas').prepend(d);later(()=>d.remove(),2700)}

// write a section with a typewriter, then settle the grade
function write(k,text,g,done){
  const s=S.sec[k];s.t=text;s.v1=0;s.last=null;s.used=[];bumpVer();
  renderSec(k);
  const el=$('t-'+k);el.classList.remove('note');
  let i=0;const step=Math.max(1,Math.ceil(text.length/55));
  (function tick(){
    i=Math.min(text.length,i+step);
    el.innerHTML=esc(text.slice(0,i))+'<span class="caret"></span>';
    if(i<text.length)later(tick,16);
    else later(()=>{renderSec(k);setGrade(k,g);done&&done()},120);
  })();
}
function addSnip(k,i){
  const s=S.sec[k],c=SNIPS[k].c[i];
  if(k==='test'){s.extra=((s.extra||'')+' '+c).trim()}else{s.t=(s.t?s.t.replace(/\s*$/,'')+' ':'')+c}
  s.last=c;s.v1=0;(s.used=s.used||[]).push(i);bumpVer();
  renderSec(k);setGrade(k,s.g+1);
}
function tighten(k,e){e.stopPropagation();const s=S.sec[k],b=budget(k);
  const sent=s.t.match(/[^.!?]+[.!?]*/g)||[s.t];let out='';
  for(const x of sent){if(words(out+x)>b)break;out+=x}
  s.t=(out||s.t.split(/\s+/).slice(0,b).join(' ')).trim();s.last=null;bumpVer();renderSec(k);toast('Trimmed to '+words(s.t)+' words. Kept the sharpest lines.')}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);later(()=>t.remove(),2400)}

/* ---------------- interview (left) ---------------- */
const ROUNDS=['Problem & user','Objective','Shape','Proof & risk'];
function roundHTML(r){
  if(!r)return '';
  return `<div class="round rise"><div class="segs">${[1,2,3,4].map(n=>`<i class="${n<r?'done':n===r?'now':''}"></i>`).join('')}</div>
    <div class="lbl">Round <b>${r} of 4</b> · ${ROUNDS[r-1]}</div></div>`;
}
function saHTML(text,push,cls='rise'){return `<div class="sa ${push?'push':''} ${cls}"><div class="av">SA</div><div><div class="who">Your SA${push?'<span class="pushtag">Pushback</span>':''}</div><div class="say">${text}</div></div></div>`}

function go(id,fast){
  const st=STEPS[id];S.step=id;
  if(st.round&&S.lastRound&&st.round>S.lastRound)snapshot('R'+S.lastRound);
  if(st.round)S.lastRound=st.round;
  if(st.focus)setFocus(st.focus);
  const L=$('left');L.scrollTop=0;
  if(fast){st.render(L);return}
  L.innerHTML=roundHTML(st.round)+`<div class="thinking">Your SA is thinking</div><div class="shim"><i></i><i></i><i></i></div>`;
  later(()=>st.render(L),450+Math.random()*650);
}
let KEYS=null;
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.isContentEditable)return;
  if(KEYS&&KEYS[e.key]){e.preventDefault();KEYS[e.key]()}
});

// generic single-choice step
function choice(L,st){
  const opts=st.opts();
  L.innerHTML=roundHTML(st.round)+saHTML(st.sa(),st.push)+
    `<h1 class="q rise2">${st.q}</h1><div class="opts rise3" id="opts">${opts.map((o,i)=>
      `<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span><div class="t">${o.t}</div>${o.s?`<div class="s">${o.s}</div>`:''}</span></button>`).join('')}</div>`+
    (st.free?`<div class="freeline rise3"><span>Or say it</span><input id="free" placeholder="${st.free}" /></div>`:'')+`<div id="react"></div>`;
  const pick=i=>{
    KEYS=null;const o=opts[i],box=$('opts');box.classList.add('locked');box.children[i].classList.add('on');
    const free=$('free')?$('free').value.trim():'';
    const r=o.go(free)||{};
    later(()=>{
      $('react').innerHTML=`<div class="react">${r.say?saHTML(r.say,r.push,''):''}
        <button class="cont" id="cont">Continue <kbd>↵</kbd></button><button class="link" onclick="go('${S.step}')">Change my answer</button></div>`;
      $('cont').onclick=()=>go(r.next);KEYS={Enter:()=>go(r.next)};
    },r.delay||900);
  };
  document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  KEYS=Object.fromEntries(opts.map((o,i)=>[String(i+1),()=>pick(i)]));
  if($('free'))$('free').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){pick(st.freePick||0)}});
}

const STEPS={
  intro:{render(L){
    KEYS={Enter:()=>go('user')};
    L.innerHTML=`<div class="round rise"><div class="lbl">Before we start</div></div>
      ${saHTML('I read your idea and graded it as it stands. <b>D+</b>. The instinct is right. The brief is thin, so the build would guess at most of it.')}
      <div class="draft rise2"><small>Your first draft</small>Our store managers throw away a lot of food at the end of the day. I want something that helps them order better and see where the waste is.</div>
      <h1 class="q rise2">Four short rounds. <em>I'll ask, you pick, the brief on the right writes itself.</em></h1>
      <div class="rise3" style="color:var(--navy3);max-width:600px">About four minutes. You can stop after round three and build. Every answer lands in the brief and ends up in your PROJECT.md.</div>
      <button class="cont rise3" style="margin-top:26px" onclick="go('user')">Pull up a chair <kbd>↵</kbd></button>`;
  }},

  user:{round:1,focus:['user'],render(L){choice(L,this)},
    sa:()=>'Let\'s start with a person, not a product.',
    q:'Who is standing in the store <em>when this matters most?</em>',free:'e.g. the shift lead doing the Friday order',
    opts:()=>[
      {t:'The manager placing tomorrow\'s order',s:'Morning, about 10 minutes, on the back office tablet',
        go:f=>{write('user',f?f.replace(/\.?$/,'.'):'Store manager, placing tomorrow\'s fresh food order in the morning. About 10 minutes on the back office tablet.',9);S.picks.user='order';
          return {say:'Good. That\'s the moment you can still change the outcome.',next:'problem'}}},
      {t:'The manager logging waste at close',s:'8pm, end of shift, wants to go home',
        go:()=>({next:'userPush',delay:500})},
      {t:'The regional ops manager',s:'Weekly review across 20 to 30 stores',
        go:()=>{write('user','Regional ops manager, weekly review across 20 to 30 stores.',7);S.picks.user='regional';
          return {say:'Fair. Keep in mind they don\'t place the order, the store does. Someone downstream has to act on it.',next:'problem'}}},
    ]},
  userPush:{round:1,focus:['user'],push:1,render(L){choice(L,this)},
    sa:()=>'I\'m going to push on that. At close, the food is already in the bin. The order is where waste gets decided.',
    q:'Want to <em>move the moment?</em>',
    opts:()=>[
      {t:'Move it to the morning order',s:'Catch it before it\'s ordered',
        go:()=>{write('user','Store manager, placing tomorrow\'s fresh food order in the morning. About 10 minutes on the back office tablet.',9);S.picks.user='order';
          return {say:'Good call. Close is still useful for logging, but the order is where you win.',next:'problem'}}},
      {t:'Keep it at close',s:'Logging waste accurately is the point',
        go:()=>{write('user','Store manager at close, logging what gets thrown away.',6);S.picks.user='close';
          write('risk','Logging at close explains waste but doesn\'t prevent it.',4);
          return {say:'Okay, your call. I\'ve noted the risk on the right so it doesn\'t get lost.',next:'problem'}}},
    ]},

  problem:{round:1,focus:['problem'],render(L){
    const opts=['Orders are gut feel','Same order every day, whatever the day or weather','Nobody sees waste by product','Deliveries land before the day\'s sales are known'];
    const on=new Set();
    L.innerHTML=roundHTML(1)+saHTML('Now the pain. Be specific, it steers everything after.')+
      `<h1 class="q rise2">What's actually going wrong today? <em>Pick all that are true.</em></h1>
      <div class="opts rise3" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span><div class="t">${o}</div></span></button>`).join('')}</div>
      <div class="freeline rise3"><span>Anything else</span><input id="free" placeholder="e.g. new starters don't know the par levels" /></div>
      <div id="react"><button class="cont rise3" id="cont" disabled>Pick at least one</button></div>`;
    const sync=()=>{const c=$('cont');c.disabled=!on.size;c.innerHTML=on.size?'That\'s the problem <kbd>↵</kbd>':'Pick at least one'};
    const tog=i=>{on.has(i)?on.delete(i):on.add(i);document.querySelector(`#opts .opt[data-i="${i}"]`).classList.toggle('on');sync()};
    document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>tog(+b.dataset.i));
    const done=()=>{if(!on.size)return;KEYS=null;$('opts').classList.add('locked');
      const parts=[];
      if(on.has(0))parts.push('Fresh food orders are placed on gut feel');
      if(on.has(1))parts.push(on.has(0)?'so the same quantities arrive whether it\'s a wet Tuesday or a sunny Saturday':'The same quantities arrive whether it\'s a wet Tuesday or a sunny Saturday');
      let t=parts.join(', ')+(parts.length?'.':'');
      if(on.has(2))t+=(t?' ':'')+'Nobody can see which products drive the waste.';
      if(on.has(3))t+=(t?' ':'')+'Deliveries land before the day\'s sales are known.';
      const f=$('free').value.trim();if(f)t+=' '+f.replace(/\.?$/,'.');
      S.weather=on.has(1);
      write('problem',t.trim(),on.size>=2?10:8);
      later(()=>{$('react').innerHTML=`<div class="react">${saHTML(on.size>=2?'That\'s a real problem statement. Notice the weather point. Hold that thought, it comes back in round four.':'Clear. One cause is fine, it keeps the build focused.','','')}
        <button class="cont" id="c2">On to the number <kbd>↵</kbd></button></div>`;$('c2').onclick=()=>go('objective');KEYS={Enter:()=>go('objective')}},700);
    };
    $('cont').onclick=done;
    KEYS={1:()=>tog(0),2:()=>tog(1),3:()=>tog(2),4:()=>tog(3),Enter:done};
  }},

  objective:{round:2,focus:['objective'],render(L){choice(L,this)},
    sa:()=>'Now the number. If nobody can say what moved, the build drifts.',
    q:'What number should move <em>if this works?</em>',free:'e.g. waste cost per store per week',
    opts:()=>[
      {t:'Food waste as a % of food sales',s:'Fair across big and small stores',go:f=>{S.metric=f||'Food waste as a % of food sales';write('objective','Reduce '+(f||'food waste as a % of food sales').replace(/\.$/,'')+'.',6);return {say:'Good choice. A percentage is fair across a big station store and a small high street one.',next:'objPush'}}},
      {t:'£ written off per store per week',s:'Easy for anyone to feel',go:()=>{S.metric='£ written off per store per week';write('objective','Reduce £ written off per store per week.',6);return {say:'Easy to feel. It does favour small stores, so compare like with like.',next:'objPush'}}},
      {t:'Fewer sell-outs',s:'Stop running out by lunchtime',go:()=>{S.metric='Sell-outs per store per day';write('objective','Reduce sell-outs of fresh food.',4);return {say:'Interesting, but that\'s the opposite problem. More stock fixes sell-outs and makes waste worse. I\'d keep it as a guardrail instead.',push:1,next:'objPush'}}},
    ]},
  objPush:{round:2,focus:['risk','objective'],push:1,render(L){choice(L,this)},
    sa:()=>'I\'m not convinced yet. A regional manager would ask: if waste drops because the shelves are empty by 2pm, did we win?',
    q:'How do you want to <em>handle that?</em>',
    opts:()=>[
      {t:'Track sell-outs as a guardrail',s:'Waste goes down, sell-outs stay flat or better',go:()=>{S.guard=1;
        write('risk','Cutting waste by under-ordering and losing sales. Guardrail: sell-out rate must not rise.',9);
        return {say:'That\'s the answer I was hoping for. It makes the win honest.',next:'target'}}},
      {t:'Waste only, keep it simple',s:'We can add sell-outs later',go:()=>{S.guard=0;
        write('risk','Under-ordering to hit a waste target. Not guarded in v1.',5);
        return {say:'Okay. Simple is fair for a day. It\'s logged as an open risk.',next:'target'}}},
    ]},
  target:{round:2,focus:['objective'],render(L){choice(L,this)},
    sa:()=>'Last piece of the objective. A target turns a hope into a test.',
    q:'By how much, <em>and by when?</em>',free:'e.g. 12% in the 10 pilot stores by December',freePick:0,
    opts:()=>[
      {t:'Down 15% in 8 weeks',s:'Ambitious, fits a pilot',go:f=>tgt(f||'down 15% in 8 weeks')},
      {t:'Down 10% this quarter',s:'Safer, easier to defend',go:f=>tgt(f||'down 10% this quarter')},
      {t:'Down 20% in the pilot stores',s:'Big, but only where you\'re watching',go:f=>tgt(f||'down 20% in the pilot stores')},
    ]},

  concepts:{round:3,focus:['decision','scope'],render(L){
    const C=[
      {k:'coach',n:'A · Browse and act',t:'Order coach',d:'Opens on tomorrow\'s order. A suggested quantity for each item, with one line of why.',p:'Fits the morning moment',m:'Needs managers to trust the number',svg:svgCoach()},
      {k:'dash',n:'B · Monitor',t:'Waste dashboard',d:'Where the waste happened, by store, product and day.',p:'Fastest to build',m:'Shows the problem, doesn\'t change the order',svg:svgDash()},
      {k:'agent',n:'C · Agent drafts',t:'Order agent',d:'An agent drafts the order overnight. The manager approves or overrides each line.',p:'Least effort for the manager',m:'Most to build in a day',svg:svgAgent()},
    ];
    L.innerHTML=roundHTML(3)+saHTML('Here are three ways to build it. Same data underneath. They differ in who does the thinking.')+
      `<h1 class="q rise2">Which one would your managers <em>actually open?</em></h1>
      <div class="concepts rise3" id="cc">${C.map((c,i)=>`<button class="cc" data-i="${i}">${c.svg}<div class="n">${c.n}</div><div class="t">${c.t}</div><div class="d">${c.d}</div>
        <div class="pc"><div class="p"><b>+</b>${c.p}</div><div class="m"><b>−</b>${c.m}</div></div></button>`).join('')}</div><div id="react"></div>`;
    const pick=i=>{KEYS=null;$('cc').classList.add('locked');$('cc').children[i].classList.add('on');S.concept=C[i];
      let say,next='playback';
      if(i===0){write('decision','Accept or adjust a suggested quantity for each fresh item, before the order is sent.',10);
        write('scope','One store, fresh food only. Suggested quantities with a one-line reason.',8);
        say='My pick too. It meets the manager in the moment you chose in round one.';}
      if(i===1){write('decision','Spot which products and days drive the waste.',6);
        write('scope','All stores, fresh food only. Waste by store, product and day.',8);
        say='Honest note: this shows the waste, it doesn\'t change the order. Fine for a day. I\'ve parked a suggested quantity for v2.';}
      if(i===2){write('decision','Approve or override each line of an agent-drafted order, with every decision recorded.',10);
        write('scope','One store, fresh food only. An agent drafts the order, the manager reviews each line.',6);
        say='Ambitious for one day. I like it, but we\'ll need to cut hard in round four.';}
      later(()=>{$('react').innerHTML=`<div class="react">${saHTML(say,i===1,'')}<button class="cont" id="c3">Continue <kbd>↵</kbd></button><button class="link" onclick="go('concepts')">Change my answer</button></div>`;
        $('c3').onclick=()=>go(next);KEYS={Enter:()=>go(next)}},900);
    };
    document.querySelectorAll('#cc .cc').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
    KEYS={1:()=>pick(0),2:()=>pick(1),3:()=>pick(2)};
  }},

  playback:{round:3,focus:['user','objective','decision'],render(L){
    const u=S.picks.user==='regional'?'a regional ops manager doing the weekly review':S.picks.user==='close'?'a store manager at close':'a store manager placing tomorrow\'s order';
    const txt=S.summary||`For <b>${u}</b>, a <b>${S.concept.t.toLowerCase()}</b> that helps them <b>${S.sec.decision.t.replace(/\.$/,'').replace(/^./,c=>c.toLowerCase())}</b>, so that <b>${(S.metric||'waste').toLowerCase()}</b> goes <b>${S.target}</b>${S.guard?', without more sell-outs':''}.`;
    L.innerHTML=roundHTML(3)+saHTML('Let me play that back in one sentence.')+
      `<h1 class="q rise2">Did I get that <em>right?</em></h1>
      <div class="playback rise3" id="pb">${txt}</div>
      <div class="rise3" id="pbact"><button class="cont" id="yes">Yes, that's it <kbd>↵</kbd></button><button class="link" id="edit">Let me fix it</button></div>`;
    const yes=()=>{KEYS=null;S.summary=$('pb').innerHTML;$('pb').contentEditable=false;bumpVer();go('fork')};
    $('yes').onclick=yes;KEYS={Enter:yes};
    $('edit').onclick=()=>{KEYS=null;const p=$('pb');p.contentEditable=true;p.focus();
      const r=document.createRange();r.selectNodeContents(p);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);
      $('pbact').innerHTML=`<button class="cont" id="save">Save my version</button><span style="margin-left:14px;color:var(--navy3);font-size:13px">Keep it to one sentence.</span>`;
      $('save').onclick=()=>{p.contentEditable=false;S.summary=p.innerHTML;bumpVer();toast('Saved. Your wording goes into PROJECT.md as the one-liner.');later(()=>go('fork'),600)}};
  }},

  fork:{round:3,focus:[],render(L){
    const g=LET[overallIdx()];
    L.innerHTML=roundHTML(3)+saHTML(`That's a <b>${g}</b> brief. Honestly, you could build from here.`)+
      `<h1 class="q rise2">Keep going, <em>or build now?</em></h1>
      <div class="opts rise3" id="opts">
        <button class="opt" id="more"><span class="k">1</span><span><div class="t">Keep going · Round 4 · Proof &amp; risk</div><div class="s">About 90 seconds. Checks your data, writes the exam, cuts scope to fit the day.</div></span></button>
        <button class="opt" id="ready"><span class="k">2</span><span><div class="t">I'm ready, build it</div><div class="s">Data and success test get flagged as open in PROJECT.md.</div></span></button>
      </div>
      <div class="rise3" style="margin-top:18px;color:var(--navy3);font-size:13.5px;max-width:560px">Builds that skip round four usually lose that time mid-build finding out a table doesn't exist. Your call.</div>`;
    const more=()=>{KEYS=null;go('data')},ready=()=>{KEYS=null;S.early=true;finish()};
    $('more').onclick=more;$('ready').onclick=ready;KEYS={1:more,2:ready};
  }},

  data:{round:4,focus:['data'],render(L){
    const needW=S.weather;
    L.innerHTML=roundHTML(4)+saHTML('I checked what\'s already in <code style="font-family:var(--mono);font-size:14px">workshop.retail_commercial</code>.')+
      `<div class="tables rise2"><span class="tbl"><i></i>dim_store</span><span class="tbl"><i></i>fact_transactions</span><span class="tbl"><i></i>dim_product</span><span class="tbl"><i></i>sales_forecast</span><span class="tbl miss"><i></i>waste_log · generate</span>${needW?'<span class="tbl miss"><i></i>weather · missing</span>':''}</div>
      <h1 class="q rise2">${needW?'No waste data, so we generate a waste_log. You also mentioned weather. <em>There\'s no weather table.</em> What do we do?':'Sales are there, waste isn\'t. We generate a waste_log in your schema. <em>Want to add anything else?</em>'}</h1>
      <div class="opts rise3" id="opts">${needW?`
        <button class="opt" data-i="0"><span class="k">1</span><span><div class="t">Generate a small synthetic weather table</div><div class="s">About 120 rows, joins on site and date. Adds 1.5 hours.</div></span></button>
        <button class="opt" data-i="1"><span class="k">2</span><span><div class="t">Leave weather out of v1</div><div class="s">Park it for v2. Day of week does most of the work anyway.</div></span></button>`:`
        <button class="opt" data-i="1"><span class="k">1</span><span><div class="t">No, just the waste_log</div><div class="s">Seeded sales plus a generated waste_log is enough.</div></span></button>`}
      </div><div id="react"></div>`;
    const pick=i=>{KEYS=null;$('opts').classList.add('locked');document.querySelector(`#opts .opt[data-i="${i}"]`).classList.add('on');
      let say;
      if(i===0){write('data','Seeded dim_store, fact_transactions and dim_product. Generates waste_log and a small weather table in my schema.',10);S.scope.weather=true;say='Done. It goes in your own schema so the shared data stays read only.'}
      else{write('data','Seeded dim_store, fact_transactions and dim_product. Generates a waste_log in my schema.',10);S.scope.weather=false;S.weatherParked=needW;say=needW?'Sensible. Parked for v2. One less thing to go wrong today.':'Good. One small generated table, the rest is seeded.'}
      later(()=>{$('react').innerHTML=`<div class="react">${saHTML(say,0,'')}<button class="cont" id="c4">Write the exam <kbd>↵</kbd></button></div>`;$('c4').onclick=()=>go('exam');KEYS={Enter:()=>go('exam')}},800);
    };
    document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
    KEYS=needW?{1:()=>pick(0),2:()=>pick(1)}:{1:()=>pick(1)};
  }},

  exam:{round:4,focus:['test'],render(L){
    const sug=['What should store 1042 order of ham & cheese toasties tomorrow?','Which 5 products drove the most waste last month?',
      S.guard?'Did waste fall at pilot stores without more sell-outs?':'Did waste fall at the pilot stores?','Why is today\'s suggestion lower than yesterday\'s order?','Which stores waste the most pastries on Mondays?'];
    L.innerHTML=roundHTML(4)+saHTML('Now write the exam. Three questions the app has to get right on demo day. If it can\'t answer them, it isn\'t done.')+
      `<h1 class="q rise2">Pick or write <em>three questions.</em><span class="counter" id="cnt">0 / 3</span></h1>
      <div class="chips rise3" id="chips">${sug.map((q,i)=>`<button class="chipq" data-i="${i}">${esc(q)}</button>`).join('')}</div>
      <div class="freeline rise3"><span>Write one</span><input id="free" placeholder="Press enter to add" /></div>
      <div class="examlist" id="el"></div>
      <div id="react"><button class="cont" id="cont" disabled>Pick three</button></div>`;
    const draw=()=>{const x=S.exam;$('el').innerHTML=x.map(q=>`<div class="row">${esc(q)}</div>`).join('')+Array(Math.max(0,3-x.length)).fill('<div class="empty">A question it must get right</div>').join('');
      $('cnt').textContent=x.length+' / 3';const c=$('cont');c.disabled=x.length<3;c.innerHTML=x.length<3?`Pick ${3-x.length} more`:'That\'s the exam <kbd>↵</kbd>';
      document.querySelectorAll('#chips .chipq').forEach(b=>b.classList.toggle('on',x.includes(sug[+b.dataset.i])))};
    S.exam=[];draw();
    document.querySelectorAll('#chips .chipq').forEach(b=>b.onclick=()=>{const q=sug[+b.dataset.i],i=S.exam.indexOf(q);
      if(i>-1)S.exam.splice(i,1);else if(S.exam.length<3)S.exam.push(q);else toast('Three is the limit. Tap one to swap it out.');draw()});
    $('free').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){if(S.exam.length<3){S.exam.push(e.target.value.trim().replace(/\??$/,'?'));e.target.value='';draw()}else toast('Three is the limit.')}});
    const done=()=>{if(S.exam.length<3)return;KEYS=null;S.sec.test.t='exam';S.sec.test.v1=0;bumpVer();renderSec('test');setGrade('test',11);
      later(()=>{$('react').innerHTML=`<div class="react">${saHTML('Good exam. These become your eval set, so on demo day you can prove it works, not just show it.',0,'')}<button class="cont" id="c5">Last one: fit it in a day <kbd>↵</kbd></button></div>`;$('c5').onclick=()=>go('scope');KEYS={Enter:()=>go('scope')}},500)};
    $('cont').onclick=done;KEYS={Enter:done};
  }},

  scope:{round:4,focus:['scope'],render(L){
    const agent=S.concept&&S.concept.k==='agent';
    const F=[
      ['qty',agent?'Agent drafts a quantity per item':'Suggested quantity per item',agent?3:2,'The core of it'],
      ['why','One-line reason per suggestion',1,'Why the number is what it is'],
      ['save','Accept or adjust, saved to Lakebase',2,'The audit trail of decisions'],
      ['weather','Weather adjustment',1.5,S.weatherParked?'Parked in round 4':S.scope.weather?'Uses the synthetic weather table':'Needs weather data you don\'t have yet'],
      ['rollup','Regional rollup across stores',2,'For the regional ops view'],
      ['supplier','Send the order to the supplier',4,'Real integration, not for a day'],
    ];
    if(S.weatherParked)S.scope.weather=false;
    L.innerHTML=roundHTML(4)+saHTML('Last one. A day goes fast. Keep what the manager needs tomorrow morning, park the rest.')+
      `<h1 class="q rise2">You have <em>six build hours.</em> Spend them.</h1>
      <div class="budget rise3"><div class="meta"><span>Build hours</span><span id="bm"></span></div><div class="bar"><div class="fill" id="bf"></div><div class="cap" style="left:${6/10*100}%"></div></div></div>
      <div class="scope rise3" id="sc">${F.map(f=>`<div class="srow" data-k="${f[0]}"><button class="sw" ${f[0]==='weather'&&S.weatherParked?'disabled':''}></button><div class="nm">${f[1]}<small>${f[3]}</small></div><div class="hr tnum">${f[2]}h</div></div>`).join('')}</div>
      <div id="react"><button class="cont rise3" id="cont">Lock scope <kbd>↵</kbd></button></div>`;
    const draw=()=>{let h=0;document.querySelectorAll('#sc .srow').forEach(r=>{const k=r.dataset.k,on=S.scope[k];r.classList.toggle('off',!on);r.querySelector('.sw').classList.toggle('on',on);if(on)h+=F.find(f=>f[0]===k)[2]});
      const over=h>6;$('bf').style.width=Math.min(100,h/10*100)+'%';$('bf').classList.toggle('over',over);
      $('bm').innerHTML=over?`<span class="warn tnum">${h}h · over by ${h-6}h</span>`:`<b class="tnum">${h}h</b> of 6h`;
      $('cont').innerHTML=over?'Lock it anyway':'Lock scope <kbd>↵</kbd>';S.hours=h};
    document.querySelectorAll('#sc .srow').forEach(r=>r.onclick=()=>{const k=r.dataset.k;if(k==='weather'&&S.weatherParked){toast('Parked in round four.');return}S.scope[k]=!S.scope[k];draw()});
    draw();
    const done=()=>{KEYS=null;const over=S.hours>6;
      const inn=F.filter(f=>S.scope[f[0]]).map(f=>f[1].toLowerCase());
      S.parked=F.filter(f=>!S.scope[f[0]]).map(f=>f[1]);
      write('scope',`One store, fresh food only. In: ${inn.join(', ')}.`,over?7:10);
      later(()=>{$('react').innerHTML=`<div class="react">${saHTML(over?'You\'re over, so expect to cut something around 3pm. I\'ve noted it.':'That fits. Everything you parked goes on the v2 list, nothing is lost.',over,'')}<button class="cont" id="c6">See the handoff <kbd>↵</kbd></button></div>`;$('c6').onclick=finish;KEYS={Enter:finish}},900)};
    $('cont').onclick=done;KEYS={Enter:done};
  }},
};
function tgt(t){S.target=t.toLowerCase().replace(/\.$/,'');
  const base=S.sec.objective.t.replace(/\.$/,'');
  write('objective',`${base}, ${S.target}.${S.guard?' Sell-outs must not rise.':''}`,S.guard?10:9);
  return {say:'Now it\'s a test, not a hope. That\'s round two done.',next:'concepts'};
}

/* ---------------- finish + handoff ---------------- */
function finish(){
  snapshot(S.early?'R3':'R4');setFocus([]);
  const g=LET[overallIdx()],from=S.hist[0].g;
  const L=$('left');
  L.innerHTML=`<div class="round rise"><div class="segs">${[1,2,3,4].map(n=>`<i class="${S.early&&n===4?'':'done'}"></i>`).join('')}</div><div class="lbl">${S.early?'Stopped after round 3':'All four rounds'}</div></div>
    ${saHTML(S.early?'Good enough to build. I\'ve flagged what we skipped so it doesn\'t surprise you later.':'That\'s a build-ready brief. Nice work.')}
    <h1 class="q rise2" style="font-size:56px">${from} <em style="color:var(--line2)">→</em> ${g}</h1>
    <div class="rise3" style="color:var(--navy3);max-width:560px">Everything you decided in the last few minutes becomes your PROJECT.md. You can still tap any section on the right to tighten it first.</div>
    <button class="cont rise3" style="margin-top:24px" onclick="handoff()">Open the handoff <kbd>↵</kbd></button><button class="link rise3" onclick="init()">Start over</button>`;
  KEYS={Enter:handoff};
}
function handoff(){
  const s=S.sec,g=LET[overallIdx()];
  const concept=S.concept||{t:'Order coach',n:'A · Browse and act'};
  const imodel={coach:'browse_act',dash:'monitor',agent:'agent_actions'}[concept.k]||'browse_act';
  const parked=[...(S.parked||[])];
  if(S.weatherParked&&!parked.includes('Weather adjustment'))parked.push('Weather adjustment');
  if(S.concept)parked.push(...['Order coach','Waste dashboard','Order agent'].filter(x=>x!==concept.t).map(x=>x+' (considered, not chosen)'));
  const risks=[];
  if(s.risk.t)risks.push(s.risk.t);
  (s.risk.used||[]).forEach(i=>risks.push(SNIPS.risk.c[i]));
  if(S.hours>6)risks.push(`Scope is ${S.hours}h against a 6h day. Expect to cut.`);
  const mit=t=>t.includes('Guardrail')?t.replace(/Guardrail:/,'<span class="mit">Mitigation:</span>'):t;
  $('hand').innerHTML=`
    <div class="hh"><div class="big tnum">${S.hist[0].g}<small>→</small>${g}</div><div><h3>Ready to build</h3><p>${S.ver} versions · ${S.hist.length} grade steps · ${S.early?'stopped after round 3':'all four rounds'}</p></div><span class="sp"></span><button class="btn-ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="$('veil').classList.remove('show')">Close</button></div>
    <div class="body">
      <div class="md">
        <div class="file"><i></i>PROJECT.md · what flows in</div>
        <h4>In one line</h4><p style="font-family:var(--serif);font-size:18px">${S.summary||'<span class="open">not played back</span>'}</p>
        <h4>Decisions</h4>
        <div class="kv"><span>Interaction model</span><div>${concept.t} <code style="font-family:var(--mono);font-size:12px;color:var(--navy3)">${imodel}</code></div>
          <span>User &amp; moment</span><div>${esc(s.user.t)}</div>
          <span>Objective</span><div>${esc(s.objective.t)}</div>
          <span>Decision it drives</span><div>${esc(s.decision.t)}</div>
          <span>Data</span><div>${s.data.t?esc(s.data.t):'<span class="open">open · not checked</span>'}</div>
          <span>Scope</span><div>${s.scope.t?esc(s.scope.t):'<span class="open">open</span>'}</div></div>
        <h4>Success test</h4>${S.exam.length?`<ol>${S.exam.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>`:'<p><span class="open">open · no exam written</span> The build agent will ask you for three test questions before it finishes.</p>'}
        <h4>Risks &amp; mitigations</h4>${risks.length?`<ul>${risks.map(r=>`<li>${mit(esc(r))}</li>`).join('')}</ul>`:'<p><span class="open">none named</span></p>'}
        <h4>Parked for v2</h4>${parked.length?`<ul>${parked.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:'<p style="color:var(--navy3)">Nothing parked.</p>'}
      </div>
      <div class="side">
        <div class="k">Report card</div>
        <div class="gl">${SECS.map(x=>`<div><span>${x[1]}</span><span class="gr ${gcls(s[x[0]].g)}">${LET[s[x[0]].g]}</span></div>`).join('')}</div>
        <div class="k">Grade history</div>
        <div class="foot" style="padding:0 0 18px;border:none"><div class="hist">${S.hist.map((h,i)=>(i?'<em>→</em>':'')+`<span>${h.g}</span>`).join('')}</div></div>
        <button class="ship" onclick="toast('Prototype: this would generate the build plan from PROJECT.md.')">Generate build plan</button>
        <button class="btn-ghost back" onclick="$('veil').classList.remove('show')">Back to the brief</button>
      </div>
    </div>`;
  $('veil').classList.add('show');
}

/* ---------------- concept sketches ---------------- */
function svgCoach(){return `<svg viewBox="0 0 200 92" fill="none" stroke="#5A8A9A" stroke-width="1.4">
  <rect x="40" y="10" width="120" height="72" rx="6" fill="#fff"/>
  ${[0,1,2,3].map(i=>`<line x1="50" y1="${24+i*15}" x2="${100-i*8}" y2="${24+i*15}" stroke-width="2.2" stroke-linecap="round" stroke="#c9d3d6"/>
   <rect x="120" y="${18+i*15}" width="28" height="11" rx="3" ${i===1?'fill="#e8f7f1" stroke="#00A870"':'fill="#F5F3EF"'}/>`).join('')}
  <path d="M112 38 l-6 3 6 3" stroke="#00A870"/></svg>`}
function svgDash(){return `<svg viewBox="0 0 200 92" fill="none" stroke="#5A8A9A" stroke-width="1.4">
  <rect x="40" y="10" width="120" height="72" rx="6" fill="#fff"/>
  ${[26,40,18,50,34,22,44].map((h,i)=>`<rect x="${52+i*14}" y="${72-h}" width="8" height="${h}" rx="1.5" fill="${i===3?'#FF3621':'#c9d3d6'}" stroke="none"/>`).join('')}
  <line x1="48" y1="72" x2="152" y2="72"/></svg>`}
function svgAgent(){return `<svg viewBox="0 0 200 92" fill="none" stroke="#5A8A9A" stroke-width="1.4">
  <rect x="52" y="22" width="104" height="58" rx="6" fill="#EEEDE9"/><rect x="46" y="16" width="104" height="58" rx="6" fill="#F5F3EF"/>
  <rect x="40" y="10" width="104" height="58" rx="6" fill="#fff"/>
  <circle cx="54" cy="24" r="5" fill="#1B3139" stroke="none"/>
  <line x1="64" y1="24" x2="110" y2="24" stroke-width="2.2" stroke-linecap="round" stroke="#c9d3d6"/>
  <line x1="50" y1="40" x2="128" y2="40" stroke-width="2.2" stroke-linecap="round" stroke="#c9d3d6"/>
  <rect x="84" y="50" width="24" height="11" rx="3" fill="#e8f7f1" stroke="#00A870"/><path d="M90 55.5 l2.5 2.5 5-5" stroke="#00A870"/>
  <rect x="112" y="50" width="24" height="11" rx="3" fill="#fff"/><path d="M121 53 l6 5 M127 53 l-6 5" stroke="#FF3621"/></svg>`}

init();
</script>
