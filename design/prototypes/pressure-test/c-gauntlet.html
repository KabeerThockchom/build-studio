<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Direction C · The Gauntlet · Build Studio pressure test</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#1B3139;--navy2:#2E5A6B;--navy3:#5A8A9A;
  --oat:#F5F3EF;--oat2:#EEEDE9;--line:#e6e3dd;--line2:#d8d3ca;
  --green:#00A870;--greenl:#2BC48A;--green-soft:#e8f7f1;--green-ink:#046a48;
  --lava:#FF3621;--amber:#F59E0B;--paper:#fffefb;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--oat);color:var(--navy);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.mono{font-family:"DM Mono",monospace}
.disp{font-family:"Bricolage Grotesque","DM Sans",sans-serif}
.num{font-variant-numeric:tabular-nums}
.k{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy3)}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line)}
.top a.back{color:var(--navy2);text-decoration:none;font-weight:500;font-size:14px}
.top a.back:hover{color:var(--navy)}
.tag{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--line2);border-radius:99px;color:var(--navy2)}
.top .title{font-weight:600}
.top .sp{flex:1}
.btn-reset{border:1px solid var(--line2);background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.btn-reset:hover{background:var(--oat2)}

/* HUD */
.hud{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:grid;grid-template-columns:auto minmax(260px,1fr) auto auto;gap:34px;align-items:center;padding:12px 24px;box-shadow:0 10px 30px -20px rgba(0,0,0,.6)}
.hud .k{color:#9fbac3}
.grade{display:flex;align-items:center;gap:14px}
.gl{width:64px;height:64px;border-radius:14px;background:var(--oat);color:var(--navy);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:32px;letter-spacing:-.03em;position:relative;box-shadow:inset 0 0 0 3px var(--line2);transition:box-shadow .4s;perspective:400px}
.gl.tA{box-shadow:inset 0 0 0 3px var(--green)}
.gl.tB{box-shadow:inset 0 0 0 3px var(--navy3)}
.gl.tC{box-shadow:inset 0 0 0 3px var(--amber)}
.gl.tD,.gl.tF{box-shadow:inset 0 0 0 3px var(--lava)}
.gl .lt{display:inline-block}
.gl.flip .lt{animation:flip .56s cubic-bezier(.2,.7,.2,1)}
@keyframes flip{0%{transform:rotateX(0)}48%{transform:rotateX(90deg)}52%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.delta{position:absolute;right:-14px;top:-9px;background:var(--green);color:#fff;font-family:"DM Mono",monospace;font-size:11px;padding:2px 7px;border-radius:99px;animation:floatup 1.5s forwards;pointer-events:none}
.delta.neg{background:var(--lava)}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.gmeta .v{font-family:"DM Mono",monospace;font-size:13px;margin-top:2px}
.gmeta .lvl{font-weight:600;font-size:14px;margin-top:1px}

.budget .row{display:flex;justify-content:space-between;align-items:baseline;max-width:440px}
.budget .v{font-family:"DM Mono",monospace;font-size:13px}
.budget .over{background:var(--lava);color:#fff;border-radius:99px;padding:1px 8px;font-size:11px;margin-left:8px;font-family:"DM Mono",monospace}
.bar{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-top:7px;max-width:440px;height:12px}
.seg{background:rgba(255,255,255,.12);border-radius:2px;transition:background .35s}
.seg.on{background:var(--green)}
.seg.hot{background:var(--amber)}

.badges{display:flex;gap:8px}
.badge{width:42px;height:42px;border-radius:11px;border:1px dashed rgba(255,255,255,.25);display:grid;place-items:center;color:rgba(255,255,255,.28);position:relative}
.badge svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge.on{border:1px solid var(--green);background:rgba(0,168,112,.16);color:#7fe0bd;animation:pop .55s cubic-bezier(.2,.7,.2,1.5)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.badge .tip{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--navy);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 10px 20px -12px rgba(0,0,0,.4)}
.badge .tip b{display:block;font-weight:600}
.badge:hover .tip{opacity:1}
.traybtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.traybtn:hover{background:rgba(255,255,255,.13)}
.traybtn .c{font-family:"DM Mono",monospace;background:rgba(255,255,255,.14);border-radius:6px;padding:0 6px}

/* rail */
.rail{max-width:1340px;margin:0 auto;padding:16px 24px 14px;display:flex;gap:10px;align-items:center;font-family:"DM Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#a9b9bf}
.rail .on{color:var(--navy)}
.rail .done{color:var(--green-ink)}
.rail .sep{color:var(--line2)}

/* layout */
.wrap{max-width:1340px;margin:0 auto;padding:0 24px 90px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}.brief{position:static!important;max-height:none!important}.hud{grid-template-columns:auto 1fr;gap:18px}}
.table{background-color:var(--oat2);border:1px solid var(--line);border-radius:18px;padding:30px 30px 34px;min-height:600px;background-image:radial-gradient(rgba(27,49,57,.065) 1px,transparent 1px);background-size:14px 14px}
.h{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:31px;letter-spacing:-.025em;line-height:1.08;margin:0 0 8px}
.sub{color:var(--navy2);margin:0 0 24px;max-width:62ch}
.nav{display:flex;gap:14px;align-items:center;margin-top:28px;flex-wrap:wrap}
.primary{background:var(--navy);color:#fff;border:none;border-radius:11px;padding:12px 20px;font-weight:600;font-size:15px;transition:transform .15s,background .15s}
.primary:hover:not(:disabled){background:#0f2127;transform:translateY(-1px)}
.primary:disabled{background:#9fb1b7}
.primary.go{background:var(--green)}
.primary.go:hover:not(:disabled){background:var(--green-ink)}
.hint{color:var(--navy3);font-size:13.5px}
.ghost{background:transparent;border:1px solid var(--line2);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px}
.ghost:hover{background:var(--paper)}

/* idea card */
.idea{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 20px 12px;box-shadow:0 1px 0 var(--line),0 14px 34px -22px rgba(27,49,57,.35)}
.idea textarea{width:100%;border:none;outline:none;resize:none;background:transparent;font:inherit;font-size:18px;line-height:1.5;color:var(--navy);margin-top:6px;min-height:84px}
.idea .foot{display:flex;justify-content:space-between;border-top:1px dashed var(--line2);padding-top:8px;margin-top:4px}

/* SA bubble */
.sa{display:flex;gap:12px;align-items:flex-start;margin-top:16px;animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.av{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-family:"DM Mono",monospace;font-size:10.5px;display:grid;place-items:center;flex:none;margin-top:2px}
.sa .body{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:4px 12px 12px 12px;padding:10px 14px 11px;max-width:640px}
.sa .body.warn{border-left-color:var(--amber)}
.sa .body p{margin:3px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{border:1px solid var(--line2);background:var(--oat);border-radius:99px;padding:5px 12px;font-size:13px;display:inline-flex;gap:7px;align-items:center;text-align:left;transition:border-color .15s,background .15s,transform .1s}
.chip:hover:not(:disabled){border-color:var(--green);background:var(--green-soft)}
.chip:active:not(:disabled){transform:scale(.98)}
.chip .plus{font-family:"DM Mono",monospace;color:var(--green-ink);font-weight:500}
.chip .wc{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--navy3)}
.chip.used{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
.chip:disabled:not(.used){opacity:.4}
.chip.blk{display:flex;width:100%;border-radius:10px;padding:8px 11px;justify-content:space-between}

/* thinking */
.think{display:flex;gap:10px;align-items:center;color:var(--navy2);font-size:14px;margin-top:16px}
.shim{width:150px;height:7px;border-radius:99px;background:linear-gradient(90deg,var(--line) 0%,var(--navy3) 50%,var(--line) 100%);background-size:200% 100%;animation:shim 1s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}

/* personas */
.personas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1250px){.personas{grid-template-columns:repeat(2,1fr)}}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;text-align:left;position:relative;transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s;min-height:236px;display:flex;flex-direction:column;overflow:hidden}
.pc::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--accent)}
.pc:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:0 22px 34px -22px rgba(27,49,57,.5)}
.pc.sel{box-shadow:0 0 0 2px var(--navy),0 22px 34px -22px rgba(27,49,57,.5)}
.pav{width:48px;height:48px;border-radius:13px;background:var(--navy);color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;display:grid;place-items:center;font-size:17px;letter-spacing:-.02em;flex:none}
.pc .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;letter-spacing:-.015em;margin-top:14px;line-height:1.15}
.pc .ln{color:var(--navy2);font-size:14px;margin-top:6px;flex:1;font-style:italic}
.pc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.pips{display:flex;gap:3px}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.pips i.f{background:var(--navy)}
.pc .chk{position:absolute;top:16px;right:16px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:"DM Mono",monospace;font-size:12px;color:#fff;transition:.2s}
.pc.sel .chk{background:var(--navy);border-color:var(--navy)}

/* round */
.phd{display:flex;gap:16px;align-items:center}
.phd .pav{width:60px;height:60px;border-radius:16px;font-size:21px;box-shadow:0 0 0 4px var(--oat2),0 0 0 6px var(--accent)}
.phd .quote{font-style:italic;color:var(--navy2);margin-top:2px}
.deal{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin-top:26px}
.cc{--r:-1.2deg;width:350px;max-width:100%;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;position:relative;box-shadow:0 2px 0 var(--line),0 26px 40px -30px rgba(27,49,57,.55);animation:deal .62s cubic-bezier(.2,.7,.2,1) both;overflow:hidden;transform:rotate(var(--r))}
.cc + .cc{--r:1.1deg;animation-delay:.14s}
.cc.settled{animation:none}
@keyframes deal{from{opacity:0;transform:translate(-50px,-36px) rotate(-11deg)}to{opacity:1;transform:rotate(var(--r))}}
.cc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.cc .hd{display:flex;justify-content:space-between;align-items:center}
.sev{display:flex;gap:6px;align-items:center}
.sev .pp{display:flex;gap:3px}
.sev .pp i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.sev.s3 .pp i.f{background:var(--lava)}
.sev.s2 .pp i.f{background:var(--amber)}
.sev.s1 .pp i.f{background:var(--navy3)}
.cc .q{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:21px;line-height:1.2;letter-spacing:-.012em;margin:14px 0 8px;min-height:76px;transition:opacity .3s}
.cc .hits{font-size:12.5px;color:var(--navy2);margin-bottom:14px}
.cc .hits b{font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.act{border:1px solid var(--line2);background:var(--oat);border-radius:10px;padding:8px 6px 7px;font-weight:600;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:.15s}
.act small{font-weight:400;font-size:10.5px;color:var(--navy3);font-family:"DM Mono",monospace}
.act.m:hover,.act.m.on{border-color:var(--green);background:var(--green-soft)}
.act.a:hover{border-color:var(--amber);background:#fdf3e1}
.act.p:hover{border-color:var(--navy3);background:#eef3f5}
.fix{margin-top:12px;border-top:1px dashed var(--line2);padding-top:11px;animation:rise .3s both}
.fix .chips{flex-direction:column}
.stamp{position:absolute;top:44px;right:14px;border:2.5px solid;border-radius:6px;padding:3px 10px;font-family:"DM Mono",monospace;font-weight:500;font-size:13px;letter-spacing:.14em;transform:rotate(-8deg);animation:stamp .38s cubic-bezier(.2,.7,.2,1.45) both;background:rgba(255,254,251,.9)}
.stamp.m{color:var(--green-ink);border-color:var(--green)}
.stamp.a{color:#9a6300;border-color:var(--amber)}
.stamp.p{color:var(--navy2);border-color:var(--navy3)}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(1.9)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
.cc.played .q{opacity:.5}
.outcome{border-radius:10px;padding:9px 11px;font-size:13.5px;animation:rise .3s both}
.outcome.m{background:var(--green-soft);color:var(--green-ink)}
.outcome.a{background:#fdf3e1;color:#7a4e00}
.outcome.p{background:#eef3f5;color:var(--navy2)}
.outcome .k{color:inherit;opacity:.75;display:block;margin-bottom:1px}
.react{display:flex;gap:9px;margin-top:10px;font-size:13.5px;color:var(--navy2);animation:rise .35s both}
.react .av{width:24px;height:24px;font-size:9.5px;margin-top:0}

/* scope */
.meter{display:flex;align-items:flex-end;gap:18px;margin-bottom:22px}
.meter .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:64px;letter-spacing:-.04em;line-height:.9}
.meter .big small{font-size:26px;color:var(--navy3);letter-spacing:-.02em}
.meter .st{font-weight:600;padding-bottom:6px}
.meter .st.bad{color:var(--lava)}
.meter .st.ok{color:var(--green-ink)}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.fc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;transition:opacity .25s,transform .25s,background .25s;display:flex;flex-direction:column;min-height:150px}
.fc .pts{font-family:"DM Mono",monospace;font-size:13px;color:var(--navy2);background:var(--oat2);border-radius:6px;padding:1px 7px;align-self:flex-start}
.fc .fn{font-weight:700;font-size:16px;margin-top:10px}
.fc .fd{font-size:13.5px;color:var(--navy2);margin-top:3px;flex:1}
.fc .tg{margin-top:10px;align-self:flex-start;border:1px solid var(--line2);background:transparent;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600}
.fc .tg:hover{background:var(--oat2)}
.fc.out{opacity:.55;background:transparent;border-style:dashed;transform:scale(.98)}
.fc.out .fn{text-decoration:line-through;text-decoration-color:var(--lava)}

/* exam */
.slot{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px;transition:border-color .2s}
.slot.ok{border-color:var(--green)}
.slot.flag{border-color:var(--amber)}
.slot .n{font-family:"DM Mono",monospace;font-size:12px;color:var(--navy3);width:24px}
.slot input{flex:1;border:none;outline:none;background:transparent;font:inherit;font-size:16px;color:var(--navy);min-width:0}
.slot .wc{font-family:"DM Mono",monospace;font-size:11px;color:var(--navy3)}
.slot .wc.over{color:var(--lava)}
.verdict{font-size:13px;margin:-4px 0 12px 38px;animation:rise .3s both}
.verdict.ok{color:var(--green-ink)}
.verdict.flag{color:#9a6300}

/* report */
.rhead{display:flex;align-items:center;gap:22px;margin-bottom:18px}
.bigL{width:112px;height:112px;border-radius:24px;background:var(--navy);color:var(--oat);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:56px;letter-spacing:-.04em;animation:pop .6s cubic-bezier(.2,.7,.2,1.4) both}
.report{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1250px){.report{grid-template-columns:1fr}}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:6px 18px}
.rrow{display:grid;grid-template-columns:38px 132px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);animation:rise .4s both}
.rrow:last-child{border-bottom:none}
.rl{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:16px;background:var(--oat2)}
.rl.tA{background:var(--green-soft);color:var(--green-ink)}
.rl.tB{background:#e6eef1;color:var(--navy2)}
.rl.tC{background:#fdf1dc;color:#8a5a00}
.rl.tD,.rl.tF{background:#ffe7e3;color:#b3200f}
.rrow .dn{font-weight:600;font-size:14px}
.rrow .cm{font-size:13.5px;color:var(--navy2)}
.pitch{background:var(--navy);color:var(--oat);border-radius:18px;padding:22px 22px 18px;position:relative;overflow:hidden;box-shadow:0 26px 40px -28px rgba(27,49,57,.7)}
.pitch::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(0,168,112,.18)}
.pitch .k{color:#9fbac3}
.pitch input{background:transparent;border:none;outline:none;color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;letter-spacing:-.025em;width:100%;padding:0;margin:4px 0 12px;border-bottom:1px dashed rgba(255,255,255,.2)}
.pitch .pl{padding:8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:14px;position:relative;z-index:1}
.pitch .pl .k{display:block;margin-bottom:1px}
.pitch .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;position:relative;z-index:1}
.pitch .gr{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px}
.pitch .cp{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600}

/* handoff */
.ready{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 18px}
.ready .st{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.ready .st .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;line-height:1}
.md{background:#132329;color:#dfe8e4;border-radius:14px;padding:20px 22px;font-family:"DM Mono",monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;max-height:560px;overflow:auto;margin:0}
.md .h1{color:#fff;font-weight:500}
.md .h2{color:var(--greenl)}
.md .dim{color:#7f9aa3}

/* brief panel */
.brief{position:sticky;top:106px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 18px 10px;max-height:calc(100vh - 124px);overflow:auto}
.brief .bh{display:flex;justify-content:space-between;align-items:baseline}
.brief .bt{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em}
.ver{font-family:"DM Mono",monospace;font-size:11px;background:var(--oat2);border-radius:6px;padding:2px 7px;color:var(--navy2)}
.wb{margin:10px 0 4px}
.wb .row{display:flex;justify-content:space-between}
.wb .v{font-family:"DM Mono",monospace;font-size:11.5px}
.wbar{height:5px;background:var(--oat2);border-radius:99px;margin-top:5px;overflow:hidden}

.wbar i.warn{background:var(--amber)}

.wnote{font-size:12.5px;color:#9a6300;background:#fdf3e1;border-radius:8px;padding:7px 9px;margin-top:8px}

.bs .lab{display:flex;justify-content:space-between;align-items:center}
.mini{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:12px;border-radius:5px;padding:0 6px;min-width:26px;text-align:center}
.mini.tA{background:var(--green-soft);color:var(--green-ink)}
.mini.tB{background:#e6eef1;color:var(--navy2)}
.mini.tC{background:#fdf1dc;color:#8a5a00}
.mini.tD,.mini.tF{background:#ffe7e3;color:#b3200f}
.ln{font-size:14px;margin-top:4px;position:relative;padding:1px 22px 1px 4px;border-radius:5px;margin-left:-4px}
.ln.orig{color:var(--navy2)}
.ln.new{animation:hl 1.8s ease-out}
@keyframes hl{0%{background:#bfeedb}100%{background:transparent}}
.ln .x{position:absolute;right:0;top:0;opacity:0;border:none;background:none;color:var(--navy3);font-family:"DM Mono",monospace;font-size:13px;padding:0 4px}

.ln .x:hover{color:var(--lava)}

/* toast + tray */
.toasts{position:fixed;top:98px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--paper);color:var(--navy);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:13.5px;box-shadow:0 16px 30px -18px rgba(27,49,57,.6);animation:tin 2.6s forwards;display:flex;gap:8px;align-items:center}
.toast b{font-weight:600}
.toast .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
@keyframes tin{0%{opacity:0;transform:translateY(-10px)}10%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.drawer{position:fixed;right:24px;top:100px;width:360px;max-width:calc(100vw - 48px);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;z-index:50;box-shadow:0 30px 60px -30px rgba(27,49,57,.6);display:none;animation:rise .25s both}
.drawer.open{display:block}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.drawer .dh b{font-family:"Bricolage Grotesque",sans-serif;font-size:18px}
.drawer .it{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.drawer .it .k{display:block}
.xbtn{border:none;background:none;font-size:18px;color:var(--navy3)}

/* ---------- characters ---------- */
.char{display:block;overflow:visible}
.char g,.char path,.char ellipse,.char circle,.char rect{transform-box:view-box}
.char .bod{transform-origin:60px 142px;animation:breathe 3.8s ease-in-out infinite}
.char .head{transform-origin:60px 72px;animation:idlehead 7.5s ease-in-out infinite}
.char .nodg{transform-origin:60px 72px}
.char .eyes{transform-origin:60px 50px;animation:blink 4.8s infinite;animation-delay:var(--bd,0s)}
.char .brow{transition:transform .35s cubic-bezier(.2,.7,.2,1.4)}
.char .br{transform-origin:68px 42px}
.char .bl{transform-origin:52px 42px}
.char .mouth{opacity:0;transition:opacity .25s}
.char .arms-x,.char .arms-d{transition:opacity .45s ease,transform .55s cubic-bezier(.2,.7,.2,1.2)}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.014) translateY(-.4px)}}
@keyframes idlehead{0%,100%{transform:rotate(0)}30%{transform:rotate(1.6deg)}60%{transform:rotate(-1.2deg)}}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
/* moods */
.char.mood-skeptical .arms-x{opacity:1;transform:none}
.char.mood-skeptical .arms-d{opacity:0;transform:translateY(8px)}
.char.mood-skeptical .br{transform:translateY(-3px) rotate(-12deg)}
.char.mood-skeptical .bl{transform:rotate(6deg)}
.char.mood-skeptical .m-flat{opacity:1}
.char.mood-warming .arms-x,.char.mood-won .arms-x{opacity:0;transform:translateY(10px) scaleX(.92)}
.char.mood-warming .arms-d,.char.mood-won .arms-d{opacity:1;transform:none}
.char.mood-warming .m-hmm{opacity:1}
.char.mood-won .m-smile{opacity:1}
.char.mood-won .bl,.char.mood-won .br{transform:translateY(-1px)}
/* reactions (temporary, override mood mouth) */
.char.r-nod .nodg{animation:nod .95s cubic-bezier(.3,.6,.3,1)}
.char.r-nod .mouth{opacity:0}.char.r-nod .m-smile{opacity:1}
.char.r-hmm .nodg{animation:tilt 1.1s ease-in-out}
.char.r-hmm .br{transform:translateY(-4px) rotate(-14deg)}
.char.r-hmm .mouth{opacity:0}.char.r-hmm .m-hmm{opacity:1}
.char.r-shrug .bod{animation:shrug .9s ease-in-out}
.char.r-shrug .mouth{opacity:0}.char.r-shrug .m-hmm{opacity:1}
@keyframes nod{0%,100%{transform:rotate(0)}20%{transform:rotate(7deg) translateY(2px)}45%{transform:rotate(-1deg)}65%{transform:rotate(5deg) translateY(1px)}}
@keyframes tilt{0%,100%{transform:rotate(0)}35%,70%{transform:rotate(-7deg)}}
@keyframes shrug{0%,100%{transform:none}30%,60%{transform:translateY(-4px) scaleX(1.03)}}
.charwrap{position:relative;flex:none;transition:transform .45s cubic-bezier(.2,.7,.2,1.2);transform-origin:50% 100%}
.charwrap.speaking{transform:rotate(-2.5deg) translateY(-2px) scale(1.025)}
.charwrap .floor{position:absolute;left:12%;right:12%;bottom:-4px;height:10px;border-radius:50%;background:radial-gradient(rgba(27,49,57,.18),transparent 70%)}
.pc .charwrap{margin:-4px 0 0 -6px}
.pc:hover .charwrap{transform:rotate(-3deg) translateY(-2px)}

/* stage for the persona in a round */
.arena{display:flex;align-items:flex-end;gap:10px}
.bubble{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:13px 17px 14px;max-width:470px;margin-bottom:62px;box-shadow:0 14px 30px -22px rgba(27,49,57,.5);transform-origin:0 100%;animation:bubblein .5s cubic-bezier(.2,.7,.2,1.35) both}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:16px;height:16px;background:var(--paper);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 4px}
.bubble .who{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy3)}
.bubble .said{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:19px;line-height:1.25;letter-spacing:-.01em;margin-top:3px;min-height:24px}
.bubble .caret{display:inline-block;width:2px;height:1em;background:var(--navy);vertical-align:-2px;margin-left:1px;animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
@keyframes bubblein{from{opacity:0;transform:scale(.6) translate(-10px,10px)}to{opacity:1;transform:none}}
.mood-lbl{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:99px;display:inline-block;margin-top:6px}

.wonrow .w{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12.5px;font-weight:600;width:92px}

/* ---------- scope hero ---------- */
.gaugewrap{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 22px 22px;margin-bottom:18px;position:relative}
.gtop{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.gnum{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:76px;letter-spacing:-.045em;line-height:.85;transition:color .3s}
.gnum small{font-size:28px;color:var(--navy3);letter-spacing:-.02em}
.gnum.over{color:var(--lava)}
.gstat{font-weight:600;font-size:15px;padding-bottom:6px;text-align:right}
.gstat.bad{color:var(--lava)}.gstat.ok{color:var(--green-ink)}
.gauge{position:relative;height:30px;border-radius:10px;background:var(--oat2);margin-top:18px;overflow:visible}
.gfill{position:absolute;left:0;top:0;bottom:0;border-radius:10px 0 0 10px;background:linear-gradient(180deg,#19b981,var(--green));transition:width .7s cubic-bezier(.3,1.5,.4,1)}
.gfill.full{border-radius:10px 0 0 10px}
.gover{position:absolute;top:-4px;bottom:-4px;border-radius:0 10px 10px 0;background:repeating-linear-gradient(-45deg,var(--lava) 0 7px,#ff6a57 7px 14px);transition:width .7s cubic-bezier(.3,1.5,.4,1);box-shadow:0 6px 16px -6px rgba(255,54,33,.6)}
.gauge.over .gover{animation:overpulse 1.4s ease-in-out infinite}
.gauge.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes overpulse{0%,100%{filter:none}50%{filter:brightness(1.12)}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.gline{position:absolute;top:-10px;bottom:-10px;width:2px;background:var(--navy);border-radius:2px}
.gline span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-family:"DM Mono",monospace;font-size:10.5px;white-space:nowrap;color:var(--navy);letter-spacing:.06em}
.gticks{position:relative;height:16px;margin-top:6px}
.gticks span{position:absolute;transform:translateX(-50%);font-family:"DM Mono",monospace;font-size:10px;color:var(--navy3)}
.zones{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
@media (max-width:1250px){.zones{grid-template-columns:1fr}}
.zone{border-radius:16px;padding:12px;min-height:250px;transition:background .2s,border-color .2s,box-shadow .2s}
.zone.in{background:rgba(255,254,251,.7);border:1.5px solid var(--line2)}
.zone.out{background:transparent;border:1.5px dashed var(--line2)}
.zone.drag{border-color:var(--green);background:var(--green-soft);box-shadow:0 0 0 4px rgba(0,168,112,.12)}
.zone.out.drag{border-color:var(--navy3);background:#eef3f5;box-shadow:0 0 0 4px rgba(90,138,154,.14)}
.zh{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 10px}
.zh b{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;letter-spacing:-.01em}
.zbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.zone.out .zbody{grid-template-columns:1fr}
.zempty{color:#a9b9bf;font-size:13px;font-style:italic;padding:18px 6px;text-align:center;grid-column:1/-1}
.feat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:12px 13px 11px;cursor:grab;user-select:none;position:relative;box-shadow:0 2px 0 var(--line);transition:transform .18s,box-shadow .18s,opacity .2s}
.feat:hover{transform:translateY(-2px) rotate(-.5deg);box-shadow:0 14px 22px -16px rgba(27,49,57,.5)}
.feat:active{cursor:grabbing}
.feat.dragging{opacity:.35;transform:scale(.97)}
.feat.land{animation:land .45s cubic-bezier(.2,.7,.2,1.5)}
@keyframes land{0%{transform:scale(.86) rotate(-2deg)}100%{transform:none}}
.feat .top2{display:flex;justify-content:space-between;align-items:center}
.feat .pp2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
.feat .pp2 small{font-family:"DM Mono",monospace;font-weight:400;font-size:10.5px;color:var(--navy3);letter-spacing:.04em;margin-left:2px}
.feat .fn{font-weight:700;font-size:14.5px;margin-top:4px}
.feat .fd{font-size:12.5px;color:var(--navy2);margin-top:2px}
.feat .pw{margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.feat .pw .k{color:var(--navy2)}
.feat .mv{border:1px solid var(--line2);background:var(--oat);border-radius:7px;padding:3px 9px;font-size:12px;font-weight:600}
.feat .mv:hover{background:var(--oat2)}
.feat .grip{position:absolute;top:10px;right:10px;width:10px;height:14px;opacity:.35;background:radial-gradient(circle,var(--navy) 1.2px,transparent 1.4px) 0 0/5px 5px}
.zone.out .feat{background:transparent;box-shadow:none;border-style:dashed}
.zone.out .feat .fn{text-decoration:line-through;text-decoration-color:rgba(255,54,33,.6)}
.zone.out .feat .fd{display:none}
.primary.nudge{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
.seg{transition:background .35s var(--sd,0s)}
</style>
</head>
<body>

<div class="top">
  <a class="back" href="index.html">← All directions</a>
  <span class="tag">Direction C · The Gauntlet</span>
  <span class="title">Pressure test your idea</span>
  <span class="sp"></span>
  <button class="btn-reset" onclick="resetAll()">Reset</button>
</div>

<div class="hud" id="hud">
  <div class="grade">
    <div class="gl" id="gl"><span class="lt" id="glt">··</span></div>
    <div class="gmeta">
      <div class="k">Idea grade</div>
      <div class="lvl" id="glvl">Reading your idea</div>
      <div class="v num" id="gscore">score --</div>
    </div>
  </div>
  <div class="budget">
    <div class="row"><span class="k">Scope budget · one build day</span><span class="v num" id="bval"></span></div>
    <div class="bar" id="bbar"></div>
  </div>
  <div class="badges" id="badges"></div>
  <button class="traybtn" onclick="toggleTray()">Parked for v2 <span class="c num" id="tcount">0</span></button>
</div>

<div class="rail" id="rail"></div>

<div class="wrap">
  <main class="table" id="stage"></main>
  <aside class="brief" id="brief"></aside>
</div>

<div class="toasts" id="toasts"></div>
<div class="drawer" id="drawer"></div>

<script>
/* ---------------- data ---------------- */
const ORIG = "Our store managers throw away a lot of food at the end of the day. I want something that helps them order better and see where the waste is.";
const DIMS = [["problem","Problem"],["user","User & moment"],["objective","Objective"],["decision","Decision it drives"],["data","Data reality"],["scope","Scope for a day"],["success","Success test"],["risk","Biggest risk"]];
const DIMNAME = Object.fromEntries(DIMS);
const START = {problem:78,user:68,objective:58,decision:66,data:75,scope:62,success:60,risk:65};
const WORD_BUDGET = 120;
const PTS_BUDGET = 100;

const INTRO = [
  {dim:"problem", replace:true, fx:{problem:14},
   text:"“A lot of food” is hard to build for. Which food, and when does it get binned?",
   chips:["Fresh food and bakery binned at close, across 40 pilot stores.","Unsold pastries and sandwiches thrown out at 6pm close."]},
  {dim:"user", fx:{user:10},
   text:"Who opens this first, and before what?",
   chips:["Store managers, before the next day's order goes in."]},
];

const PERSONAS = [
  {id:"cfo", name:"Skeptical CFO", init:"CF", accent:"#FF3621", tough:3,
   line:"Margins are thin. Show me the pounds, not the pie chart.",
   intro:"Fine. Two questions, then I'm back in the budget meeting."},
  {id:"sm", name:"Store manager at 7am", init:"SM", accent:"#F59E0B", tough:2,
   line:"I have twelve minutes before doors open. Make it one tap.",
   intro:"Doors open at seven. I'm reading this on my phone by the coffee machine."},
  {id:"de", name:"Data engineer", init:"DE", accent:"#2E5A6B", tough:3,
   line:"I've looked at retail_commercial. Let's talk about what's actually in it.",
   intro:"I pulled workshop.retail_commercial. Stores, products, transactions, a sales forecast. No waste table."},
  {id:"gov", name:"Governance lead", init:"GL", accent:"#00A870", tough:2,
   line:"Store league tables get political fast. Who sees what?",
   intro:"I'm not here to block you. I'm here so this survives its first escalation."},
];
const PMAP = Object.fromEntries(PERSONAS.map(p=>[p.id,p]));

const CARDS = {
  cfo:[
    {id:"cfo1", sev:3, dim:"objective", text:"Waste is a symptom. What number moves, and by how much?",
     chips:["Cut end-of-day food waste 15% in 40 pilot stores within 8 weeks.","Track waste as % of food sales, weekly, per store.","Show pounds saved per store per month on the home screen."],
     fx:{objective:28,problem:4}, react:"That number is now the spine of the build. Everything else answers to it."},
    {id:"cfo2", sev:2, dim:"risk", text:"If stores order less, do we lose sales to empty shelves?",
     chips:["Treat sell-outs before 2pm as a lost-sales signal.","Recommend orders that balance waste against missed sales."],
     fx:{risk:14,decision:8}, react:"Good. The agent now weighs two things, not one. Much harder to game."},
  ],
  sm:[
    {id:"sm1", sev:3, dim:"user", text:"When exactly do I use this, and what do I tap?",
     chips:["Store manager, 6:45am, before placing tomorrow's bakery order.","One screen: suggested order, adjust a line, approve."],
     fx:{user:22,decision:10}, react:"Now I can picture the first screen. That's most of the design done."},
    {id:"sm2", sev:1, dim:"data", text:"There is no waste data in the seeded tables. And I won't log it at close, I'm mopping.",
     chips:["Generate a synthetic waste_log in my schema. No manual entry on day one.","Barcode-scan waste at close, as a later add."],
     fx:{data:8,risk:8}, react:"Right call for a one-day build. Generated data now, real waste feed later."},
  ],
  de:[
    {id:"de1", sev:3, dim:"data", text:"Waste logs are daily per site and product. No hourly data. Time-of-day ideas won't work.",
     chips:["Work at daily, site and product grain only.","Join waste_logs to daily_sales on site_id and date."],
     fx:{data:14}, react:"Grounded. You just dodged a mid-build surprise."},
    {id:"de2", sev:2, dim:"scope", text:"An order recommendation needs a forecast. That's a model, not a query.",
     chips:["Start with a 4-week same-weekday average, not ML.","Genie answers questions. The agent drafts the order."],
     fx:{scope:10,decision:6}, react:"Simple baseline first. You can earn the model in week two."},
  ],
  gov:[
    {id:"gov1", sev:2, dim:"risk", text:"Should a manager see other stores' waste?",
     chips:["Managers see their store. Area managers see their region.","Show other stores as anonymised ranks only."],
     fx:{risk:12}, react:"That keeps the league table useful without making it personal."},
    {id:"gov2", sev:1, dim:"decision", text:"The agent suggests an order and it's wrong. Who's accountable?",
     chips:["Every approve or override is saved in Lakebase with a reason."],
     fx:{decision:8,risk:6}, react:"Audit trail sorted. It doubles as training data later."},
  ],
};
/* what each persona says back when you play one of their cards */
const SAYS = {
  cfo:{m:["Fine. That I can put in a board pack.","Two numbers, not one. Now we're talking."], a:"You're owning that risk. Noted.", p:"Parked is not solved. But fine, not today.", won:"Alright. I'd fund a pilot.", warm:"Better. I still want to see it working."},
  sm:{m:["One screen before doors open. I'd actually use that.","No extra logging at close? You've got me."], a:"Okay. But if it's slow, I'm not using it.", p:"Later is fine. Today I need the order.", won:"Send me the link. I'll try it Monday.", warm:"Getting there. Keep it quick."},
  de:{m:["Daily grain. The tables will actually back you up.","A baseline I can build by lunch. Good."], a:"Your call. I'll flag it in the build notes.", p:"Sensible. That one was a week of work.", won:"This I can build. No surprises.", warm:"Mostly buildable. Watch the edges."},
  gov:{m:["Region-level access. That survives the first escalation.","Audit trail in Lakebase. I can sign that off."], a:"Accepted risks need an owner. Put your name on it.", p:"Park it, but don't ship without it.", won:"You have my sign-off.", warm:"Close. I'll want to see the access rules."},
};

/* illustrated characters: plain SVG, brand palette, idle + mood + reaction animation via CSS classes */
const LOOK = {
  cfo:{skin:"#f0c9a8", hair:"#a7b0b4", brow:"#7d888c", top:"#1B3139", sleeve:"#1B3139", bd:"0s"},
  sm:{skin:"#c68a62", hair:"#2b1d17", brow:"#2b1d17", top:"#F5F3EF", sleeve:"#e9e5de", bd:"1.3s"},
  de:{skin:"#8a5a3c", hair:"#1f1612", brow:"#1f1612", top:"#2E5A6B", sleeve:"#2E5A6B", bd:"2.1s"},
  gov:{skin:"#ecbf9a", hair:"#7a3e2a", brow:"#6a3322", top:"#046a48", sleeve:"#046a48", bd:".7s"},
};
function charSVG(pid, size=150, mood="skeptical"){
  const L=LOOK[pid], ink="#1B3139";
  const behind = pid==="gov" ? `<circle cx="60" cy="21" r="10" fill="${L.hair}"/><circle cx="60" cy="21" r="4" fill="rgba(0,0,0,.12)"/>`
    : pid==="de" ? `<path d="M30 96 Q60 64 90 96 Z" fill="#244b59"/>` : "";
  const detail = {
    cfo:`<path d="M50 90 L60 108 L70 90 Z" fill="#F5F3EF"/><path d="M58.2 95 L61.8 95 L63.6 117 L60 122 L56.4 117 Z" fill="#FF3621"/>

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const words = s => (s.trim().match(/\S+/g)||[]).length;
const clamp = v => Math.max(0, Math.min(97, v));
function letter(s){
  const t=[[97,"A+"],[93,"A"],[90,"A-"],[87,"B+"],[83,"B"],[80,"B-"],[77,"C+"],[73,"C"],[70,"C-"],[67,"D+"],[63,"D"],[60,"D-"]];
  for(const [v,l] of t) if(s>=v) return l; return "F";
}
const tier = l => "t"+l[0];
function level(s){ return s>=88?"Build-ready":s>=80?"Blueprint":s>=70?"Sketch":"Napkin"; }
function score(){ const v=Object.values(S.dims); return Math.round(v.reduce((a,b)=>a+b,0)/v.length); }
function bump(fx, f=1){ for(const k in fx) S.dims[k]=clamp(S.dims[k]+Math.round(fx[k]*f)); }
function pts(){ return FEATURES.reduce((a,f)=>a+(S.features[f.id]?f.pts:0),0); }
function toast(html){ const t=document.createElement("div"); t.className="toast"; t.innerHTML='<span class="dot"></span>'+html; $("toasts").appendChild(t); setTimeout(()=>t.remove(),2700); }
function think(container, label, ms, cb){
  const el=document.createElement("div"); el.className="think";
  el.innerHTML=`<div class="av">SA</div><span>${label}</span><div class="shim"></div>`;
  container.appendChild(el); setTimeout(()=>{ el.remove(); cb(); }, ms);
}
function addBrief(dim, text, replaceOrig){
  if(replaceOrig) S.brief = S.brief.filter(l=>!l.orig);
  S.brief.push({dim, text, fresh:true}); S.version++;
}
function earn(id){
  if(S.badges.includes(id)) return;

}
function parkedAll(){
  return S.parked.concat(FEATURES.filter(f=>!S.features[f.id]).map(f=>({text:f.name+" ("+f.pts+" pts)", from:"Scope cut"})));
}

/* ---------------- HUD ---------------- */
function renderHUD(){
  const gl=$("gl"), glt=$("glt");
  if(!S.revealed){ glt.textContent="··"; gl.className="gl"; $("glvl").textContent="Reading your idea"; $("gscore").textContent="score --"; }
  else{
    const sc=score(), L=letter(sc);
    if(L!==shownLetter){
      gl.classList.remove("flip"); void gl.offsetWidth; gl.classList.add("flip");
      setTimeout(()=>{ glt.textContent=L; }, 270);
      shownLetter=L;
    }
    gl.className="gl flip "+tier(L);
    if(lastScore!==null && sc!==lastScore){
      const d=document.createElement("span"); const diff=sc-lastScore;
      d.className="delta"+(diff<0?" neg":""); d.textContent=(diff>0?"+":"")+diff;
      gl.appendChild(d); setTimeout(()=>d.remove(),1500);
    }
    lastScore=sc;
    $("glvl").textContent=level(sc);
    $("gscore").textContent="score "+sc+" / 100";
  }
  const p=pts(), over=p-PTS_BUDGET;
  $("bval").innerHTML=`${p} / ${PTS_BUDGET} pts`+(over>0?`<span class="over">${over} over</span>`:"");
  const on=Math.min(20, Math.round(p/5));
  const bar=$("bbar");
  if(!bar.children.length) bar.innerHTML=Array.from({length:20},(_,i)=>`<div class="seg" style="--sd:${i*22}ms"></div>`).join("");
  [...bar.children].forEach((s,i)=>{ s.className="seg "+(i<on?(over>0?"hot":"on"):""); });
  $("badges").innerHTML=BADGES.map(b=>`<div class="badge ${S.badges.includes(b.id)?"on":""}">${b.svg}<div class="tip"><b>${b.name}</b>${S.badges.includes(b.id)?"Earned":b.how}</div></div>`).join("");
  $("tcount").textContent=parkedAll().length;
  renderBrief(); renderRail(); renderTray();
}
function renderRail(){
  const idx=STAGES.findIndex(s=>s[0]===S.stage);
  $("rail").innerHTML=STAGES.map((s,i)=>{
    let lab=s[1];
    if(s[0]==="round" && S.selected.length) lab=`Rounds ${Math.min(S.round+ (S.stage==="round"?1:0), S.selected.length)}/${S.selected.length}`;
    return `<span class="${i===idx?"on":i<idx?"done":""}">${i<idx?"✓ ":""}${lab}</span>`;
  }).join('<span class="sep">/</span>');
}
function renderBrief(){
  const w=S.brief.reduce((a,l)=>a+words(l.text),0);
  const pct=Math.min(100, w/WORD_BUDGET*100);
  const cls=w>WORD_BUDGET?"over":w>WORD_BUDGET*0.85?"warn":"";
  let h=`<div class="bh"><span class="bt">The brief</span><span class="ver">v${S.version}</span></div>
    <div class="wb"><div class="row"><span class="k">Word budget</span><span class="v num">${w} / ${WORD_BUDGET} words</span></div>
    <div class="wbar"><i class="${cls}" style="width:${pct}%"></i></div>
    ${w>WORD_BUDGET?`<div class="wnote">Over budget. Trim a line so the build stays sharp. Hover a line to remove it.</div>`:""}</div>`;
  for(const [k,label] of DIMS){
    const lines=S.brief.map((l,i)=>({...l,i})).filter(l=>l.dim===k);
    const L=S.revealed?letter(S.dims[k]):"";
    h+=`<div class="bs"><div class="lab"><span class="k">${label}</span>${L?`<span class="mini ${tier(L)}">${L}</span>`:""}</div>`;
    if(!lines.length) h+=`<div class="bempty">Not covered yet</div>`;
    for(const l of lines) h+=`<div class="ln ${l.orig?"orig":""} ${l.fresh?"new":""}">${esc(l.text)}${l.orig?"":`<button class="x" title="Remove line" onclick="removeLine(${l.i})">×</button>`}</div>`;
    h+=`</div>`;
  }
  $("brief").innerHTML=h;
  S.brief.forEach(l=>l.fresh=false);
}
function removeLine(i){
  const l=S.brief[i]; if(!l||l.orig) return;
  S.brief.splice(i,1); S.version++;

function drawCard(cid){

function personaReact(cid){
  const c=CARD[cid], pl=S.played[cid], say=SAYS[c.pid];

  const allDone=CARDS[c.pid].every(x=>S.played[x.id]);

function animNum(el, from, to){
  const t0=performance.now(), d=520;
  const step=t=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3);
    el.firstChild.nodeValue=Math.round(from+(to-from)*e); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function updateScope(first){
  const p=pts(), over=p-PTS_BUDGET;
  const g=$("gnum"); if(!g) return;
  animNum(g, shownPts??0, p); shownPts=p;
  g.classList.toggle("over", over>0);
  $("gfill").style.width=(Math.min(p,PTS_BUDGET)/GMAX*100)+"%";
  const ov=$("gover"); ov.style.left=(PTS_BUDGET/GMAX*100)+"%"; ov.style.width=(Math.max(0,over)/GMAX*100)+"%";
  const gauge=$("gauge"); gauge.classList.toggle("over", over>0);
  if(over>0 && !first){ gauge.classList.remove("shake"); void gauge.offsetWidth; gauge.classList.add("shake"); }
  const st=$("gstat"); st.className="gstat "+(over>0?"bad":"ok");
  st.innerHTML=over>0?`${over} points over the day`:`${-over} points spare<br><span class="hint" style="font-weight:400">your buffer for surprises</span>`;
  const nin=FEATURES.filter(f=>S.features[f.id]).length;
  $("zinc").textContent=`${nin} feature${nin===1?"":"s"} · ${p} pts`;
  $("zoutc").textContent=`${FEATURES.length-nin} parked`;
  ["zin","zout"].forEach(z=>{ const b=$(z); b.querySelector(".zempty")?.remove();

  const btn=$("scopeGo");
  btn.className="primary"+(over>0?"":" go");
  btn.textContent=over>0?`Cut ${over} more points to continue`:"Scope locked · write the exam →";
  $("scopeHint").textContent=over>0?"":"Parked features move to the v2 tray.";
  clearTimeout(nagTimer);
  if(over>0) nagTimer=setTimeout(()=>{ if(S.stage==="scope" && pts()>PTS_BUDGET){ S.nag++; saySA(NAGS[Math.min(S.nag,NAGS.length-1)],true); const gg=$("gauge"); gg?.classList.remove("shake"); void gg?.offsetWidth; gg?.classList.add("shake"); } }, 7000);
  if(first) saySA(S.scopeReact?.text || NAGS[0], S.scopeReact?S.scopeReact.warn:true, true);
}
function saySA(text, warn, instant){
  const box=$("scopeSA"); if(!box) return;

function moveFeat(id, toIn){
  if(!!S.features[id]===toIn) return;

/* exam */
function evalQ(q){
  q=q.trim();
  if(!q) return {ok:false,note:"Empty. Add a question."};
  const s=EXAM_SUGG.find(x=>x.q.toLowerCase()===q.toLowerCase()); if(s) return s;
  if(words(q)>15) return {ok:false,note:"Over 15 words. Tight questions make tight tests."};
  if(/\b(hour|hourly|minute|time of day|\d{1,2}\s?(am|pm))\b/i.test(q)) return {ok:false,note:"No hourly data in the seeded tables. Rephrase to daily."};
  if(/\bwhy\b/i.test(q)) return {ok:true,note:"Genie can show the what. The why may need notes. Fine as a stretch."};
  return {ok:true,note:"Answerable from the seeded tables, and a stranger could check it."};
}

      <input id="ex${i}" value="${esc(q)}" placeholder="Type a question, or tap a suggestion below" oninput="examInput(${i},this.value)" />
      <span class="wc num ${words(q)>15?"over":""}" id="wc${i}">${words(q)}/15</span></div>

    <div class="sa" style="animation:none"><div class="av">SA</div><div class="body"><div class="k">Suggestions · tap to fill the next empty slot</div>
      <div class="chips">${EXAM_SUGG.map((s,i)=>`<button class="chip ${S.exam.includes(s.q)?"used":""}" onclick="examSugg(${i})"><span class="plus">${S.exam.includes(s.q)?"✓":"+"}</span>${esc(s.q)}<span class="wc">${words(s.q)}w</span></button>`).join("")}</div></div></div>
    <div id="examThink"></div>

function projectMd(){
  const sc=score(), L=letter(sc);
  const feats=FEATURES.filter(f=>S.features[f.id]);
  let m=`# PROJECT.md · ${S.pitchName}\n`;
  m+=`Pressure test: ${L} (${sc}/100) · challengers: ${S.selected.map(id=>PMAP[id].name).join(", ")}\n\n`;
  m+=`## Idea (brief v${S.version})\n`;
  for(const [k,label] of DIMS){ S.brief.filter(l=>l.dim===k).forEach(l=>m+=`- ${label}: ${l.text}\n`); }
  m+=`\n## Decisions\n`;
  m+=`- In scope (${pts()}/${PTS_BUDGET} pts): ${feats.map(f=>f.name).join(", ")}\n`;
  m+=`- Data: workshop.retail_commercial (dim_store, dim_product, fact_transactions, sales_forecast), read-only. Generate waste_log in your own schema\n`;
  S.steps.filter(s=>["user","objective","decision"].includes(s.dim)).forEach(s=>m+=`- ${DIMNAME[s.dim]}: ${s.text}\n`);
  m+=`\n## Build steps\n`;
  const bsteps=S.steps.filter(s=>!["user","objective","decision"].includes(s.dim));
  bsteps.forEach((s,i)=>m+=`${i+1}. ${s.text}  (from ${s.from})\n`);
  if(!bsteps.length) m+=`(none from the gauntlet)\n`;
  m+=`\n## Success test (the exam)\n`;
  S.exam.forEach(q=>q.trim()&&(m+=`- [ ] ${q}\n`));
  m+=`\n## Risks and mitigations\n`;
  S.steps.filter(s=>s.dim==="risk").forEach(s=>m+=`- ${s.card}\n  Mitigation: ${s.text}\n`);
  S.risks.forEach(r=>m+=`- ${r.text}\n  ${r.mit}\n`);
  if(!S.risks.length && !S.steps.some(s=>s.dim==="risk")) m+=`(none named)\n`;
  m+=`\n## Parked for v2\n`;
  const pk=parkedAll(); pk.forEach(p=>m+=`- ${p.text}  (${p.from})\n`); if(!pk.length) m+=`(nothing parked)\n`;
  return m;
}
function hlMd(m){
  return esc(m).split("\n").map(l=>l.startsWith("# ")?`<span class="h1">${l}</span>`:l.startsWith("## ")?`<span class="h2">${l}</span>`:/\(from |\(Scope cut\)|\((Skeptical|Store|Data|Governance)/.test(l)?l.replace(/(\s\s\(.*\))$/,'<span class="dim">$1</span>'):l).join("\n");
}
function stHandoff(){
  const pk=parkedAll();
  $("stage").innerHTML=`<h2 class="h">Ready to build</h2>
    <p class="sub">Everything you played in the gauntlet lands here. This is exactly what flows into PROJECT.md for Genie Code. Nothing you said was theatre.</p>
    <div class="ready">
      <div class="st"><div class="n num">${letter(score())}</div><span class="k">Final grade</span></div>
      <div class="st"><div class="n num">${S.steps.length}</div><span class="k">Build steps</span></div>
      <div class="st"><div class="n num">${S.exam.filter(q=>q.trim()).length}</div><span class="k">Exam questions</span></div>
      <div class="st"><div class="n num">${S.risks.length+S.steps.filter(s=>s.dim==="risk").length}</div><span class="k">Risks handled</span></div>
      <div class="st"><div class="n num">${pk.length}</div><span class="k">Parked for v2</span></div>
    </div>
    <pre class="md">${hlMd(projectMd())}</pre>
    <div class="nav">
      <button class="primary go" onclick="toast('In the real flow, this seeds the Design step and PROJECT.md')">Send to Design →</button>
      <button class="ghost" onclick="navigator.clipboard?.writeText(projectMd());toast('PROJECT.md copied')">Copy PROJECT.md</button>
      <button class="ghost" onclick="go('report')">Back to report card</button>
    </div>`;
}

/* ---------------- boot ---------------- */
function resetAll(){ S=fresh(); shownLetter=null; lastScore=null; $("drawer").classList.remove("open"); render(); window.scrollTo({top:0}); }
resetAll();
</script>
