<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Direction B2 · The Sit-Down, refined</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&family=Newsreader:opsz,ital,wght@6..72,0,400;6..72,0,500;6..72,1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#1B3139; --navy2:#2E5A6B; --navy3:#5A8A9A;
    --oat:#F5F3EF; --oat2:#EEEDE9; --line:#e6e3dd; --line2:#d8d3ca;
    --green:#00A870; --green-soft:#e8f7f1; --green-ink:#046a48;
    --lava:#FF3621; --amber:#F59E0B; --paper:#fffefb;
    --serif:"Newsreader",Georgia,serif; --mono:"DM Mono",ui-monospace,monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"DM Sans",system-ui,sans-serif;color:var(--navy);background:var(--oat);
    -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;overflow:hidden}
  .tnum{font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;cursor:pointer}
  code{font-family:var(--mono);font-size:.9em}

  .top{height:52px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--oat)}
  .top a{color:var(--navy2);text-decoration:none;font-weight:500;font-size:14px}
  .top a:hover{color:var(--navy)}
  .tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--navy3);
    border:1px solid var(--line2);border-radius:99px;padding:3px 10px}
  .top .sp{flex:1}
  .btn-ghost{background:none;border:1px solid var(--line2);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
  .btn-ghost:hover{border-color:var(--navy3)}

  .stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(420px,1fr);height:calc(100% - 52px)}

  /* ---------- LEFT ---------- */
  .interview{overflow-y:auto;padding:32px 56px 90px;position:relative}
  .round{display:flex;align-items:center;gap:14px;margin-bottom:30px;max-width:720px}
  .round .segs{display:flex;gap:5px}
  .round .segs i{width:30px;height:4px;border-radius:4px;background:var(--line2);transition:background .5s var(--ease)}
  .round .segs i.done{background:var(--navy2)}
  .round .segs i.now{background:var(--green)}
  .round .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy3)}
  .round .lbl b{color:var(--navy);font-weight:500}
  .round .sp{flex:1}
  .lost{background:none;border:1px solid transparent;border-radius:99px;padding:4px 11px;font-size:13px;color:var(--navy3);display:inline-flex;gap:6px;align-items:center}
  .lost::before{content:"?";width:16px;height:16px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:10.5px;font-family:var(--mono)}
  .lost:hover{border-color:var(--line2);color:var(--navy)}

  .sa{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;max-width:640px}
  .sa .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--oat);
    font-family:var(--mono);font-size:11px;display:grid;place-items:center;margin-top:2px}
  .sa .who{font-size:12px;font-weight:600;color:var(--navy3);text-transform:uppercase;letter-spacing:.06em}
  .sa .say{font-size:16px;color:var(--navy2);line-height:1.55}
  .sa.push .say{color:var(--navy)}
  .pushtag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--lava);border:1px solid #ffc9c1;background:#fff4f2;border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:1px}

  /* stakeholder */
  .stk{display:flex;gap:14px;align-items:center;max-width:640px;margin-bottom:18px;padding:12px 16px 12px 12px;background:var(--paper);border:1px solid var(--line);border-radius:14px}
  .stk .face{flex:none;width:48px;height:48px}
  .stk .who{font-size:12px;font-weight:600;color:var(--navy2);text-transform:uppercase;letter-spacing:.06em}
  .stk .who span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--navy3);margin-left:6px;font-size:12.5px}
  .stk .line{font-family:var(--serif);font-size:19px;line-height:1.35;color:var(--navy);margin-top:1px}
  .stk .eyes{transform-box:fill-box;transform-origin:center;animation:blinkE 4.6s infinite}
  .stk .bob{animation:bob 3.8s ease-in-out infinite}
  .stk .brows{transform-box:fill-box;transform-origin:center;animation:brow 6s ease-in-out infinite}
  @keyframes blinkE{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  @keyframes bob{50%{transform:translateY(-.9px)}}
  @keyframes brow{0%,70%,100%{transform:none}78%,88%{transform:translateY(-1px)}}

  .q{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.14;letter-spacing:-.015em;
    margin:6px 0 10px;max-width:680px;color:var(--navy)}
  .q em{font-style:italic;color:var(--navy2)}
  .instr{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--navy3);margin:0 0 20px;max-width:640px}
  .instr::before{content:"";width:14px;height:1.5px;background:var(--green);flex:none}

  .opts{display:grid;gap:10px;max-width:640px}
  .opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:14px 18px;transition:border-color .2s,transform .2s var(--ease),box-shadow .2s,opacity .35s;width:100%}
  .opt:hover{border-color:var(--navy3);transform:translateY(-1px);box-shadow:0 6px 18px -12px rgba(27,49,57,.35)}
  .opt .k{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);font-family:var(--mono);
    font-size:11px;display:grid;place-items:center;color:var(--navy3);margin-top:1px}
  .opt .t{font-weight:600;font-size:15.5px}
  .opt .s{color:var(--navy3);font-size:13.5px;margin-top:1px}
  .opt .rec{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--green-ink);background:var(--green-soft);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px;text-transform:uppercase;letter-spacing:.05em}
  .opt.on{border-color:var(--green);background:var(--green-soft)}
  .opt.on .k{background:var(--green);border-color:var(--green);color:#fff}
  .opts.locked .opt{pointer-events:none}
  .opts.locked .opt:not(.on){opacity:.35;transform:none}
  /* free text card: same weight as an answer card */
  .opt.freec{cursor:text;border-style:dashed;border-color:var(--line2)}
  .opt.freec:hover{transform:none;box-shadow:none;border-color:var(--navy3)}
  .opt.freec:focus-within{border-style:solid;border-color:var(--navy2);background:#fff}
  .opt.freec.on{border-style:solid}
  .fw{flex:1;min-width:0}
  .fw textarea{display:block;width:100%;border:none;background:none;resize:none;font:inherit;font-size:15px;color:var(--navy);outline:none;padding:3px 0 0;min-height:24px;overflow:hidden}
  .fw textarea::placeholder{color:#a7b5b9}
  .fa{display:flex;justify-content:flex-end;margin-top:6px}
  .usebtn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
  .usebtn kbd{font-family:var(--mono);font-size:10px;opacity:.6}

  .freeline{display:flex;align-items:center;gap:10px;max-width:640px;margin-top:14px;border-bottom:1px solid var(--line2);padding:6px 2px}
  .freeline span{font-family:var(--mono);font-size:11px;color:var(--navy3);text-transform:uppercase;letter-spacing:.05em;flex:none}
  .freeline input{flex:1;border:none;background:none;font:inherit;font-size:15px;color:var(--navy);outline:none;padding:4px 0}
  .freeline input::placeholder{color:#a7b5b9}

  .react{max-width:640px;margin-top:24px;animation:rise .5s var(--ease) both}
  .acts{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:16px}
  .cont{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:600;
    display:inline-flex;align-items:center;gap:10px;transition:background .2s}
  .cont:hover{background:var(--navy2)}
  .cont:disabled{background:var(--line2);color:#fff;cursor:not-allowed}
  .cont kbd{font-family:var(--mono);font-size:10.5px;opacity:.6;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:0 5px}
  .link{background:none;border:none;color:var(--navy2);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:0;margin-left:14px}
  .link.nm{color:var(--navy3)}
  .nmwrap{max-width:640px;margin-top:12px}
  .nmwrap .link{margin-left:2px}

  .refl{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:4px 12px 12px 4px;padding:14px 18px;
    font-family:var(--serif);font-size:20px;line-height:1.4;color:var(--navy);max-width:640px}
  .refl .wcount{display:block;font-family:var(--mono);font-size:11px;color:var(--navy3);margin-top:6px}

  .thinking{display:flex;gap:12px;align-items:center;color:var(--navy3);font-size:14px;margin-top:10px}
  .shim{display:grid;gap:9px;width:420px;max-width:100%;margin-top:18px}
  .shim i{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--oat2) 0%,#fff 45%,var(--oat2) 90%);background-size:220% 100%;animation:shim 1.1s linear infinite}
  .shim i:nth-child(2){width:78%} .shim i:nth-child(3){width:56%}
  @keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .rise{animation:rise .55s var(--ease) both}
  .rise2{animation:rise .55s .08s var(--ease) both}
  .rise3{animation:rise .55s .16s var(--ease) both}

  .draft{max-width:620px;border-left:3px solid var(--line2);padding:4px 0 4px 20px;margin:4px 0 28px;
    font-family:var(--serif);font-size:22px;line-height:1.45;color:var(--navy2)}
  .draft small,.compare small{display:block;font-family:"DM Sans";font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy3);margin-bottom:6px}

  .compare{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;max-width:680px;margin:0 0 24px}
  .compare > div:not(.vs){background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--serif);font-size:16.5px;line-height:1.4}
  .compare > div:last-child{border-color:#f3d9a8;background:#fffaf0}
  .compare .vs{align-self:center;font-family:var(--mono);font-size:11px;color:var(--navy3)}

  .tables{display:flex;flex-wrap:wrap;gap:8px;max-width:640px;margin:12px 0 0}
  .tbl{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line2);background:var(--paper);border-radius:8px;padding:5px 10px;display:flex;gap:7px;align-items:center}
  .tbl i{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .tbl.miss{border-style:dashed;color:#8a5a00;background:#fffaf0;border-color:#f3d9a8}
  .tbl.miss i{background:none;border:1.5px solid var(--amber)}

  .propose{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;max-width:640px}
  .propose .pk{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--navy3)}
  .propose .pt{font-family:var(--serif);font-size:19px;line-height:1.4;margin:4px 0 10px}
  .propose .pa{display:flex;align-items:center;font-size:13.5px;color:var(--navy3)}
  .pbtn{background:var(--green-soft);color:var(--green-ink);border:1px solid #bfe6d5;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13.5px}
  .pbtn:hover{border-color:var(--green)}

  /* concepts */
  .concepts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:760px}
  .cc{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;
    display:flex;flex-direction:column;gap:8px;transition:border-color .2s,transform .25s var(--ease),box-shadow .2s,opacity .35s}
  .cc:hover{border-color:var(--navy3);transform:translateY(-2px);box-shadow:0 10px 26px -16px rgba(27,49,57,.4)}
  .cc svg{width:100%;height:84px;background:var(--oat);border-radius:10px}
  .cc .n{font-family:var(--mono);font-size:10.5px;color:var(--navy3);letter-spacing:.06em;text-transform:uppercase}
  .cc .t{font-family:var(--serif);font-size:21px;line-height:1.1}
  .cc .d{font-size:13px;color:var(--navy2)}
  .cc .pc{font-size:12.5px;display:grid;gap:3px;margin-top:2px}
  .cc .pc div{display:flex;gap:6px}
  .cc .pc b{font-family:var(--mono);font-weight:500;width:12px;flex:none}
  .cc .pc .p b{color:var(--green)} .cc .pc .m b{color:var(--lava)}
  .cc.on{border-color:var(--green);background:var(--green-soft)}
  .locked .cc{pointer-events:none} .locked .cc:not(.on){opacity:.35}
  #opts.locked .freec:not(.on){opacity:.35}

  /* budget */
  .budget{max-width:640px;margin:0 0 16px}
  .budget .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--navy3)}
  .budget .meta b{color:var(--navy);font-weight:600;font-size:15px}
  .budget .bar{height:12px;border-radius:7px;background:var(--oat2);position:relative;margin-top:8px}
  .budget .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--navy2);transition:width .45s var(--ease),background .3s}
  .budget .fill.over{background:var(--amber)}
  .budget .cap{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--navy)}
  .budget .cap::after{content:"one day";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--navy3);white-space:nowrap}
  .bmsg{font-size:13.5px;margin-top:9px;min-height:20px;color:var(--navy3)}
  .bmsg.over{color:#8a5a00}
  .scope{max-width:640px;display:grid;gap:8px}
  .srow{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 14px;transition:opacity .3s,background .3s;cursor:pointer}
  .srow.off{background:transparent;opacity:.6}
  .srow .nm{flex:1;font-weight:500}
  .srow .nm small{display:block;font-weight:400;color:var(--navy3);font-size:12.5px}
  .srow .hr{font-family:var(--mono);font-size:12.5px;color:var(--navy3);width:52px;text-align:right}
  .sw{width:38px;height:22px;border-radius:99px;background:var(--line2);border:none;position:relative;flex:none;transition:background .25s;pointer-events:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .sw.on{background:var(--green)} .sw.on::after{transform:translateX(16px)}
  .scope.locked .srow{pointer-events:none}

  /* read-back */
  .rb{max-width:660px;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .rbl{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:14px 20px;align-items:baseline}
  .rbl + .rbl{border-top:1px solid var(--line)}
  .rbl span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy3)}
  .rbt{font-family:var(--serif);font-size:19px;line-height:1.4;border-radius:6px;outline:none}
  .rbt[contenteditable=true]{background:#fff;box-shadow:0 0 0 2px var(--green-soft),0 0 0 3px var(--green);padding:2px 6px;margin:-2px -6px}

  /* ---------- RIGHT ---------- */
  .brief{background:var(--oat2);border-left:1px solid var(--line);overflow-y:auto;padding:0 28px 90px}
  .north{position:sticky;top:0;z-index:4;background:var(--oat2);padding:20px 0 14px}
  .north .in{border-left:3px solid var(--green);padding:2px 0 2px 14px}
  .north .nk{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--navy3);display:flex;gap:8px;align-items:center}
  .north .nk span{font-family:var(--mono);font-weight:500;font-size:10px;color:var(--green-ink);background:var(--green-soft);border-radius:4px;padding:0 6px}
  .north .nt{font-family:var(--serif);font-size:16.5px;line-height:1.4;color:var(--navy);margin-top:3px}
  .north .nt.flash{animation:nflash 1.6s ease}
  @keyframes nflash{0%{background:#cfeee0}100%{background:transparent}}
  .north .orig{font-family:var(--serif);font-size:14px;color:var(--navy3);margin-top:6px;text-decoration:line-through;text-decoration-color:var(--line2)}
  .north .nl{background:none;border:none;padding:0;margin-top:4px;font-size:12px;color:var(--navy3);text-decoration:underline;text-underline-offset:2px}

  .paper{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 0 var(--line),0 18px 40px -30px rgba(27,49,57,.35)}
  .bhead{display:flex;gap:18px;align-items:center;padding:18px 22px 16px;border-bottom:1px solid var(--line)}
  .dial{position:relative;width:74px;height:74px;flex:none}
  .dial svg{width:74px;height:74px;transform:rotate(-90deg)}
  .dial .ring{fill:none;stroke:var(--oat2);stroke-width:6}
  .dial .val{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease),stroke .6s}
  .dial .L{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:32px;letter-spacing:-.02em;font-weight:500}
  .dial .L.pop{animation:pop .6s var(--ease)}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
  .bhead .ttl{flex:1;min-width:0}
  .bhead .k{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy3)}
  .bhead .diff{font-size:13.5px;font-weight:600;color:var(--navy);margin:3px 0 4px;border-radius:4px;display:inline-block;padding:0 4px;margin-left:-4px}
  .bhead .diff.flash{animation:dflash 1.8s ease}
  @keyframes dflash{0%,30%{background:#cfeee0}100%{background:transparent}}
  .bhead .next{font-size:12.5px;color:var(--navy3);line-height:1.4}
  .bhead .next b{color:var(--navy2);font-weight:600}

  .sec{position:relative;padding:13px 22px 13px 25px;border-left:3px solid transparent;cursor:pointer;transition:background .25s,border-color .25s}
  .sec:hover{background:#fbf9f4}
  .sec.focus{border-left-color:var(--green);background:#f6fbf8}
  .sec.open{background:#fbf9f4;cursor:default;border-left-color:var(--navy2)}
  .sec + .sec{border-top:1px solid var(--line)}
  .sh{display:flex;align-items:center;gap:8px}
  .sh .lb{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--navy2)}
  .sh .from{font-family:var(--mono);font-size:10px;color:var(--navy3);border:1px dashed var(--line2);border-radius:4px;padding:0 5px}
  .sh .live{font-family:var(--mono);font-size:10px;color:var(--green-ink);display:inline-flex;align-items:center;gap:5px}
  .sh .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.25}}
  .sh .edit{font-size:11.5px;color:var(--navy3);opacity:0;transition:opacity .2s}
  .sec:hover .sh .edit{opacity:1}
  .sec.open .sh .edit{display:none}
  .sh .sp{flex:1}
  .gr{font-family:var(--mono);font-weight:500;font-size:13px;min-width:34px;text-align:center;border-radius:6px;padding:2px 6px;transition:background .3s,color .3s}
  .gr.flip{animation:flip .55s var(--ease)}
  @keyframes flip{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
  .gA{background:var(--green-soft);color:var(--green-ink)}
  .gB{background:#e6eff2;color:var(--navy2)}
  .gC{background:#fdf2dc;color:#8a5a00}
  .gD,.gF{background:#fff0ed;color:#c42613}
  .st{margin-top:5px;font-size:14.5px;line-height:1.55;color:var(--navy);min-height:1.2em}

  /* lost sheet */

  .steps button:hover{border-color:var(--navy3);background:#fff}

  /* handoff */
  .veil{position:fixed;inset:0;background:rgba(27,49,57,.42);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:44px 20px;overflow-y:auto;z-index:20}
  .veil.show{display:flex;animation:fadein .3s ease}
  @keyframes fadein{from{opacity:0}}
  .hand{width:min(940px,100%);background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(0,0,0,.5);animation:rise .5s var(--ease)}
  .hand .hh{display:flex;align-items:center;gap:18px;padding:24px 28px;background:var(--navy);color:#fff}

  .md .file i{width:8px;height:8px;border-radius:2px;background:var(--green)}

  .md .mit{color:var(--green-ink)}

  .side .k{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy3);margin-bottom:10px}

  @media (max-width:1100px){.interview{padding:26px 30px 80px}.q{font-size:30px}.concepts{grid-template-columns:1fr}.compare{grid-template-columns:1fr}.compare .vs{display:none}}
</style>

<body>
<div class="top">
  <a href="index.html">← All directions</a>
  <span class="tag">Direction B2 · The Sit-Down, refined</span>
  <span class="sp"></span>
  <button class="btn-ghost" onclick="init()">Reset</button>
</div>

<div class="stage">
  <section class="interview" id="left"></section>
  <aside class="brief">
    <div class="north" id="north"></div>
    <div class="paper">
      <div class="bhead">
        <div class="dial">
          <svg viewBox="0 0 74 74"><circle class="ring" cx="37" cy="37" r="31"/><circle class="val" id="dialval" cx="37" cy="37" r="31"/></svg>
          <div class="L" id="dialL">D+</div>
        </div>
        <div class="ttl">
          <div class="k" id="ver">Brief · v1</div>
          <div class="diff" id="diff"></div>
          <div class="next" id="next"></div>
        </div>
      </div>
      <div id="secs"></div>
      <div class="foot"><span>Grade history</span><div class="hist" id="hist"></div></div>
    </div>
  </aside>
</div>

<div class="sheetv" id="sheetv" onclick="if(event.target===this)closeSheet()"><div id="sheet"></div></div>
<div class="veil" id="veil"><div class="hand" id="hand"></div></div>

<script>
const LET=['F','D-','D','D+','C-','C','C+','B-','B','B+','A-','A'];
const gcls=g=>'g'+LET[g][0];
const SECS=[['problem','Problem'],['user','User & moment'],['objective','Objective'],['decision','Decision it drives'],
  ['data','Data reality'],['scope','Scope for a day'],['risk','Biggest risk']];
const LABEL=Object.fromEntries(SECS);
const budget=k=>k==='scope'?40:32;
const MAIN=[['problem','Problem'],['user','User & moment'],['objective','Objective'],['shape','Shape'],['fit','Fit it in a day'],['readback','Read-back']];
const ORIG="Our store managers throw away a lot of food at the end of the day. I want something that helps them order better and see where the waste is.";
const DRIFT=/\b(staff\w*|rota\w*|labou?r|schedul\w*|headcount|overstaff\w*|understaff\w*)\b/i;

// every low grade comes with the single next move
const NEXT={
  problem:"Say what goes wrong today, not what you want.",
  user:"Name the person and the moment they'd use it.",
  objective:"Name the number that should move.",
  decision:"Say what they'd do differently. Comes up in step 4.",
  data:"Name the tables. Comes up after the problem.",
  scope:"Fit it in a day. Comes up in step 5.",
  risk:"Name one thing that could go wrong.",
};
const SNIPS={
  problem:{n:"Put a rough cost on it so people feel it.",c:["Roughly £40 per store per day goes in the bin.","Worst on sandwiches and pastries."]},
  user:{n:"Say what they need in that moment.",c:["They need an answer before the 11am order cutoff.","On the back office tablet, not a laptop."]},
  objective:{n:"Anchor it to a baseline, or it can't be checked.",c:["Baseline: the first 8 weeks of the generated waste_log.","Measured weekly, per store."]},
  decision:{n:"Say what happens when they ignore it.",c:["If ignored, the usual order goes through unchanged.","Each accept or change is saved."]},
  data:{n:"Name the join. It saves an hour mid-build.",c:["Joined on store_id, product_id and date.","waste_log matches seeded stores and products."]},
  scope:{n:"Saying what's out is as useful as what's in.",c:["Out: drinks, milk and supplier systems.","One pilot store first."]},
  risk:{n:"One more worth watching.",c:["Managers won't trust a number without a reason.","Generated waste data may not match real patterns."]},
};

let S,T=[],KEYS=null,KEYS_SAVE=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const words=s=>(s||'').trim().split(/\s+/).filter(Boolean).length;
const later=(fn,ms)=>{T.push(setTimeout(fn,ms))};
const fin=t=>{t=(t||'').trim();if(!t)return t;t=t[0].toUpperCase()+t.slice(1);return /[.!?]$/.test(t)?t:t+'.'};
const lc=t=>!t?t:(t[0]==='£'?t:t[0].toLowerCase()+t.slice(1));
const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9£%]/g,'');

// scripted "tighten": drop filler, cap at 15 words, keep meaning
const FILL=/\b(i think|i guess|basically|really|just|kind of|sort of|actually|honestly|very|quite|probably|a bit|i want something that|something that|we want to|i want to|in order to)\b,?\s*/gi;
function tightenText(s){
  let t=(s||'').trim().replace(/\s+/g,' ');
  t=t.replace(FILL,'').replace(/\ba lot of\b/gi,'lots of').replace(/\s+([,.])/g,'$1').replace(/\s+/g,' ').trim();
  t=t.replace(/\b(who|that|which) (is|are)\b\s*/gi,'').replace(/\s+/g,' ').trim();
  let w=t.split(' ');
  if(w.length>15){w=w.slice(0,15);
    // cut at the last clause boundary so it reads as a whole thought
    let cut=-1;w.forEach((x,i)=>{if(i>=6&&/^(before|after|when|while|because|so|which|that|and|but|since|until)$/i.test(x))cut=i});
    if(cut>0)w=w.slice(0,cut);
    while(w.length&&/^(and|or|the|a|an|to|of|with|for|so|but|that|in|on|at|is|are)$/i.test(w[w.length-1].replace(/[,.;:]/g,'')))w.pop();
    t=w.join(' ').replace(/[,;:]$/,'')}
  return fin(t);
}

function init(){
  T.forEach(clearTimeout);T=[];KEYS=null;
  S={ver:1,verMark:-1,seq:0,step:null,visited:[],picks:{},parked:[],guard:null,metric:'',target:'',concept:null,
     feats:null,featsFor:null,pts:0,overBy:0,readback:null,diff:'',open:null,focus:[],showOrig:false,
     idea:{cur:ORIG,updated:false,proposed:''},
     sec:{
       problem:{t:'Store managers throw away a lot of food at the end of the day.',g:6,v1:1},
       user:{t:'Store managers.',g:3,v1:1},
       objective:{t:'Help them order better.',g:2,v1:1},
       decision:{t:'See where the waste is.',g:1,v1:1},
       data:{t:'',g:4,note:'Implied: sales and waste. Not named yet.'},
       scope:{t:'',g:3,note:'Not stated yet.'},
       risk:{t:'',g:1,note:'Not stated yet.'},
     }};
  $('veil').classList.remove('show');$('sheetv').classList.remove('show');
  S.hist=[{l:'v1',g:LET[overallIdx()]}];
  renderIdea();renderDoc();renderHead(true);renderHist();
  go('intro',true);
}

/* ---------------- right: idea + brief ---------------- */
function renderIdea(flash){
  $('north').innerHTML=`<div class="in"><div class="nk">Your idea${S.idea.updated?'<span>updated</span>':''}</div>
    <div class="nt ${flash?'flash':''}">${esc(S.idea.cur)}</div>
    ${S.idea.updated?(S.showOrig?`<div class="orig">${esc(ORIG)}</div><button class="nl" onclick="S.showOrig=false;renderIdea()">Hide original</button>`:`<button class="nl" onclick="S.showOrig=true;renderIdea()">See original</button>`):''}</div>`;
}
function overallIdx(){const v=SECS.map(s=>S.sec[s[0]].g);return Math.round(v.reduce((a,b)=>a+b,0)/v.length)}
function renderHead(silent){
  const i=overallIdx(),C=2*Math.PI*31,el=$('dialval');
  el.style.strokeDasharray=C;el.style.strokeDashoffset=C*(1-(i+.6)/11.6);
  el.style.stroke=i>=9?'var(--green)':i>=7?'var(--navy2)':i>=4?'var(--amber)':'var(--lava)';
  const L=$('dialL');
  if(L.textContent!==LET[i]){L.textContent=LET[i];if(!silent){L.classList.remove('pop');void L.offsetWidth;L.classList.add('pop')}}
  $('ver').textContent='Brief · v'+S.ver;
  const d=$('diff'),txt=S.diff||'Your idea, graded as written.';
  if(d.dataset.v!==txt){d.dataset.v=txt;d.textContent=txt;d.classList.remove('flash');void d.offsetWidth;if(S.diff)d.classList.add('flash')}
  const weak=SECS.map(s=>s[0]).filter(k=>S.sec[k].g<7).sort((a,b)=>S.sec[a].g-S.sec[b].g)[0];
  $('next').innerHTML=weak?`<b>Next move · ${LABEL[weak]}.</b> ${esc(NEXT[weak])}`:'<b>No weak spots.</b> Ready when you are.';
}
function renderHist(){$('hist').innerHTML=S.hist.map((h,i)=>(i?'<em>→</em>':'')+`<span title="${h.l}">${h.g}</span>`).join('')}
function snapshot(label){const g=LET[overallIdx()];if(S.hist[S.hist.length-1].g!==g)S.hist.push({l:label,g});renderHist()}
function bumpVer(){if(S.verMark===S.seq)return;S.verMark=S.seq;S.ver++;renderHead()}

function hl(t,last){let h=esc(t);if(last){const e=esc(last),i=h.lastIndexOf(e);if(i>-1)h=h.slice(0,i)+'<mark>'+e+'</mark>'+h.slice(i+e.length)}return h}
function secHTML(k){
  const s=S.sec[k],open=S.open===k,foc=S.focus.includes(k),w=words(s.t),b=budget(k),over=w>b;
  const tag=s.v1?'<span class="from">from your idea</span>':s.mine?'<span class="from">your words</span>':'';
  const body=open?`<div class="st ed" id="ed-${k}" contenteditable="true" spellcheck="false">${esc(s.t)}</div>`
    :`<div class="st ${s.t?'':'note'}" id="t-${k}">${s.t?hl(s.t,s.last):esc(s.note||'')}</div>`;
  let extra='';
  if(open){
    extra=`<div class="wc tnum"><span id="wc-${k}">${w} / ${b} words</span><button class="tighten" id="tg-${k}" onclick="tightenSec('${k}')" ${over?'':'hidden'}>Tighten</button></div>
      <div class="snips"><div class="snt"><span class="av">SA</span><span>${esc(SNIPS[k].n)}</span></div>
      <div class="cs">${SNIPS[k].c.map((c,i)=>`<button class="snip ${(s.used||[]).includes(i)?'used':''}" onclick="addSnip('${k}',${i})">${esc(c)}</button>`).join('')}</div>
      <div class="srowx"><button class="done" onclick="closeSec('${k}')">Done</button><span class="hint">Type straight into the text, or tap a snippet.</span></div></div>`;
  }else if(over){
    extra=`<div class="wc warn tnum">Over by ${w-b} words. Short beats complete. <button class="tighten" onclick="event.stopPropagation();tightenSec('${k}')">Tighten</button></div>`;
  }else if(s.g<7){
    extra=`<div class="nmove">${esc(NEXT[k])}</div>`;
  }
  return `<div class="sec ${foc?'focus':''} ${open?'open':''}" data-k="${k}" ${open?'':`onclick="openSec('${k}')"`}>
    <div class="sh"><span class="lb">${LABEL[k]}</span>${tag}${foc?'<span class="live">on the left now</span>':''}
      <span class="sp"></span><span class="edit">Edit</span><span class="gr ${gcls(s.g)}" id="g-${k}">${LET[s.g]}</span></div>
    ${body}${extra}</div>`;
}
function renderDoc(){$('secs').innerHTML=SECS.map(s=>secHTML(s[0])).join('');if(S.open)wireEd(S.open)}
function renderSec(k){const el=document.querySelector(`.sec[data-k="${k}"]`);if(!el)return renderDoc();el.outerHTML=secHTML(k);if(S.open===k)wireEd(k)}
function setFocus(keys){S.focus=keys;renderDoc();
  const el=document.querySelector(`.sec[data-k="${keys[0]}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})}

function openSec(k){if(S.open&&S.open!==k)closeSec(S.open);S.open=k;renderSec(k);
  const ed=$('ed-'+k);if(ed){ed.focus();const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);const g=getSelection();g.removeAllRanges();g.addRange(r)}}
function wireEd(k){const ed=$('ed-'+k);if(!ed)return;
  ed.oninput=()=>{const w=words((ed.innerText??ed.textContent)),b=budget(k);$('wc-'+k).textContent=`${w} / ${b} words`;$('tg-'+k).hidden=w<=b};
  ed.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();closeSec(k)}if(e.key==='Escape')closeSec(k)}}
function edText(k){const ed=$('ed-'+k);return ed?(ed.innerText??ed.textContent).trim().replace(/\s+/g,' '):S.sec[k].t}
function closeSec(k){
  const s=S.sec[k],t=edText(k);S.open=null;
  if(t&&t!==s.t){s.t=t;s.v1=0;s.mine=1;s.last=null;bumpVer();
    const w=words(t);
    if(w>budget(k)){renderSec(k);toast('Saved. It is over the word budget, so Tighten is waiting.');return}
    renderSec(k);if(w>=5)setGrade(k,Math.min(10,s.g+1),'You edited');return}
  renderSec(k);
}
function addSnip(k,i){
  const s=S.sec[k],c=SNIPS[k].c[i],base=S.open===k?edText(k):s.t;
  s.t=(base?base.replace(/\s*$/,'')+' ':'')+c;s.last=c;s.v1=0;(s.used=s.used||[]).push(i);bumpVer();
  renderSec(k);setGrade(k,Math.min(11,s.g+1));
}
function tightenSec(k){
  const s=S.sec[k],b=budget(k),src=S.open===k?edText(k):s.t;
  const sent=src.match(/[^.!?]+[.!?]*/g)||[src];let out='';
  for(const x of sent){if(words(out+x)>b)break;out+=x}
  s.t=(out||src.split(/\s+/).slice(0,b).join(' ')).trim();s.last=null;bumpVer();renderSec(k);
  toast('Trimmed to '+words(s.t)+' words. Kept the sharpest lines.');
}
function setGrade(k,g,why){
  const s=S.sec[k],from=s.g;g=Math.max(0,Math.min(11,g));if(g===from)return;
  s.g=g;const el=$('g-'+k);
  if(el){el.className='gr flip '+gcls(g);el.textContent=LET[g]}
  S.diff=`${why||(g>from?'Sharper':'Changed')}: ${LABEL[k]} ${LET[from]} → ${LET[g]}`;
  renderHead();
  if(!S.open||S.open!==k){const sec=document.querySelector(`.sec[data-k="${k}"] .nmove`);if(sec&&g>=7)renderSec(k)}
}
// write a section with a quick typewriter, then settle the grade
function write(k,text,g,o={}){
  const s=S.sec[k];s.t=fin(text);s.v1=0;s.mine=!!o.mine;s.last=null;s.used=[];bumpVer();
  if(S.open===k)S.open=null;renderSec(k);
  const el=$('t-'+k),txt=s.t;if(!el){setGrade(k,g);return}
  el.classList.remove('note');let i=0;const step=Math.max(1,Math.ceil(txt.length/50));
  (function tick(){if(s.t!==txt)return;

function reflect(el,text,cb){

    const a=()=>{KEYS=null;cb(same?fin(text):t,!same?false:true)},b=()=>{KEYS=null;cb(fin(text),true)};

    opts:()=>[['Down 15% in 8 weeks','Ambitious, fits a pilot'],['Down 10% this quarter','Safer, easier to defend'],['Down 20% in the pilot stores',"Big, but only where you're watching"]]
      .map(([t,s])=>({t,s,go:()=>tgt(t)})),
    onFree:(v,mine)=>tgt(v,1)},

  shape:{main:'shape',focus:['decision'],render(L){
    L.innerHTML=head(this)+saHTML("Three ways to build it. Same data underneath. They differ in who does the thinking.")+
      `<h1 class="q rise2">Which one would your managers <em>actually open?</em></h1>`+instr("Pick one, or describe your own.")+
      `<div class="concepts rise3" id="cc">${CONCEPTS.map((c,i)=>`<button class="cc" data-i="${i}">${SVG[c.k]()}<div class="n">${c.n}</div><div class="t">${c.t}</div><div class="d">${c.d}</div>
        <div class="pc"><div class="p"><b>+</b>${c.p}</div><div class="m"><b>−</b>${c.m}</div></div></button>`).join('')}</div>
      <div class="opts rise3" id="opts" style="margin-top:12px;max-width:760px">${freeCard('e.g. a text at 7am with the three items to cut from the order')}</div><div id="react"></div>`;
    const lock=()=>{KEYS=null;$('cc').classList.add('locked');$('opts').classList.add('locked')};
    const pick=i=>{lock();$('cc').children[i].classList.add('on');S.concept=CONCEPTS[i];let say,push=0;
      if(i===0){write('decision',"Accept or adjust a suggested quantity for each fresh item, before the order goes.",10);say="My pick too. It meets the manager in the moment you chose."}
      if(i===1){write('decision','Spot which products and days drive the waste.',7);say="Honest note: this shows the waste, it doesn't change the order. Fine for a day.";push=1}
      if(i===2){write('decision','Approve or override each line of an agent-drafted order. Every decision is recorded.',10);say="Ambitious for one day. We'll need to cut hard in the next step."}
      handle({say,push,next:'fit',sec:'decision'})};
    document.querySelectorAll('#cc .cc').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
    wireFree(v=>{lock();$('freec').classList.add('on');
      reflect($('react'),v,f=>{S.concept={k:'custom',t:'Your version',n:'Your own'};write('decision',f,8,{mine:1});
        handle({say:"I like it. I'll map it to the closest pattern when we build.",next:'fit',sec:'decision'})})});
    KEYS={1:()=>pick(0),2:()=>pick(1),3:()=>pick(2)};
  }},

  fit:{main:'fit',focus:['scope'],render(L){
    const k=S.concept?S.concept.k:'coach',agent=k==='agent',dash=k==='dash';
    if(!S.feats||S.featsFor!==k){S.featsFor=k;S.feats=[
      {k:'qty',n:agent?'Agent drafts a quantity per item':'Suggested quantity per item',p:agent?45:35,s:dash?'A suggestion on top of the view':'The core of it',on:true},
      {k:'why',n:'One-line reason per suggestion',p:15,s:'Why a manager would trust it',on:true},
      {k:'save',n:'Accept or adjust, saved to Lakebase',p:15,s:'A record of every decision',on:true},
      {k:'dash',n:'Waste by product and day',p:25,s:dash?'The core of it':'A view of where waste happens',on:true},
      {k:'photo',n:'Photo waste logging at close',p:40,s:'Snap the bin, count the items. Camera work.',on:true}]}
    const MAX=170;
    L.innerHTML=head(this)+saHTML("A day goes fast. Keep what the manager needs tomorrow morning, park the rest. Nothing parked is lost.")+
      `<h1 class="q rise2">You have <em>100 build points.</em> Spend them.</h1>`+instr("Switch features off until the bar is under the line.")+
      `<div class="budget rise3"><div class="meta"><span id="bm"></span><span class="tnum">100 points = one day</span></div>
        <div class="bar"><div class="fill" id="bf"></div><div class="cap" style="left:${100/MAX*100}%"></div></div><div class="bmsg" id="bmsg"></div></div>
      <div class="scope rise3" id="sc"></div>
      <div class="freeline rise3"><span>Something else it must do</span><input id="addf" placeholder="Type it and press enter, your SA prices it" /></div>
      <div id="react"><div class="acts"><button class="cont" id="cont">Lock scope <kbd>↵</kbd></button></div></div>`;
    const total=()=>S.feats.filter(f=>f.on).reduce((a,f)=>a+f.p,0);
    const draw=()=>{
      $('sc').innerHTML=S.feats.map((f,i)=>`<div class="srow ${f.on?'':'off'}" data-i="${i}"><button class="sw ${f.on?'on':''}" aria-label="toggle"></button><div class="nm">${esc(f.n)}<small>${esc(f.s)}</small></div><div class="hr tnum">${f.p} pts</div></div>`).join('');
      document.querySelectorAll('#sc .srow').forEach(r=>r.onclick=()=>{const f=S.feats[+r.dataset.i];f.on=!f.on;draw()});
      const t=total(),over=t>100;
      $('bf').style.width=Math.min(100,t/MAX*100)+'%';$('bf').classList.toggle('over',over);
      $('bm').innerHTML=`<b class="tnum">${t}</b> of 100 points`;
      const m=$('bmsg');m.className='bmsg'+(over?' over':'');
      m.textContent=over?`${t-100} over. Switch one off, or lock it anyway.`:t===0?'Nothing in the build yet.':`${100-t} points to spare. That's breathing room for the afternoon.`;
      $('cont').innerHTML=over?'Lock it anyway':'Lock scope <kbd>↵</kbd>';
    };
    draw();
    const price=v=>/photo|camera|image|scan|barcode/i.test(v)?40:/agent|forecast|predict|model/i.test(v)?30:/email|text|sms|notify|alert|message/i.test(v)?15:20;
    $('addf').addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.value.trim())return;const v=e.target.value.trim();e.target.value='';
      const p=price(v);S.feats.push({k:'c'+S.feats.length,n:fin(v).replace(/\.$/,''),p,s:'Your addition · SA estimate',on:true});draw();toast(`Your SA prices that at ${p} points.`)});
    const done=()=>{KEYS=null;$('sc').classList.add('locked');const t=total(),over=t>100;S.pts=t;S.overBy=Math.max(0,t-100);
      const inn=S.feats.filter(f=>f.on).map(f=>f.n),out=S.feats.filter(f=>!f.on).map(f=>f.n);
      out.forEach(o=>{if(!S.parked.includes(o))S.parked.push(o)});
      write('scope',`One store, fresh food only. In: ${inn.map(lc).join(', ')||'nothing yet'}.`,over?7:inn.length?10:4);
      handle({say:over?`Still ${t-100} over. Expect to cut something mid-afternoon. I've noted it as a risk.`:"That fits in a day. Everything you parked is on the v2 list.",push:over,next:'readback'});
    };
    $('cont').onclick=done;KEYS={Enter:done};
  }},

  readback:{main:'readback',focus:['user','decision','objective'],render(L){
    const c=S.concept&&S.concept.k!=='custom'?S.concept.t+'. ':'';
    const lines=S.readback||[fin(S.sec.user.t),fin(c+S.sec.decision.t),fin(S.sec.objective.t)];
    L.innerHTML=head(this)+saHTML("Last step. Here's the whole thing in three lines. This is what the build starts from.")+
      `<h1 class="q rise2">Here's what <em>we're building.</em></h1>`+instr("Read it. Confirm, or fix any line.")+
      `<div class="rb rise3" id="rb">${['Who','What','Worked if'].map((k,i)=>`<div class="rbl"><span>${k}</span><div class="rbt" data-i="${i}">${esc(lines[i])}</div></div>`).join('')}</div>
      <div class="acts rise3" id="rba"><button class="cont" id="yes">Confirm and build <kbd>↵</kbd></button><button class="link" id="edit">Fix a line</button></div>`;
    const grab=()=>[...document.querySelectorAll('#rb .rbt')].map(e=>(e.innerText??e.textContent).trim());
    const yes=()=>{KEYS=null;S.readback=grab();finish()};
    $('yes').onclick=yes;KEYS={Enter:yes};
    $('edit').onclick=()=>{KEYS=null;const els=document.querySelectorAll('#rb .rbt');els.forEach(e=>e.contentEditable=true);els[0].focus();
      $('rba').innerHTML=`<button class="cont" id="save">Save my version</button><span style="margin-left:14px;color:var(--navy3);font-size:13px">One sentence each. These go into PROJECT.md as written.</span>`;
      $('save').onclick=()=>{els.forEach(e=>e.contentEditable=false);S.readback=grab();bumpVer();toast('Saved. Your wording is the one-liner in PROJECT.md.');later(finish,600)}};
  }},
};

/* ---------------- finish + handoff ---------------- */
function finish(){
  snapshot('read-back');setFocus([]);S.step='done';
  const g=overallIdx(),from=S.hist[0].g;
  const L=$('left');
  L.innerHTML=`<div class="round rise"><div class="segs">${MAIN.map(()=>'<i class="done"></i>').join('')}</div><div class="lbl">All six steps</div><span class="sp"></span></div>
    ${saHTML(g>=9?"That's a build-ready brief. Nice work.":"It's buildable. The weak spots are flagged in PROJECT.md so they don't surprise you mid-build.")}
    <h1 class="q rise2" style="font-size:56px">${from} <em style="color:var(--line2)">→</em> ${LET[g]}</h1>`+
    instr("Open the handoff to see exactly what goes into PROJECT.md. You can still edit any section on the right first.")+
    `<button class="cont rise3" style="margin-top:6px" onclick="handoff()">Open the handoff <kbd>↵</kbd></button><button class="link rise3" onclick="init()">Start over</button>`;
  KEYS={Enter:handoff};
}
function handoff(){
  const s=S.sec,g=LET[overallIdx()],c=S.concept||{t:'Order coach',k:'coach'};
  const im={coach:'browse_act',dash:'monitor',agent:'agent_actions',custom:'browse_act'}[c.k];
  const parked=[...S.parked];
  if(S.concept)CONCEPTS.filter(x=>x.t!==c.t).forEach(x=>parked.push(x.t+' (considered, not chosen)'));
  const risks=[];if(s.risk.t)risks.push(s.risk.t);
  if(S.overBy>0)risks.push(`Scope is ${S.pts} points against 100 for the day. Expect to cut.`);
  const mit=t=>t.replace(/Guardrail:/,'<span class="mit">Mitigation:</span>');
  const rb=S.readback||[s.user.t,s.decision.t,s.objective.t];
  const inn=(S.feats||[]).filter(f=>f.on);
  const weak=SECS.filter(x=>s[x[0]].g<7);
  $('hand').innerHTML=`
    <div class="hh"><div class="big tnum">${S.hist[0].g}<small>→</small>${g}</div><div><h3>Ready to build</h3><p>${S.ver} versions · ${S.hist.length} grade steps${S.idea.updated?' · idea updated':''}</p></div><span class="sp"></span><button class="btn-ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="$('veil').classList.remove('show')">Close</button></div>
    <div class="body">
      <div class="md">
        <div class="file"><i></i>PROJECT.md · what flows in</div>
        <h4>What we're building</h4><div class="one">${rb.map(l=>`<div>${esc(l)}</div>`).join('')}</div>
        <h4>Decisions</h4>
        <div class="kv"><span>Your idea</span><div>${esc(S.idea.cur)}</div>
          <span>Interaction model</span><div>${esc(c.t)} <code style="color:var(--navy3)">${im}</code></div>
          <span>User &amp; moment</span><div>${esc(s.user.t)}</div>
          <span>Objective</span><div>${esc(s.objective.t)}</div>
          <span>Decision it drives</span><div>${esc(s.decision.t)}</div>
          <span>Scope</span><div>${inn.length?esc(inn.map(f=>f.n).join(', '))+` <span style="color:var(--navy3)">(${S.pts} / 100 pts)</span>`:'<span class="open">open · not scoped</span>'}</div></div>
        <h4>Data plan</h4><ul><li>Seeded, read only: <code>workshop.retail_commercial</code> dim_store, dim_product, fact_transactions, sales_forecast</li>
          <li>Generate in your own schema: <code>waste_log</code> (store_id, product_id, date, qty_wasted, cost), aligned to the seeded stores and products</li></ul>
        <h4>Risks &amp; mitigations</h4>${risks.length?`<ul>${risks.map(r=>`<li>${mit(esc(r))}</li>`).join('')}</ul>`:'<p><span class="open">none named</span></p>'}
        ${weak.length?`<h4>Weak spots</h4><ul>${weak.map(x=>`<li>${x[1]} (${LET[s[x[0]].g]}). ${esc(NEXT[x[0]])}</li>`).join('')}</ul>`:''}
        <h4>Parked for v2</h4>${parked.length?`<ul>${parked.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:'<p style="color:var(--navy3)">Nothing parked.</p>'}
      </div>
      <div class="side">
        <div class="k">Report card</div>
        <div class="gl">${SECS.map(x=>`<div><span>${x[1]}</span><span class="gr ${gcls(s[x[0]].g)}">${LET[s[x[0]].g]}</span></div>`).join('')}</div>
        <div class="k">Grade history</div>
        <div class="hist" style="margin-bottom:18px">${S.hist.map((h,i)=>(i?'<em>→</em>':'')+`<span>${h.g}</span>`).join('')}</div>
        <button class="ship" onclick="toast('Prototype: this would generate the build plan from PROJECT.md.')">Generate build plan</button>
        <button class="btn-ghost back" onclick="$('veil').classList.remove('show')">Back to the brief</button>
      </div>
    </div>`;
  $('veil').classList.add('show');
}

/* ---------------- I'm lost ---------------- */
function lost(){
  const cur=STEPS[S.step],i=cur&&cur.main?MAIN.findIndex(m=>m[0]===cur.main)+1:0;
  const decided=['user','problem','objective','decision','scope'].filter(k=>S.sec[k].t&&!S.sec[k].v1&&S.sec[k].g>=7).slice(0,3)
    .map(k=>`<li><b>${LABEL[k]}.</b> ${esc(S.sec[k].t)}</li>`);
  const todo=MAIN.slice(i).map(m=>m[1]);
  const back=MAIN.filter(m=>S.visited.includes(m[0])&&(!cur||m[0]!==cur.main));
  const here=i?`Step ${i} of 6 · ${MAIN[i-1][1]}`:S.step==='done'?'All six steps done':'Just getting started';
  $('sheet').innerHTML=`<div class="sh-in"><div class="shk">Here's where we are</div><h3>${here}</h3>
    <div class="shidea"><small>Your idea</small>${esc(S.idea.cur)}</div>
    <div class="shcols"><div><div class="shk">Decided so far</div>${decided.length?`<ul>${decided.join('')}</ul>`:`<p class="muted">Nothing locked in yet. That's fine.</p>`}</div>
      <div><div class="shk">Still to do</div><p class="muted">${todo.length?todo.join(' → '):'Just the handoff.'}</p></div></div>
    <div class="shk" style="margin-top:20px">What would help?</div>
    <div class="shopts">
      <button class="opt" onclick="closeSheet()"><span class="k">1</span><span><div class="t">Keep going</div><div class="s">Pick up where you left off</div></span></button>
      ${cur&&cur.main?`<button class="opt" onclick="closeSheet();go('${cur.main}')"><span class="k">2</span><span><div class="t">Start this question over</div><div class="s">Your other answers stay as they are</div></span></button>`:''}
      ${back.length?`<div class="opt goback"><span class="k">${cur&&cur.main?3:2}</span><span><div class="t">Go back to a step</div><div class="steps">${back.map(m=>`<button onclick="closeSheet();go('${m[0]}')">${m[1]}</button>`).join('')}</div></span></div>`:''}
    </div></div>`;
  $('sheetv').classList.add('show');KEYS_SAVE=KEYS;
  KEYS={Escape:closeSheet,1:closeSheet};if(cur&&cur.main)KEYS[2]=()=>{closeSheet();go(cur.main)};
}
function closeSheet(){$('sheetv').classList.remove('show');KEYS=KEYS_SAVE;KEYS_SAVE=null}

/* ---------------- concept sketches ---------------- */
const SVG={
  coach:()=>`<svg viewBox="0 0 200 84" fill="none" stroke="#5A8A9A" stroke-width="1.4">
    <rect x="40" y="8" width="120" height="68" rx="6" fill="#fff"/>
    ${[0,1,2,3].map(i=>`<line x1="50" y1="${22+i*14}" x2="${100-i*8}" y2="${22+i*14}" stroke-width="2.2" stroke-linecap="round" stroke="#c9d3d6"/>
     <rect x="120" y="${16+i*14}" width="28" height="11" rx="3" ${i===1?'fill="#e8f7f1" stroke="#00A870"':'fill="#F5F3EF"'}/>`).join('')}</svg>`,
  dash:()=>`<svg viewBox="0 0 200 84" fill="none" stroke="#5A8A9A" stroke-width="1.4">
    <rect x="40" y="8" width="120" height="68" rx="6" fill="#fff"/>
    ${[26,40,18,48,34,22,42].map((h,i)=>`<rect x="${52+i*14}" y="${68-h}" width="8" height="${h}" rx="1.5" fill="${i===3?'#FF3621':'#c9d3d6'}" stroke="none"/>`).join('')}
    <line x1="48" y1="68" x2="152" y2="68"/></svg>`,
  agent:()=>`<svg viewBox="0 0 200 84" fill="none" stroke="#5A8A9A" stroke-width="1.4">
    <rect x="52" y="20" width="104" height="56" rx="6" fill="#EEEDE9"/><rect x="46" y="14" width="104" height="56" rx="6" fill="#F5F3EF"/>
    <rect x="40" y="8" width="104" height="56" rx="6" fill="#fff"/>
    <circle cx="54" cy="22" r="5" fill="#1B3139" stroke="none"/>
    <line x1="64" y1="22" x2="110" y2="22" stroke-width="2.2" stroke-linecap="round" stroke="#c9d3d6"/>
    <line x1="50" y1="38" x2="128" y2="38" stroke-width="2.2" stroke-linecap="round" stroke="#c9d3d6"/>
    <rect x="84" y="46" width="24" height="11" rx="3" fill="#e8f7f1" stroke="#00A870"/><path d="M90 51.5 l2.5 2.5 5-5" stroke="#00A870"/>
    <rect x="112" y="46" width="24" height="11" rx="3" fill="#fff"/><path d="M121 49 l6 5 M127 49 l-6 5" stroke="#FF3621"/></svg>`,
};

init();
</script>
